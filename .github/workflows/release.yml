---
name: Release

# Publish the collection to Ansible Galaxy on tag push. Expects repo secret
# ANSIBLE_GALAXY_API_KEY to be set (Galaxy → Preferences → API Key).

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible-core>=2.16'

      - name: Verify tag matches galaxy.yml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep '^version:' galaxy.yml | awk '{print $2}' | tr -d '"')
          if [ "$tag" != "$ver" ]; then
            echo "Tag v$tag does not match galaxy.yml version $ver"
            exit 1
          fi

      - name: Build collection tarball
        run: |
          ansible-galaxy collection build --force --output-path ./dist

      - name: Publish to Ansible Galaxy
        env:
          ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
        run: |
          ansible-galaxy collection publish ./dist/*.tar.gz \
            --api-key "$ANSIBLE_GALAXY_API_KEY"

      - name: Attach tarball to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*.tar.gz
          generate_release_notes: true
