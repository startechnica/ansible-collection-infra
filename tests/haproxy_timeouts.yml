---
# Regression coverage for HAProxy's timeout block.
#
# The failure this guards against is silent: `timeout client`/`timeout server`
# are INACTIVITY timers, so an idle-by-design LISTEN/NOTIFY session gets cut
# with no error, and because NOTIFY isn't queued for absent listeners every
# notification in the gap is lost. `timeout tunnel` is what keeps those
# sessions alive — if it ever stops rendering, nothing fails loudly.
#
# Run from collection root:
#   ansible-playbook tests/haproxy_timeouts.yml

- name: Render HAProxy timeout configuration
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    _hap_render_dir: /tmp/haproxy-timeouts-test
    patroni_nodes:
      - { name: pg-1, ipv4: 10.0.0.11 }
      - { name: pg-2, ipv4: 10.0.0.12 }
      - { name: pg-3, ipv4: 10.0.0.13 }

  tasks:
    # Loads every file in patroni's defaults/main/ and vars/main/, the same
    # variables the role sees. Runs no tasks.
    - name: Import patroni role variables
      ansible.builtin.import_role:
        name: patroni
        tasks_from: export_vars

    - name: Verify timeout defaults
      ansible.builtin.assert:
        that:
          # Unchanged from the pre-tunnel hardcoded values. On the pg
          # listeners `tunnel` supersedes these; they still govern the
          # mode-http stats listener, so they stay conservative.
          - patroni_haproxy_client_timeout == '300s'
          - patroni_haproxy_server_timeout == '300s'
          - patroni_haproxy_connect_timeout == '10s'
          # Long by design; see defaults/main/haproxy.yml for why this is safe.
          - patroni_haproxy_tunnel_timeout == '24h'
          # Must stay well under the tunnel timeout so half-closed
          # connections don't pin FDs for hours.
          - patroni_haproxy_client_fin_timeout == '30s'
          - patroni_haproxy_server_fin_timeout == '30s'

    - name: Recreate HAProxy render directory
      ansible.builtin.file:
        path: "{{ _hap_render_dir }}"
        state: "{{ item }}"
        mode: "0755"
      loop: [absent, directory]

    - name: Render haproxy.cfg with defaults
      ansible.builtin.template:
        src: ../roles/patroni/templates/haproxy.cfg.j2
        dest: "{{ _hap_render_dir }}/haproxy.cfg"
        mode: "0644"

    - name: Render haproxy.cfg with overridden timeouts
      ansible.builtin.template:
        src: ../roles/patroni/templates/haproxy.cfg.j2
        dest: "{{ _hap_render_dir }}/haproxy-override.cfg"
        mode: "0644"
      vars:
        patroni_haproxy_tunnel_timeout: "2h"
        patroni_haproxy_client_timeout: "45s"

    - name: Read rendered configs
      ansible.builtin.slurp:
        src: "{{ _hap_render_dir }}/{{ item }}"
      loop:
        - haproxy.cfg
        - haproxy-override.cfg
      register: _hap_rendered

    # Collect the `timeout <name> <value>` directives from the defaults
    # section into a dict so assertions read as config lookups.
    - name: Parse timeout directives
      ansible.builtin.set_fact:
        _hap_default: "{{ dict(_hap_rendered.results[0].content | b64decode | regex_findall('(?m)^ +timeout ([a-z-]+) (.+)$')) }}"
        _hap_override: "{{ dict(_hap_rendered.results[1].content | b64decode | regex_findall('(?m)^ +timeout ([a-z-]+) (.+)$')) }}"

    - name: Verify every timeout renders from its variable
      ansible.builtin.assert:
        that:
          - _hap_default.client == patroni_haproxy_client_timeout
          - _hap_default.server == patroni_haproxy_server_timeout
          - _hap_default.connect == patroni_haproxy_connect_timeout
          - _hap_default.check == patroni_haproxy_check_timeout
          - _hap_default.tunnel == patroni_haproxy_tunnel_timeout
          - _hap_default['client-fin'] == patroni_haproxy_client_fin_timeout
          - _hap_default['server-fin'] == patroni_haproxy_server_fin_timeout

    - name: Verify tunnel timeout is present (the whole point of this block)
      ansible.builtin.assert:
        that:
          - "'tunnel' in _hap_default"
        fail_msg: >-
          `timeout tunnel` is missing from the rendered haproxy.cfg. Without
          it, timeout client/server govern established connections and every
          idle LISTEN/NOTIFY session is dropped after patroni_haproxy_client_timeout.

    - name: Verify overrides reach the rendered config
      ansible.builtin.assert:
        that:
          - _hap_override.tunnel == '2h'
          - _hap_override.client == '45s'
          # Untouched vars keep their defaults.
          - _hap_override.server == patroni_haproxy_server_timeout

    - name: Verify keepalive options survive alongside the timeouts
      ansible.builtin.assert:
        that:
          - "'option clitcpka' in _cfg"
          - "'option srvtcpka' in _cfg"
      vars:
        _cfg: "{{ _hap_rendered.results[0].content | b64decode }}"

    # Server names show up in the stats page and the Prometheus `server`
    # label, so they carry the node hostname; the address stays the IP.
    - name: Verify servers are named by hostname in every listener
      ansible.builtin.assert:
        that:
          # pg-primary, pg-replicas and pg-direct each list all three nodes.
          - _servers | length == 9
          - _servers | map('join', ' ') | unique | list == ['pg-1 10.0.0.11', 'pg-2 10.0.0.12', 'pg-3 10.0.0.13']
      vars:
        _servers: "{{ _hap_rendered.results[0].content | b64decode | regex_findall('(?m)^ +server ([^ ]+) ([0-9.]+):') }}"

    # The pooled and bypass listeners are sized against different resources:
    # pg-primary/pg-replicas front PgBouncer (client connections, bounded by its
    # max_client_conn), while pg-direct bypasses it and spends real PostgreSQL
    # backends against max_connections. Letting pg-direct drift up to the pooled
    # listeners' size is how a runaway migration starves PgBouncer's pool and
    # takes the application down, so the gap is asserted, not just documented.
    - name: Verify the bypass listener stays far below the pooled ones
      ansible.builtin.assert:
        that:
          - patroni_haproxy_direct_server_maxconn | int < patroni_haproxy_primary_server_maxconn | int
          - patroni_haproxy_direct_server_maxconn | int < patroni_haproxy_replicas_server_maxconn | int
          # Real headroom check: the bypass path plus ONE PgBouncer pair's
          # worst case has to still leave room under max_connections. Read from
          # the variables rather than written as literals — when these were
          # hardcoded 60 and 200 here, the 200 was itself a literal in
          # patroni.yml.j2 and the 60 came from values the template ignored.
          - (patroni_haproxy_direct_server_maxconn | int) + (_pair_worst_case | int)
            < (patroni_pg_max_connections | int)
        fail_msg: >-
          pg-direct's per-server maxconn
          ({{ patroni_haproxy_direct_server_maxconn }}) is no longer small
          relative to the pooled listeners. Every connection on that path is a
          real PostgreSQL backend competing for max_connections
          ({{ patroni_pg_max_connections }}) with PgBouncer's pools
          ({{ _pair_worst_case }} per user/database pair) — see
          patroni_haproxy_direct_server_maxconn in defaults/main/haproxy.yml.
      vars:
        _pair_worst_case: >-
          {{ (patroni_pgbouncer_default_pool_size | int)
             + (patroni_pgbouncer_reserve_pool_size | int) }}

    # The pooled listeners exist to feed PgBouncer, so HAProxy must not be able
    # to offer it more clients than it will accept — excess would be accepted by
    # HAProxy and then dropped by PgBouncer, which looks like a network fault
    # rather than a capacity limit.
    - name: Verify the pooled listeners cannot overrun PgBouncer's client cap
      ansible.builtin.assert:
        that:
          - patroni_haproxy_primary_server_maxconn | int <= patroni_pgbouncer_max_client_conn | int
          - patroni_haproxy_replicas_server_maxconn | int <= patroni_pgbouncer_max_client_conn | int
        fail_msg: >-
          A pooled listener's per-server cap exceeds
          patroni_pgbouncer_max_client_conn
          ({{ patroni_pgbouncer_max_client_conn }}), so HAProxy would accept
          clients PgBouncer then refuses.

    # Each frontend must sit above its own server cap (so excess queues inside
    # HAProxy instead of being refused at accept), and their sum must sit below
    # the global ceiling (or the per-listener caps stop being the real limit).
    - name: Verify the frontend, server and global caps are ordered correctly
      ansible.builtin.assert:
        that:
          - patroni_haproxy_primary_maxconn | int > patroni_haproxy_primary_server_maxconn | int
          - patroni_haproxy_replicas_maxconn | int > patroni_haproxy_replicas_server_maxconn | int
          - patroni_haproxy_direct_maxconn | int > patroni_haproxy_direct_server_maxconn | int
          - _frontend_sum | int <= patroni_haproxy_global_maxconn | int
        fail_msg: >-
          Frontend caps sum to {{ _frontend_sum }} against a global maxconn of
          {{ patroni_haproxy_global_maxconn }}. Above that, a listener's own cap
          is no longer the effective limit.
      vars:
        # + 100 for the stats listener, which is hardcoded in the template.
        _frontend_sum: >-
          {{ (patroni_haproxy_primary_maxconn | int)
             + (patroni_haproxy_replicas_maxconn | int)
             + (patroni_haproxy_direct_maxconn | int) + 100 }}

    - name: Verify every cap renders from its variable
      ansible.builtin.assert:
        that:
          # Frontend caps, in listener order: stats, pg-primary, pg-replicas,
          # pg-direct. The global line is matched separately below.
          - _maxconns == _expected
        fail_msg: >-
          Rendered maxconn values {{ _maxconns }} do not match the variables
          {{ _expected }} — a hardcoded cap has crept back into the template.
      vars:
        _cfg: "{{ _hap_rendered.results[0].content | b64decode }}"
        _maxconns: "{{ _cfg | regex_findall('(?m)^ +maxconn ([0-9]+)$') }}"
        # `| string` on each: regex_findall returns strings, while native Jinja
        # would otherwise hand back ints and the comparison fails on type.
        _expected:
          - "{{ patroni_haproxy_global_maxconn | string }}"
          - "100"
          - "{{ patroni_haproxy_primary_maxconn | string }}"
          - "{{ patroni_haproxy_replicas_maxconn | string }}"
          - "{{ patroni_haproxy_direct_maxconn | string }}"

    - name: Verify per-server caps render from their variables
      ansible.builtin.assert:
        that:
          # Three nodes per listener, in template order.
          - _server_maxconns == _expected_servers
      vars:
        _cfg: "{{ _hap_rendered.results[0].content | b64decode }}"
        _server_maxconns: "{{ _cfg | regex_findall('(?m)^ +server .* maxconn ([0-9]+) check') }}"
        _expected_servers: >-
          {{ ([patroni_haproxy_primary_server_maxconn | string] * 3)
             + ([patroni_haproxy_replicas_server_maxconn | string] * 3)
             + ([patroni_haproxy_direct_server_maxconn | string] * 3) }}
