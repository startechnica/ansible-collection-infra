---
# Unit test for mongodb_backup_type default and validation assertions.

- name: Test mongodb_backup_type defaults and options
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    # Loads every file in mongodb's defaults/main/ and vars/main/, the same
    # variables the role sees. Runs no tasks. (Was a vars_files pointing at
    # defaults/main.yml, which is a directory since the split.)
    - name: Import mongodb role variables
      ansible.builtin.import_role:
        name: mongodb
        tasks_from: export_vars

    - name: Verify backup type defaults to mongodump when PBM is disabled
      ansible.builtin.assert:
        that:
          - mongodb_backup_type == 'mongodump'
        fail_msg: "mongodb_backup_type should default to mongodump when mongodb_backup_pbm_enabled is false"

    - name: Verify backup type defaults to pbm when PBM is enabled
      ansible.builtin.assert:
        that:
          - mongodb_backup_type == 'pbm'
        fail_msg: "mongodb_backup_type should default to pbm when mongodb_backup_pbm_enabled is true"
      vars:
        mongodb_backup_pbm_enabled: true

    - name: Verify PBM backup fails when mongodb_backup_pbm_enabled is false
      block:
        - name: Include PBM backup tasks
          ansible.builtin.include_tasks: ../roles/mongodb/tasks/pbm_backup.yml
          vars:
            mongodb_backup_pbm_enabled: false
      rescue:
        - name: Record expected failure
          ansible.builtin.set_fact:
            _pbm_backup_failed_as_expected: true

    - name: Assert PBM assertion caught disabled PBM
      ansible.builtin.assert:
        that:
          - _pbm_backup_failed_as_expected | default(false) | bool
        fail_msg: "PBM backup should fail when mongodb_backup_pbm_enabled is false"
