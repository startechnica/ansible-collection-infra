---
# Regression coverage for the preflight memory budget.
#
# The bug this guards against already happened. A production cluster runs
# MongoDB (sharded) and Patroni on the same three 16 GB nodes; every individual
# limit was under total RAM, so the old check — mongod+configsvr+mongos vs
# memtotal_mb, printed as a debug line — said nothing, and the nodes OOM-killed
# in production anyway.
# Three separate defects combined:
#   1. patroni passed no request at all, so PG hosts had no check whatsoever;
#   2. mongodb's sum omitted the PBM agents and the exporter (640MB on a sharded
#      node), so even the number it did print was wrong;
#   3. the threshold was ">100% of total RAM", which only fires once the host is
#      already doomed, and nothing modelled a second stack on the same node.
#
# Run from collection root:
#   ansible-playbook tests/preflight_mem_budget.yml

- name: "Budget :: patroni request composition"
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    # No facts are gathered, so play vars supply memtotal_mb: that cluster's size.
    ansible_facts:
      memtotal_mb: 16384

  tasks:
    - name: "Patroni :: import role variables"
      ansible.builtin.import_role:
        name: patroni
        tasks_from: export_vars

    - name: "Patroni :: verify the budget's one tunable input"
      ansible.builtin.assert:
        that:
          - patroni_stack_overhead_mb == 640
        fail_msg: >-
          The stack overhead changed; update the expectations below and in
          tests/mongodb_patroni_colocation.yml.

    # shared_buffers accepts PostgreSQL's suffixed forms. Each is exercised
    # because a mis-parse silently changes the budget by orders of magnitude —
    # reading "2GB" as 2MB would make any host look fine.
    #
    # Overriding patroni_pg_shared_buffers with task-level vars works precisely because
    # patroni_mem_request_mb is a LAZY expression in vars/main/memory.yml rather
    # than a set_fact: the whole chain re-evaluates per iteration. A fact would
    # have frozen on the first value and needed a separate file per case.
    - name: "Patroni :: verify every shared_buffers form resolves correctly"
      ansible.builtin.assert:
        that:
          - patroni_mem_request_mb | int == _case.want
        fail_msg: >-
          patroni_pg_shared_buffers={{ _case.sb | default('(auto)', true) }} should give
          {{ _case.want }}MB (shared_buffers + {{ patroni_stack_overhead_mb }}MB
          overhead), got {{ patroni_mem_request_mb }}MB.
        success_msg: >-
          {{ _case.sb | default('(auto)', true) }} -> {{ patroni_mem_request_mb }}MB
      vars:
        patroni_pg_shared_buffers: "{{ _case.sb }}"
      loop:
        - {sb: "2GB", want: 2688}
        - {sb: "2048MB", want: 2688}
        - {sb: "524288kB", want: 1152}
        - {sb: "2048", want: 2688}
        # Mixed case and stray whitespace both reach us from inventory.
        - {sb: " 2gb ", want: 2688}
        # Empty = auto-calculated as memtotal/4 = 4096, the value that made
        # that cluster over-commit. preflight runs BEFORE main.yml's auto-calculation
        # set_fact, so vars/main/memory.yml has to mirror that formula.
        - {sb: "", want: 4736}
      loop_control:
        loop_var: _case
        label: "{{ _case.sb | default('(auto)', true) }} -> {{ _case.want }}"

    - name: "Patroni :: verify the overhead is a lever, not a constant"
      ansible.builtin.assert:
        that:
          - patroni_mem_request_mb | int == 3048
      vars:
        patroni_pg_shared_buffers: "2GB"
        patroni_stack_overhead_mb: 1000

    - name: "Patroni :: an unpinned host reports every patroni_pg_* var as auto-sized"
      ansible.builtin.assert:
        that:
          - patroni_pg_autosized == ['patroni_pg_shared_buffers', 'patroni_pg_work_mem', 'patroni_pg_maint_mem']

    - name: "Patroni :: a fully pinned host reports nothing as auto-sized"
      ansible.builtin.assert:
        that:
          - patroni_pg_autosized == []
          - patroni_mem_request_mb | int == 2688
        fail_msg: >-
          Pinning all three patroni_pg_* settings must clear patroni_pg_autosized —
          otherwise the co-located-stack warning cries wolf on a host already
          fixed. The 2688MB is also what that cluster's node budget assumes.
      vars:
        patroni_pg_shared_buffers: "2GB"
        patroni_pg_work_mem: "64MB"
        patroni_pg_maint_mem: "512MB"

# The design decision that makes cross-role discovery safe, tested directly.
# mongodb reads patroni's budget by importing ONE defaults file rather than all
# of them, and patroni reads mongodb's by importing the four it needs.
#
# This used to be guarded by asserting one specific collision: both roles
# defined a bare `tls_key_curve` with DIFFERENT values (secp256r1 for mongodb,
# secp384r1 for patroni), so a wholesale defaults import silently changed the
# curve of every certificate mongodb then generated. That collision is gone —
# both roles' variables are fully namespaced now (mongodb_tls_key_curve and
# patroni_tls_key_curve) — so the first play below asserts the stronger
# invariant the old test was really protecting: the two roles share no variable
# name at all.
#
# It reads the files on disk rather than the loaded play vars, because once both
# roles are imported into one play there is no way to tell which role a variable
# came from — which is precisely the problem.
- name: "Budget :: cross-role namespace isolation"
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: "Namespace :: load each role's defaults as a dict"
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/../roles/{{ _role.name }}/defaults/main"
        name: "{{ _role.into }}"
      loop:
        - {name: mongodb, into: _mongodb_defaults}
        - {name: patroni, into: _patroni_defaults}
      loop_control:
        loop_var: _role
        label: "{{ _role.name }}"

    - name: "Namespace :: the two roles share no variable name at all"
      ansible.builtin.assert:
        that:
          - _collisions == []
        fail_msg: >-
          mongodb and patroni now share these variable names: {{ _collisions }}.
          Each role loads all of its own defaults, so a play that runs or imports
          both gets whichever definition landed last — silently, with no warning.
          The previous instance was a bare `tls_key_curve` declared by both roles
          with different values (secp256r1 vs secp384r1), where the loser's
          certificates were generated on the wrong curve. Prefix the new name. If
          you need the value of a collection-wide variable, READ it with a
          fallback default rather than declaring it — see mongodb_debug and
          patroni_debug, both `{{ '{{' }} debug | default(false) {{ '}}' }}`,
          precisely so the roles consume `debug` without owning it.
        success_msg: >-
          No collisions at all: {{ _mongodb_defaults | length }} mongodb defaults
          vs {{ _patroni_defaults | length }} patroni defaults, zero shared names.
      vars:
        _collisions: >-
          {{ _mongodb_defaults.keys() | list
             | intersect(_patroni_defaults.keys() | list) | sort }}

    # The collision check above only catches a name mongodb shares with patroni
    # TODAY. This one is the invariant that keeps it true against roles that
    # don't exist yet: every mongodb default carries the role's own namespace,
    # so it cannot collide with anything.
    # Asserted for BOTH roles: a one-sided rule would let the next unprefixed
    # name in through whichever side wasn't checked.
    - name: "Namespace :: every default is prefixed with its own role name"
      ansible.builtin.assert:
        that:
          - _unprefixed == []
        fail_msg: >-
          These {{ _ns }} defaults are not {{ _ns }}_-prefixed: {{ _unprefixed }}.
          An unprefixed name is a collision waiting for the next role that picks
          it — which is how a bare `tls_key_curve` ended up silently deciding the
          curve of another role's certificates. Prefix it, and add an UPGRADING
          entry: there are no aliases, so an inventory on the old name goes
          silently back to the default. There are deliberately NO exceptions,
          including collection-wide names like `debug` and `dry_run` — to consume
          one of those, declare a prefixed variable that defaults to it, as
          {{ _ns }}_debug does.
        success_msg: >-
          All {{ _keys | length }} {{ _ns }} defaults are namespaced, with no
          exceptions.
      loop: [mongodb, patroni]
      loop_control:
        loop_var: _ns
      vars:
        # Only ever touches .keys(). Passing the dicts themselves through `loop`
        # would make Ansible render every VALUE, and mongodb_artifacts_dir
        # resolves hostvars['localhost'].artifacts_dir — a play-level var these
        # test plays have no reason to set. Selecting the dict inline inside the
        # .keys() call keeps the values lazy and untouched.
        _keys: >-
          {{ (_mongodb_defaults if _ns == 'mongodb' else _patroni_defaults).keys()
             | list }}
        _unprefixed: >-
          {{ _keys | reject('match', '^' ~ _ns ~ '_')
             | reject('match', '^_') | list | sort }}

- name: "Budget :: narrow cross-role import"
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    ansible_facts:
      memtotal_mb: 16384

  tasks:
    - name: "Import :: load mongodb's variables first, as its own run would"
      ansible.builtin.import_role:
        name: mongodb
        tasks_from: export_vars

    - name: "Import :: pull in only patroni's memory budget"
      ansible.builtin.import_role:
        name: patroni
        tasks_from: export_vars
        defaults_from: main/postgresql.yml
        vars_from: main/memory.yml

    - name: "Import :: the budget arrived and nothing else followed it"
      ansible.builtin.assert:
        that:
          # What we came for.
          - patroni_mem_request_mb is defined
          - patroni_mem_request_mb | int > 0
          # What must NOT have followed it in. These are patroni topics the
          # narrow import deliberately leaves behind; they are undefined here
          # because nothing else in this play defines them.
          - patroni_haproxy_global_maxconn is not defined
          - patroni_pgbouncer_pool_mode is not defined
          - patroni_etcd_client_port is not defined
          # And mongodb's own settings are untouched, which is the point the
          # patroni_tls_key_curve assertion used to make — now expressed against names
          # that can no longer be reached by a patroni import at all.
          - mongodb_tls_key_curve == 'secp256r1'
          - mongodb_s3_bucket == ''
        fail_msg: >-
          The narrow import leaked. patroni's defaults must not reach a mongodb
          run beyond main/postgresql.yml — `defaults_from` takes a single file,
          so if a patroni topic outside main/postgresql.yml is defined here,
          either the import widened or patroni_mem_request_mb grew a dependency
          on another defaults file (see roles/patroni/vars/main/memory.yml,
          which is written to depend on exactly one).

- name: "Budget :: narrow cross-role import, the other way"
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: "Import :: load patroni's variables first, as its own run would"
      ansible.builtin.import_role:
        name: patroni
        tasks_from: export_vars

    # Same imports as roles/patroni/tasks/main.yml.
    - name: "Import :: pull in mongodb's memory budget and caps"
      ansible.builtin.import_role:
        name: mongodb
        tasks_from: export_vars
        defaults_from: main/resources.yml
        vars_from: main/memory.yml

    - name: "Import :: pull in mongodb's cluster type"
      ansible.builtin.import_role:
        name: mongodb
        tasks_from: export_vars
        defaults_from: main/mongodb.yml
        vars_from: empty.yml

    - name: "Import :: pull in mongodb's PBM switch"
      ansible.builtin.import_role:
        name: mongodb
        tasks_from: export_vars
        defaults_from: main/pbm.yml
        vars_from: empty.yml

    - name: "Import :: pull in mongodb's exporter switches"
      ansible.builtin.import_role:
        name: mongodb
        tasks_from: export_vars
        defaults_from: main/exporter.yml
        vars_from: empty.yml

    - name: "Import :: the budget arrived and nothing else followed it"
      ansible.builtin.assert:
        that:
          # What we came for. Rendering it proves the four files are all it
          # reads: an input from any other file would be undefined here.
          - mongodb_mem_request_mb | int > 0
          # mongodb topics the narrow imports deliberately leave behind.
          - mongodb_tls_key_curve is not defined
          - mongodb_s3_bucket is not defined
          - mongodb_mongod_node_port is not defined
          - mongodb_exporter_members is not defined
          - mongodb_thp_settings is not defined
          # patroni's own settings are untouched.
          - patroni_tls_key_curve == 'secp384r1'
          - patroni_mem_request_mb | int > 0
        fail_msg: >-
          The narrow import leaked, or mongodb_mem_request_mb grew a dependency.
          mongodb's variables must reach a patroni run only from main/resources.yml,
          main/mongodb.yml, main/pbm.yml, main/exporter.yml and vars/main/memory.yml
          (see roles/mongodb/vars/main/memory.yml, which is written to depend on
          exactly those).

- name: "Budget :: preflight thresholds"
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    ansible_facts:
      memtotal_mb: 16384
    # Mirrors roles/preflight/tasks/memory.yml. The budget and ceiling live in
    # block-level `vars` there, not facts (deliberately — see that file's header
    # on cross-caller fact leakage), so they can't be read back. Behaviour is
    # asserted through strict mode below; this documents the arithmetic.
    _ceiling: "{{ (16384 * 85 / 100) | int }}"

  tasks:
    - name: "Threshold :: the ceiling is RAM minus the default 15% headroom"
      ansible.builtin.assert:
        that:
          - _ceiling | int == 13926

    # That cluster after the fix: Mongo 7296 reserved + Patroni 2688 = 9984 of
    # 16384, against a 13926 ceiling. Comfortable — the point of the exercise.
    - name: "Threshold :: co-located stacks within the ceiling"
      ansible.builtin.include_role:
        name: preflight
        tasks_from: memory
      vars:
        container_mem_request_mb: 2688
        container_mem_reserved_mb: 7296
        container_mem_strict: true

    # Strict mode is the only observable behaviour, so every boundary below is
    # expressed as "does strict pass or fail". Exactly at total RAM must pass:
    # the comparison is <=, and an off-by-one here would fail healthy hosts.
    - name: "Threshold :: a budget exactly at total RAM passes strict"
      ansible.builtin.include_role:
        name: preflight
        tasks_from: memory
      vars:
        container_mem_request_mb: 8000
        container_mem_reserved_mb: 8384
        container_mem_strict: true

    # One MB more must fail — which also proves `reserved` is summed into the
    # total rather than ignored, since the request alone is well under RAM.
    - name: "Threshold :: one MB over total RAM fails strict"
      block:
        - name: "Threshold :: run strict at total RAM + 1"
          ansible.builtin.include_role:
            name: preflight
            tasks_from: memory
          vars:
            container_mem_request_mb: 8000
            container_mem_reserved_mb: 8385
            container_mem_strict: true

        - name: "Threshold :: strict mode should not have reached here"
          ansible.builtin.fail:
            msg: >-
              container_mem_strict=true must fail once the committed total
              exceeds total RAM. Either the comparison is wrong, or
              container_mem_reserved_mb is not being added to the request.
      rescue:
        - name: "Threshold :: confirm strict mode aborted"
          ansible.builtin.debug:
            msg: "strict correctly failed at 16385MB on a 16384MB host"

    # Between the ceiling and total RAM the check must stay advisory even under
    # strict: crossing the headroom line is a warning, not a hard error.
    - name: "Threshold :: over the ceiling but under RAM still passes strict"
      ansible.builtin.include_role:
        name: preflight
        tasks_from: memory
      vars:
        container_mem_request_mb: 14000
        container_mem_reserved_mb: 0
        container_mem_strict: true

    # A caller that can't estimate its footprint opts out by leaving the request
    # unset. The check must then do nothing — and must NOT reuse the numbers a
    # previous caller left behind, which is what a fact-based implementation did.
    - name: "Threshold :: no request means no check"
      ansible.builtin.include_role:
        name: preflight
        tasks_from: memory
      vars:
        container_mem_strict: true

- name: "Budget :: mongodb request composition"
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: "Mongodb :: import role variables"
      ansible.builtin.import_role:
        name: mongodb
        tasks_from: export_vars

    - name: "Mongodb :: verify the caps the aggregate is built from"
      ansible.builtin.assert:
        that:
          - mongodb_exporter_mem_limit_mb == 128
          - mongodb_backup_pbm_mem_limit_mb == 256

    # mongodb_mem_request_mb (roles/mongodb/vars/main/memory.yml) is lazy, so
    # task vars re-evaluate it per case. _request below is a literal copy of the
    # sum on purpose: if the expression is edited, this fails and forces a look
    # at whether the new term belongs in the budget.
    - name: "Mongodb :: verify the aggregate covers every container"
      ansible.builtin.assert:
        that:
          - _request | int == _case.want
          - mongodb_mem_request_mb | int == _case.want
          # The budget counts member exporters from their switches; the role
          # runs the ones in mongodb_exporter_members. They must agree.
          - mongodb_exporter_members | length == _case.members | default(0) | int
        fail_msg: >-
          {{ _case.name }}: expected {{ _case.want }}MB, got
          {{ mongodb_mem_request_mb }}MB (literal copy {{ _request }}MB) with
          {{ mongodb_exporter_members | length }} member exporters.
          Every container this role puts on the node must be counted — the PBM
          agents (one per data-bearing node) and the exporter included.
      loop:
        # That cluster's caps: 4096 + 1536 + 1024, two PBM agents, one exporter.
        - name: sharded with PBM and exporter
          sharded: true
          pbm: true
          exporter: true
          mongod: 4096
          configsvr: 1536
          mongos: 1024
          want: 7296
        # The old expression's answer for the same host — 640MB short.
        - name: sharded without PBM or exporter
          sharded: true
          pbm: false
          exporter: false
          mongod: 4096
          configsvr: 1536
          mongos: 1024
          want: 6656
        # Replica set: no configsvr/mongos, and only ONE PBM agent.
        - name: replicaset with PBM and exporter
          sharded: false
          pbm: true
          exporter: true
          mongod: 2048
          configsvr: 512
          mongos: 1024
          want: 2432
        # Default caps, sharded, PBM off (the shipped default), exporter on.
        - name: default sharded without PBM
          sharded: true
          pbm: false
          exporter: true
          mongod: 2048
          configsvr: 512
          mongos: 1024
          want: 3712
        # Per-member shard + configsvr exporters: one more exporter cap each.
        - name: sharded with PBM, exporter and both member exporters
          sharded: true
          pbm: true
          exporter: true
          switches: 2
          members: 2
          mongod: 2048
          configsvr: 512
          mongos: 1024
          want: 4480
        # Member exporters run only on a sharded cluster...
        - name: replicaset with the member exporters switched on
          sharded: false
          pbm: false
          exporter: true
          switches: 2
          members: 0
          mongod: 2048
          configsvr: 512
          mongos: 1024
          want: 2176
        # ...and only alongside the mongos exporter, whose client cert they reuse.
        - name: sharded with the member exporters but not the exporter
          sharded: true
          pbm: false
          exporter: false
          switches: 2
          members: 0
          mongod: 2048
          configsvr: 512
          mongos: 1024
          want: 3584
      loop_control:
        loop_var: _case
        label: "{{ _case.name }}"
      vars:
        mongodb_cluster_type: "{{ 'sharded' if _case.sharded else 'replicaset' }}"
        mongodb_backup_pbm_enabled: "{{ _case.pbm }}"
        mongodb_exporter_enabled: "{{ _case.exporter }}"
        mongodb_exporter_shard_enabled: "{{ _case.switches | default(0) | int > 0 }}"
        mongodb_exporter_configsvr_enabled: "{{ _case.switches | default(0) | int > 1 }}"
        mongodb_mongod_mem_limit_mb: "{{ _case.mongod }}"
        mongodb_configsvr_mem_limit_mb: "{{ _case.configsvr }}"
        mongodb_mongos_mem_limit_mb: "{{ _case.mongos }}"
        _request: >-
          {{ (_case.mongod | int)
             + ((_case.configsvr | int) + (_case.mongos | int)
                if _case.sharded else 0)
             + ((mongodb_backup_pbm_mem_limit_mb | int)
                * (2 if _case.sharded else 1)
                if _case.pbm else 0)
             + ((mongodb_exporter_mem_limit_mb | int)
                if _case.exporter else 0)
             + ((mongodb_exporter_mem_limit_mb | int) * (_case.members | default(0) | int)) }}
