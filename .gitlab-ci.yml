---
# GitLab CI/CD pipeline for the startechnica.infra Ansible collection.
#
# Stages:
#   lint       yamllint + ansible-lint
#   test       ansible-playbook --syntax-check on every playbook
#   build      ansible-galaxy collection build → artifact (tar.gz)
#   publish    push the tar.gz to Ansible Galaxy on tagged releases (vX.Y.Z)
#
# Required CI/CD variables (project or group level):
#   ANSIBLE_GALAXY_TOKEN     API key from https://galaxy.ansible.com/me/preferences
#   (optional) GALAXY_SERVER URL of a private Galaxy (defaults to the public one)

stages:
  - lint
  - test
  - build
  - publish

variables:
  PYTHON_VERSION: "3.12"
  ANSIBLE_FORCE_COLOR: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GALAXY_SERVER: "https://galaxy.ansible.com"

default:
  image: python:${PYTHON_VERSION}-slim
  cache:
    key: "pip-${PYTHON_VERSION}"
    paths:
      - .cache/pip/
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git make
    - python -m pip install --upgrade pip
    - pip install "ansible-core>=2.16" ansible-lint yamllint
    - ansible-galaxy collection install -r requirements.yml
    - ansible-galaxy role install -r requirements.yml
  interruptible: true

# ── Lint ───────────────────────────────────────────────────────────────────

yamllint:
  stage: lint
  script:
    - yamllint .

ansible-lint:
  stage: lint
  script:
    - ansible-lint

# ── Syntax check ───────────────────────────────────────────────────────────

syntax-check:
  stage: test
  # Two passes via scripts/check-inventories.sh:
  #   1) every playbook against the canonical inventory  (catches Jinja /
  #      undefined / role-not-found regressions in any playbook)
  #   2) playbooks/deploy.yml against every inventory declaring `instances:`
  #      (catches inventory-shape regressions). The previous one-axis loop
  #      missed any inventory that wasn't the canonical one.
  script:
    - bash scripts/check-inventories.sh

# ── Build the collection tarball ───────────────────────────────────────────

build-collection:
  stage: build
  script:
    - mkdir -p dist
    - ansible-galaxy collection build --force --output-path dist/
    - ls -la dist/
  artifacts:
    name: "$CI_PROJECT_NAME-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/*.tar.gz
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Publish to Galaxy (only on vX.Y.Z tags) ────────────────────────────────

publish-collection:
  stage: publish
  needs: [build-collection]
  script:
    - test -n "$ANSIBLE_GALAXY_TOKEN" || (echo "ANSIBLE_GALAXY_TOKEN is not set" && exit 1)
    - ls -la dist/
    - ansible-galaxy collection publish --api-key "$ANSIBLE_GALAXY_TOKEN" --server "$GALAXY_SERVER" dist/startechnica-infra-*.tar.gz
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - when: manual
  environment:
    name: galaxy
    url: "$GALAXY_SERVER/ui/namespaces/startechnica"
