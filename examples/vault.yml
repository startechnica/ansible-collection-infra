# Reference vault file — in practice this is:
#   inventories/group_vars/all/vault.yml
# encrypted with:
#   ansible-vault encrypt inventories/group_vars/all/vault.yml
#
# The plaintext entries below get referenced from inventory.full.yml as
# {{ vault_<name> }}. Keep the naming convention — prefix everything with
# `vault_` so it's obvious at a glance which variables are secrets.

---
# Controller / SSH
vault_default_user_password: changeme-please
vault_operator_ssh_key: "ssh-ed25519 AAAAC3Nz... operator@workstation"

# vCenter
vault_vcenter_password: vcenter-service-account-password

# NetBox
vault_netbox_token: 0123456789abcdef0123456789abcdef01234567

# MongoDB
vault_mongodb_admin_password: "" # empty = auto-generated
vault_mongodb_app_password: app-primary-password

# Patroni / PostgreSQL
vault_postgres_password: "" # empty = auto-generated
vault_patroni_app_password: app-primary-password-pg

# S3 (shared by MongoDB + Patroni backups)
vault_s3_access_key: AKIAXXXXXXXXXXXXXXXX
vault_s3_secret_key: verylongsecretkeyherexxxxxxxxxxxxxxxxxxxx

# MikroTik RouterOS
vault_routeros_password: routeros-api-password
