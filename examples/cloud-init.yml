---
# =============================================================================
# Example: Cloud-Init based VM provisioning (Ubuntu, Debian)
# =============================================================================
# Shared defaults loaded from group_vars/cloud_init.yml:
#   instance_init_type: cloud-init
#   content_library_{name,template,type} = ubuntu-images / noble-server-cloudimg-amd64 / ovf
#   instance_user_{name,password,sudo,shell,...}
#   docker_install / docker_users / docker_daemon_options
#
# Override any of those per-inventory by re-declaring under `vars:` below.
#
# ── Common deploy commands ──
#   # Provision VMs only
#   ansible-playbook startechnica.infra.deploy \
#     -i inventories/example-cloud-init.yml \
#     --ask-vault-pass --tags provision
#
#   # Provision + install MongoDB (sharded, x509 TLS)
#   ansible-playbook startechnica.infra.deploy \
#     -i inventories/example-cloud-init.yml \
#     --ask-vault-pass
#
#   # Patroni HA Postgres (etcd + HAProxy + PgBouncer + vip-manager)
#   ansible-playbook startechnica.infra.deploy_patroni \
#     -i inventories/example-cloud-init.yml --ask-vault-pass
#
#   # Dry-run (validate inventory only)
#   ansible-playbook startechnica.infra.deploy \
#     -i inventories/example-cloud-init.yml \
#     -e validation_only=true --ask-vault-pass --tags provision
# =============================================================================

all:
  hosts:
    localhost:
      ansible_connection: local
  children:
    cloud_init:
      hosts:
        localhost:
      vars:
        # ── vCenter / cluster ────────────────────────────────────────────
        instance_cluster_name: MyCluster # vCenter cluster name
        # instance_datacenter: Datacenter         # only needed if vCenter has >1 DC
        # instance_domain_name: example.internal  # appended to VM hostname

        # ── Network ──────────────────────────────────────────────────────
        portgroup_name: pg-app # distributed port group name
        portgroup_dvswitch_name: DSwitch01
        # Standalone ESXi (no DVS) — comment out portgroup_dvswitch_name, use:
        # portgroup_vswitch_name: vSwitch0
        # portgroup_vlan_id: 100
        # Per-NIC defaults — merged into every entry of every VM's
        # `networks:` list. gateway4 is required if any NIC declares
        # static ipv4. Add gateway6 for IPv6 dual-stack.
        instance_networks:
          gateway4: "10.0.0.1"
          mtu: 1500
        # instance_dns_servers: [1.1.1.1, 8.8.8.8]   # group_vars default usually fine

        # ── VM placement ─────────────────────────────────────────────────
        instance_folder: "Example"

        # ── VM hardware (per-VM may override) ────────────────────────────
        instance_cpu: 4
        instance_memory_mb: 8192
        instance_disks:
          size_gb: 80
          type: thin
          datastore: datastore01

        # ── Patroni VIP (only when patroni is in instance_tags) ────────────
        # patroni_vip_address: 10.0.0.100                # floating IP managed by vip-manager

        # ── VM definitions ───────────────────────────────────────────────
        # `tags` are propagated into NetBox AND used by build_host_groups to
        # route the VM into mongodb_nodes / patroni_nodes / etc.
        # Per-VM tags override the inventory-level `instance_tags` list below.
        instances:
          # Minimal entry — inherits everything from defaults (gateway from
          # instance_networks.gateway4, portgroup from portgroup_name above).
          # `name` (vCenter display name) defaults to `hostname` when omitted.
          - hostname: example-app-01
            networks:
              - ipv4: 10.0.0.10/24

          # Hardware override + extra cloud-init runcmds. Per-VM `cpu`,
          # `memory_mb`, `disks` keep the bare names because they're
          # scoped to this dict (Ansible per-item-key idiom).
          - hostname: example-app-02
            networks:
              - ipv4: 10.0.0.11/24
            cpu: 4
            memory_mb: 8192
            disks:
              - size_gb: 100
            cloud_init:
              packages:
                - docker-ce
              runcmd:
                - systemctl enable docker

          # Multi-NIC + dual-stack + per-NIC overrides + explicit vCenter name
          # - hostname: example-gw-01
          #   name: gw01-asset-01234         # vCenter UI shows asset tag, guest sees hostname
          #   networks:
          #     - name: pg-mgmt              # explicit portgroup overrides portgroup_name
          #       ipv4: 10.0.0.20/24
          #       ipv6: 2001:db8::20/64
          #     - name: pg-data
          #       ipv4: dhcp                 # DHCPv4 — ipv6: dhcp6 also supported
          #       mtu: 9000                  # jumbo for storage

        # ── Service routing (optional) ───────────────────────────────────
        # Tags decide which DB roles run against this inventory. With both
        # 'mongodb' and 'patroni', deploy.yml will provision both clusters
        # using ALL VMs above. Use per-VM `tags:` to split the cluster.
        # instance_tags:
        #   - mongodb
        #   - patroni

        # ── NetBox enrichment (optional) ─────────────────────────────────
        # When enabled, missing `ipv4:` on instances[] is auto-filled from NetBox,
        # and provisioned VMs are registered/updated in NetBox.
        # netbox_enabled: true
        # netbox_lookup_enabled: true
        # netbox_device_name: esxi-prod-01     # NetBox DCIM device name
        #                                      # (the ESXi host the VMs run on);
        #                                      # falls back to vsphere_esxi_hostname when empty
        # netbox_device_role: database
        # netbox_device_platform: ubuntu-24-04-lts
        # netbox_cluster_name: prod-cluster-01 # NetBox Cluster the VMs join.
        #                                      # Resolution:
        #                                      #   item.cluster_name -> netbox_cluster_name -> instance_cluster_name
        # netbox_vrf: vrf-prod

        # ── RouterOS address-list sync (optional) ────────────────────────
        # Pushes VM IPs (and the Patroni VIP) into a MikroTik address-list
        # so firewall / mangle rules can reference one symbolic name.
        # routeros_enabled: true
        # routeros_address_list: db-myproject

        # ── Patroni-specific (when 'patroni' is in instance_tags) ──────────
        # patroni_scope: myproject-pg                  # unique per cluster
        # postgresql_postgres_password: ""             # empty = auto-generate
        # patroni_databases:
        #   - name: app_main
        #     owner: app_main
        #     users:
        #       - name: app_main
        #         password: "{{ vault_app_main_password }}"
        #         roles: [LOGIN, CREATEDB]

        # ── MongoDB-specific (when 'mongodb' is in instance_tags) ──────────
        # mongodb_cluster_type: sharded                # or 'replicaset'
        # mongodb_admin_password: "{{ vault_mongodb_admin_password }}"

        # ── S3 backups (shared by mongodb backup + patroni WAL-G) ────────
        # s3_bucket: myproject-backups
        # s3_endpoint: https://s3.example.com
        # s3_access_key: "{{ vault_s3_access_key }}"
        # s3_secret_key: "{{ vault_s3_secret_key }}"
