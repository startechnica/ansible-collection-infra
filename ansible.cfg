[defaults]
roles_path = ./roles
library = ./plugins/modules
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
# Force TERM=dumb on the target so systemd 258's shell-integration script
# (Fedora 43+) skips emitting OSC 3008 markers around every command. Those
# escape sequences land after the JSON payload from each module call,
# which Ansible reports as "Module invocation had junk after the JSON
# data" on every become task. Belt-and-suspenders with the
# /etc/profile.d/shell-integration.sh mask in fcos.bu.j2.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o SetEnv=TERM=dumb
