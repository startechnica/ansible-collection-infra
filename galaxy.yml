---
namespace: startechnica
name: infra
version: 1.0.0
readme: README.md
authors:
  - firmansyahn (firmansyah@nainggolan.id)
description: >-
  VMware vCenter VM provisioning with cloud-init and ignition support,
  NetBox IPAM integration, MongoDB sharded cluster, and Patroni HA PostgreSQL deployment.
license:
  - MIT
repository: https://gitlab.com/skydata/ansible-collection-infra
documentation: https://gitlab.com/skydata/ansible-collection-infra/-/blob/main/README.md
issues: https://gitlab.com/skydata/ansible-collection-infra/-/issues
tags:
  - vmware
  - vcenter
  - netbox
  - mongodb
  - patroni
  - postgresql
  - cloud_init
  - ignition
dependencies:
  ansible.posix: ">=1.5.0"
  community.crypto: ">=2.22.0"
  community.docker: ">=3.13.0"
  community.general: ">=9.0.0"
  community.mongodb: ">=1.7.0"
  community.postgresql: ">=3.4.0"
  community.routeros: ">=3.0.0"
  community.vmware: ">=5.2.0"
  containers.podman: ">=1.19.2"
  netbox.netbox: ">=4.1.0"
  vmware.vmware: ">=1.6.0"
build_ignore:
  - .git
  - .gitignore
  - .claude
  - ansible.cfg
  - requirements.yml
  - inventories
  - group_vars
  - artifacts
  - playbooks/artifacts
  - "*.tar.gz"
