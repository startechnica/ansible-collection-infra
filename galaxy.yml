---
namespace: startechnica
name: infra
version: 1.0.2
readme: README.md
authors:
  - firmansyahn (firmansyah@nainggolan.id)
description: >-
  VMware vCenter VM provisioning with cloud-init and ignition support,
  NetBox IPAM integration, MongoDB sharded cluster, and Patroni HA PostgreSQL deployment.
license:
  - MIT
repository: https://github.com/startechnica/ansible-collection-infra
documentation: https://github.com/startechnica/ansible-collection-infra/blob/main/README.md
issues: https://github.com/startechnica/ansible-collection-infra/issues
tags:
  - infrastructure
  - vmware
  - vcenter
  - netbox
  - mongodb
  - patroni
  - postgresql
  - cloudinit
  - ignition
dependencies:
  ansible.posix: ">=1.5.0"
  ansible.utils: ">=5.1.0"
  community.crypto: ">=3.2.0"
  community.docker: ">=5.2.0"
  community.general: ">=12.6.0"
  community.mongodb: ">=1.7.12"
  community.postgresql: ">=3.14.3"
  community.routeros: ">=3.0.0"
  community.vmware: ">=6.2.0"
  containers.podman: ">=1.19.2"
  netbox.netbox: ">=3.22.0"
  vmware.vmware: ">=2.8.0"
build_ignore:
  - .git
  - .gitignore
  - .claude
  - .github
  - .vscode
  - .yamllint
  - ansible.cfg
  - requirements.yml
  - inventories
  - group_vars
  - artifacts
  - playbooks/artifacts
  - roles/geerlingguy.docker
  - "*.tar.gz"
