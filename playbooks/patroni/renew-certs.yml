---
# ─── Patroni: Renew TLS Certificates ────────────────────────────────────────
#
# Regenerates leaf certificates (etcd, patroni, haproxy, vip-manager) using
# the existing CA and restarts affected services.
#
# Pass rotate_ca=true to also regenerate the CA itself (requires full restart).
#
# Usage:
#   ansible-playbook playbooks/patroni/renew-certs.yml -i inventories/<inv>.yml
#
#   # Also rotate the CA:
#   ansible-playbook playbooks/patroni/renew-certs.yml -i inventories/<inv>.yml \
#     -e rotate_ca=true

- name: Setup patroni hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build host group from instances
      ansible.builtin.include_tasks: _setup.yml

- name: Patroni renew certificates
  hosts: patroni_nodes
  become: true
  gather_facts: true
  serial: "{{ '100%' if rotate_ca | default(false) | bool else 1 }}"
  pre_tasks:
    - name: Inherit localhost vars
      ansible.builtin.include_role:
        name: common
        tasks_from: inherit_localhost_vars
  roles:
    - role: patroni
      vars:
        patroni_action: renew-certs
