---
# ─── Patroni: Cluster Status ────────────────────────────────────────────────
#
# Displays current cluster state:
#   - Patroni cluster members (leader, replicas, lag)
#   - etcd cluster health
#   - Container states
#   - VIP location
#
# Usage:
#   ansible-playbook playbooks/patroni/status.yml -i inventories/<inv>.yml

- name: Setup patroni hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: _setup.yml

- name: Patroni cluster status
  hosts: patroni_nodes
  become: true
  gather_facts: true
  pre_tasks:
    - ansible.builtin.include_role:
        name: common
        tasks_from: inherit_localhost_vars
  roles:
    - role: patroni
      vars:
        patroni_action: status
