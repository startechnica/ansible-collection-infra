---
# ─── Patroni: Rotate Passwords ──────────────────────────────────────────────
#
# Generates a new random password for the postgres superuser and updates:
#   - PostgreSQL (ALTER USER via primary)
#   - PgBouncer userlist
#   - Patroni configuration
#
# The new password is saved to the local artifacts credentials file.
#
# Usage:
#   ansible-playbook playbooks/patroni/rotate-passwords.yml -i inventories/<inv>.yml

- name: Setup patroni hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build host group from instances
      ansible.builtin.include_tasks: _setup.yml

- name: Patroni rotate passwords
  hosts: patroni_nodes
  become: true
  gather_facts: true
  serial: 1
  pre_tasks:
    - name: Inherit localhost vars
      ansible.builtin.include_role:
        name: common
        tasks_from: inherit_localhost_vars
  roles:
    - role: patroni
      vars:
        patroni_action: rotate-passwords
