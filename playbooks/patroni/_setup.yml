---
# ─── Patroni: Build host group from instances ──────────────────────────────────────
#
# Included by all patroni/ playbooks as a localhost pre-play.
# Handles: NetBox enrichment (optional) + dynamic inventory from instances[].

- name: Enrich VMs from NetBox
  ansible.builtin.include_role:
    name: netbox_lookup
  when:
    - netbox_enabled | default(false) | bool
    - netbox_lookup_enabled | default(true) | bool

# The same routing deploy.yml uses: a VM joins patroni_nodes when it is tagged
# `patroni` (its own `tags` or `instance_tags`) and patroni_enabled is true, and
# likewise mongodb_nodes. Both groups are built because the patroni role reads
# mongodb_nodes to tell which hosts the other stack shares.
- name: Build host groups from instances (tag-based)
  ansible.builtin.include_role:
    name: common
    tasks_from: build_host_groups
  vars:
    use_tags: true

- name: Require at least one VM that runs Patroni
  ansible.builtin.assert:
    that:
      - groups['patroni_nodes'] | default([]) | length > 0
    fail_msg: >-
      No VM runs Patroni, so playbooks/patroni/* have nothing to act on. A VM runs
      it when patroni_enabled is true (it is
      {{ patroni_enabled | default(false) }}) and the VM is tagged `patroni`,
      in its own `tags` or in `instance_tags` (now
      {{ instance_tags | default([]) }}).
    success_msg: "patroni_nodes: {{ groups['patroni_nodes'] | join(', ') }}"

- name: Compute artifacts_dir on localhost (controller-only)
  ansible.builtin.set_fact:
    artifacts_dir: "{{ inventory_dir | dirname }}/playbooks/artifacts/{{ inventory_file | basename | splitext | first }}"

- name: Probe SSH reachability on patroni_nodes
  ansible.builtin.include_role:
    name: common
    tasks_from: wait_for_ssh
  vars:
    ssh_wait_group: patroni_nodes
