---
# Top-level entry point so the collection FQCN resolves:
#   ansible-playbook startechnica.infra.patroni_smoke -i <inventory>
#
# Collection playbook resolution only finds playbooks at the top level of
# playbooks/ and maps the filename verbatim to the FQCN suffix, so this file
# must be named patroni_smoke.yml (underscores) and live here, not under test/.
#
# The `patroni_nodes` group is built at runtime from instances[] by
# patroni/_setup.yml (the same prelude deploy_patroni.yml / patroni/install.yml
# use), so this inventory does not need a static group. All checks live in
# roles/patroni_smoke/tasks/*.yml.

- name: "Setup patroni hosts (build group from instances)"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Build host group from instances"
      ansible.builtin.include_tasks: patroni/_setup.yml

- name: "Patroni smoke test"
  hosts: patroni_nodes
  gather_facts: true
  become: true
  pre_tasks:
    - name: "Inherit localhost vars"
      ansible.builtin.include_role:
        name: common
        tasks_from: inherit_localhost_vars
  roles:
    - role: patroni_smoke
