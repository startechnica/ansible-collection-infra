---
# Top-level entry point so the collection FQCN resolves:
#   ansible-playbook startechnica.infra.patroni_smoke -i <inventory>
#
# Collection playbook resolution only finds playbooks at the top level of
# playbooks/ and maps the filename verbatim to the FQCN suffix, so this file
# must be named patroni_smoke.yml (underscores) and live here, not under test/.
#
# All checks live in roles/patroni_smoke/tasks/*.yml.

- name: "Patroni smoke test"
  hosts: patroni_nodes
  gather_facts: true
  become: true

  roles:
    - role: startechnica.infra.patroni_smoke
