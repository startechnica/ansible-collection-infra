---
# ─── MongoDB: Add a Replica Member ──────────────────────────────────────────
#
# Grows an existing MongoDB cluster by adding one or more nodes. Assumes:
#   - The new VM(s) are already listed in the inventory's `instances:` (they'll be
#     provisioned if missing via instance).
#   - Existing cluster is healthy (current primary reachable).
#
# The new nodes get the same TLS material and cluster config, start their
# mongod container, and are added to the replica set via rs.add().
#
# Usage:
#   ansible-playbook playbooks/mongodb/add-node.yml \
#     -i inventories/<your-inventory>.yml \
#     -e target_node=host4-lin-db
#
# Or add all currently-unreplicated VMs in the inventory:
#   ansible-playbook playbooks/mongodb/add-node.yml \
#     -i inventories/<your-inventory>.yml

- name: Setup mongodb hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: _setup.yml

- name: Validate scale-up inputs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Resolve scale-up target list
      ansible.builtin.set_fact:
        _new_members: >-
          {{ [target_node] if target_node is defined
             else (groups['mongodb_nodes'] | default([])) }}

    - name: Fail if no target identified
      ansible.builtin.fail:
        msg: "No target nodes. Pass -e target_node=<hostname> or populate instances[] in the inventory."
      when: _new_members | length == 0

- name: Provision stack on new member(s)
  hosts: "{{ target_node | default('mongodb_nodes') }}"
  become: true
  gather_facts: true
  pre_tasks:
    - ansible.builtin.include_role:
        name: common
        tasks_from: inherit_localhost_vars
  roles:
    - role: mongodb

- name: Register new members in replica set
  hosts: "{{ (groups['mongodb_nodes'] | default([]))[0] }}"
  become: true
  gather_facts: false
  pre_tasks:
    - ansible.builtin.include_role:
        name: common
        tasks_from: inherit_localhost_vars
  tasks:
    - name: List current replica-set members
      community.docker.docker_container_exec:
        container: mongodb-mongod
        command: >-
          mongosh --port 27017 --quiet --tls
          --tlsCertificateKeyFile /etc/mongo/ssl/healthcheck.pem
          --tlsCAFile /etc/mongo/ssl/ca.pem
          --authenticationMechanism MONGODB-X509
          --authenticationDatabase '$external'
          --eval "JSON.stringify(rs.status().members.map(m => m.name))"
      register: _rs_members
      changed_when: false

    - name: Determine which inventory VMs are not yet members
      ansible.builtin.set_fact:
        _candidates: >-
          {{ mongodb_nodes
             | rejectattr('ipv4', 'search',
                          ((_rs_members.stdout | from_json) | join('|') if _rs_members.stdout else 'NONE'))
             | list }}

    - name: Add each candidate via rs.add()
      community.docker.docker_container_exec:
        container: mongodb-mongod
        command: >-
          mongosh --port 27017 --quiet --tls
          --tlsCertificateKeyFile /etc/mongo/ssl/healthcheck.pem
          --tlsCAFile /etc/mongo/ssl/ca.pem
          --authenticationMechanism MONGODB-X509
          --authenticationDatabase '$external'
          --eval "rs.add('{{ item.ipv4 | split('/') | first }}:27017')"
      loop: "{{ _candidates }}"
      loop_control:
        label: "{{ item.name }}"
      register: _added
      changed_when: "'ok' in (_added.stdout | default(''))"

    - name: Wait for new members to reach SECONDARY
      community.docker.docker_container_exec:
        container: mongodb-mongod
        command: >-
          mongosh --port 27017 --quiet --tls
          --tlsCertificateKeyFile /etc/mongo/ssl/healthcheck.pem
          --tlsCAFile /etc/mongo/ssl/ca.pem
          --authenticationMechanism MONGODB-X509
          --authenticationDatabase '$external'
          --eval "JSON.stringify(rs.status().members.map(m => m.stateStr))"
      register: _rs_states
      until: >-
        (_rs_states.stdout | from_json
         | reject('in', ['PRIMARY', 'SECONDARY']) | list | length) == 0
      retries: 60
      delay: 10
      changed_when: false

    - name: Scale-up complete
      ansible.builtin.debug:
        msg:
          - "Replica set now has {{ (_rs_states.stdout | from_json) | length }} members."
          - "States: {{ (_rs_states.stdout | from_json) }}"
