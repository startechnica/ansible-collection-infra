---
# ─── MongoDB: Rolling Version Upgrade ────────────────────────────────────────
#
# Zero-downtime upgrade of all MongoDB containers to a new version:
#   1. Pre-pull new image on all nodes
#   2. Upgrade configsvr secondaries, stepdown primary, upgrade former primary
#   3. Upgrade shard secondaries, stepdown primary, upgrade former primary
#   4. Upgrade mongos instances one at a time
#   5. Post-upgrade health verification
#
# After completion, update mongodb_version in your inventory to match.
#
# Usage:
#   ansible-playbook playbooks/mongodb/upgrade.yml -i inventories/<your-inventory>.yml \
#     -e mongodb_image_tag_new=8.2.7

- name: Setup mongodb hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build host group from instances
      ansible.builtin.include_tasks: _setup.yml

- name: MongoDB rolling upgrade
  hosts: mongodb_nodes
  become: true
  gather_facts: true
  pre_tasks:
    - name: Inherit localhost vars
      ansible.builtin.include_role:
        name: common
        tasks_from: inherit_localhost_vars
  roles:
    - role: mongodb
      vars:
        mongodb_action: upgrade
