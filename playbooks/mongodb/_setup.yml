---
# ─── MongoDB: Build host group from instances ──────────────────────────────────────
#
# Included by all mongodb/ playbooks as a localhost pre-play.
# Handles: NetBox enrichment (optional) + dynamic inventory from instances[].

- name: Enrich VMs from NetBox
  ansible.builtin.include_role:
    name: netbox_lookup
  when:
    - netbox_enabled | default(false) | bool
    - netbox_lookup_enabled | default(true) | bool

# The same routing deploy.yml uses: a VM joins mongodb_nodes when it is tagged
# `mongodb` (its own `tags` or `instance_tags`) and mongodb_enabled is true, and
# likewise patroni_nodes. Both groups are built because the mongodb role reads
# patroni_nodes to tell which hosts the other stack shares.
- name: Build host groups from instances (tag-based)
  ansible.builtin.include_role:
    name: common
    tasks_from: build_host_groups
  vars:
    use_tags: true

- name: Require at least one VM that runs MongoDB
  ansible.builtin.assert:
    that:
      - groups['mongodb_nodes'] | default([]) | length > 0
    fail_msg: >-
      No VM runs MongoDB, so playbooks/mongodb/* have nothing to act on. A VM runs
      it when mongodb_enabled is true (it is
      {{ mongodb_enabled | default(false) }}) and the VM is tagged `mongodb`,
      in its own `tags` or in `instance_tags` (now
      {{ instance_tags | default([]) }}).
    success_msg: "mongodb_nodes: {{ groups['mongodb_nodes'] | join(', ') }}"

- name: Compute artifacts_dir on localhost (controller-only)
  ansible.builtin.set_fact:
    artifacts_dir: "{{ inventory_dir | dirname }}/playbooks/artifacts/{{ inventory_file | basename | splitext | first }}"

- name: Probe SSH reachability on mongodb_nodes
  ansible.builtin.include_role:
    name: common
    tasks_from: wait_for_ssh
  vars:
    ssh_wait_group: mongodb_nodes
