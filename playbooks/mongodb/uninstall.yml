---
# ─── MongoDB: Uninstall Cluster ─────────────────────────────────────────────
#
# Removes all MongoDB containers, network, systemd units, sysctl configs,
# and the mongodb system user/group. Requires interactive confirmation.
#
# By default, the data directory (/opt/mongodb) is preserved.
# Pass mongodb_destroy_prune=true to delete data as well.
#
# Usage:
#   ansible-playbook playbooks/mongodb/uninstall.yml -i inventories/<your-inventory>.yml
#
#   # Delete data too:
#   ansible-playbook playbooks/mongodb/uninstall.yml -i inventories/<your-inventory>.yml \
#     -e mongodb_destroy_prune=true

- name: Setup mongodb hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: _setup.yml

- name: MongoDB uninstall
  hosts: mongodb_nodes
  become: true
  gather_facts: true
  pre_tasks:
    - ansible.builtin.include_role:
        name: common
        tasks_from: inherit_localhost_vars
  roles:
    - role: mongodb
      vars:
        mongodb_action: uninstall
