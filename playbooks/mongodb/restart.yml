---
# ─── MongoDB: Rolling Restart ───────────────────────────────────────────────
#
# Restarts MongoDB one node at a time. On each node, each service restarts in
# turn (configsvr, mongod, mongos): a replica set member goes down only while
# the rest of its set is healthy, hands off the primary first, and the next one
# waits until the set is whole again. Stops at the first node that doesn't come
# back.
#
# Each service restarts from its current definition (docker-compose.yml or the
# Quadlet), so this is also how a container change reaches a running cluster:
# a deploy writes it but doesn't restart, and lists what's waiting at the end.
#
# Usage:
#   ansible-playbook playbooks/mongodb/restart.yml -i inventories/<your-inventory>.yml
#
# Scope (optional): -e restart_target=mongod|configsvr|mongos|all  (default: all)

- name: Setup mongodb hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build host group from instances
      ansible.builtin.include_tasks: _setup.yml

- name: Rolling restart of MongoDB
  hosts: mongodb_nodes
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  pre_tasks:
    - name: Inherit localhost vars
      ansible.builtin.include_role:
        name: common
        tasks_from: inherit_localhost_vars
  roles:
    - role: mongodb
      vars:
        mongodb_action: restart
        mongodb_restart_target: "{{ restart_target | default('all') }}"
