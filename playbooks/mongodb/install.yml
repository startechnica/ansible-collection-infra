---
# ─── MongoDB: Cluster Install (POST-PROVISION) ──────────────────────────────
#
# ⚠ NOT A FROM-SCRATCH PIPELINE.
# Assumes the VMs already exist AND Docker is already installed on them.
# The preflight stage will fail with "Error connecting" if Docker isn't up.
#
# For fresh deployments, use ONE of:
#   * playbooks/deploy.yml          — full pipeline
#                                     (validate → netbox → provision →
#                                      docker → mongodb → patroni →
#                                      firewall → routeros)
#   * playbooks/deploy_mongodb.yml  — mongodb-only full pipeline
#                                     (netbox → provision → docker → mongodb)
#
# Use THIS playbook when:
#   * VMs already exist and Docker is already installed
#   * Re-applying mongodb config changes (templates, users, certs)
#   * Day-2 operations that need the mongodb role end-to-end
#
# Sets up:
#   - Preflight checks (Docker, pymongo, RAM)
#   - System user, directories, kernel tuning
#   - TLS certificate generation and distribution
#   - Docker Compose deployment (sharded or replicaset)
#   - Replica set initialization, admin user, shard registration
#   - Application database/user creation (if mongodb_databases is set)
#   - Prometheus exporter setup
#
# Usage:
#   ansible-playbook playbooks/mongodb/install.yml -i inventories/<your-inventory>.yml

- name: Setup mongodb hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: _setup.yml

- name: Provision MongoDB cluster
  hosts: mongodb_nodes
  become: true
  gather_facts: true
  pre_tasks:
    - ansible.builtin.include_role:
        name: common
        tasks_from: inherit_localhost_vars
  roles:
    - role: mongodb
