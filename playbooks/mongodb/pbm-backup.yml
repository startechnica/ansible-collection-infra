---
# ─── MongoDB: Percona Backup (PBM) — on-demand backup ───────────────────────
#
# Cluster-consistent logical backup to S3 via PBM. Works on sharded clusters
# (unlike mongodump-via-mongos). Requires mongodb_pbm_enabled: true.
#
# Usage:
#   ansible-playbook playbooks/mongodb/pbm-backup.yml -i inventories/<inv>.yml

- name: Setup mongodb hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build host group from instances
      ansible.builtin.include_tasks: _setup.yml

- name: PBM backup
  hosts: mongodb_nodes
  become: true
  gather_facts: true
  pre_tasks:
    - name: Inherit localhost vars
      ansible.builtin.include_role:
        name: common
        tasks_from: inherit_localhost_vars
  roles:
    - role: mongodb
      vars:
        mongodb_action: pbm-backup
