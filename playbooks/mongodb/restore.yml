---
# ─── MongoDB: Restore from Backup ───────────────────────────────────────────
#
# Restores a previous mongodump backup to the cluster.
# Requires restore_path pointing to the backup directory on the remote host.
#
# Usage:
#   ansible-playbook playbooks/mongodb/restore.yml -i inventories/<your-inventory>.yml \
#     -e restore_path=/opt/mongodb/backups/2026-04-22_120000

- name: Setup mongodb hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build host group from instances
      ansible.builtin.include_tasks: _setup.yml

- name: MongoDB restore
  hosts: mongodb_nodes
  become: true
  gather_facts: true
  pre_tasks:
    - name: Inherit localhost vars
      ansible.builtin.include_role:
        name: common
        tasks_from: inherit_localhost_vars
  roles:
    - role: mongodb
      vars:
        mongodb_action: restore
