---
# Target-side Python venv used by community.docker, community.mongodb, and
# community.postgresql modules. Created once per host; shared by mongodb +
# patroni roles. After this point, all target-side Ansible modules use the
# venv's Python (pymongo, psycopg2, docker SDK live there), leaving system
# Python untouched.
#
# Skipped on re-invocation (e.g. when preflight runs as a dep for both
# mongodb and patroni in the same play): if ansible_python_interpreter is
# already pointing at the venv, we'd be running ansible.builtin.pip *inside*
# the venv, which requires `packaging` to already be in the venv — a
# bootstrap chicken-and-egg that's easier to dodge than to satisfy.

- name: Bootstrap target Python venv
  when: (ansible_python_interpreter | default('')) != (service_venv_path ~ '/bin/python3')
  block:
    # FCOS / Ignition hosts skip this — they have an immutable rootfs and
    # don't run dnf for system packages. python3 (which includes the venv
    # stdlib module) was layered into the image by the fcos-bootstrap.service
    # at first boot, so `python3 -m venv` already works.
    - name: Ensure python3-venv is available (for venv creation)
      ansible.builtin.package:
        name: "{{ 'python3-venv' if ansible_os_family == 'Debian' else 'python3-virtualenv' }}"
        state: present
      when: instance_init_type | default('ignition') == 'cloud-init'

    # FCOS: ansible.builtin.pip below imports `packaging` from the TARGET's
    # system Python to parse version specs. On Fedora, `packaging` ships in
    # python3-packaging — `python3-pip` does NOT pull it in. Newer
    # fcos.bu.j2 layers both at bootstrap. For older hosts, layer them
    # here. We probe the Python import directly (not rpm -q) because that's
    # what ansible.builtin.pip actually needs and survives package renames.
    - name: Probe `packaging` importability on FCOS
      ansible.builtin.command: python3 -c "import packaging"
      register: _fcos_pkg_check
      changed_when: false
      failed_when: false
      when: instance_init_type | default('ignition') == 'ignition'

    - name: Layer python3-pip + python3-packaging via rpm-ostree (FCOS)
      ansible.builtin.command: rpm-ostree install --apply-live --allow-inactive python3-pip python3-packaging
      register: _fcos_pip_install
      changed_when: _fcos_pip_install.rc == 0
      when:
        - instance_init_type | default('ignition') == 'ignition'
        - _fcos_pkg_check.rc | default(0) != 0

    - name: "Create target venv at {{ service_venv_path }}"
      ansible.builtin.pip:
        name: "{{ service_venv_packages }}"
        virtualenv: "{{ service_venv_path }}"
        virtualenv_command: python3 -m venv

    - name: Switch to venv Python for subsequent tasks
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ service_venv_path }}/bin/python3"
