---
# Patroni VIP settings. Fails when patroni_vip_address is set but
# patroni_vip_mask is empty or patroni_vip_engine is not vip-manager /
# keepalived. The patroni role runs the same assert in
# tasks/{docker,podman}/preflight.yml; this copy fails earlier, before
# preflight changes anything on the hosts, and works without the patroni role.
#
# main.yml runs it for hosts in patroni_nodes. Other playbooks can call it
# directly:
#   - ansible.builtin.include_role:
#       name: preflight
#       tasks_from: patroni_vip

# Loads only patroni's defaults/main/vip.yml (patroni_vip_engine,
# patroni_vip_address, patroni_vip_mask, patroni_vip_iface) and none of its
# computed vars (vars/empty.yml is empty). Runs no tasks; inventory values
# still win.
- name: Import patroni VIP variables
  ansible.builtin.import_role:
    name: patroni
    tasks_from: export_vars
    defaults_from: main/vip.yml
    vars_from: empty.yml

- name: Validate Patroni VIP configuration (when VIP is enabled)
  ansible.builtin.assert:
    that:
      - patroni_vip_mask | string | length > 0
      - patroni_vip_engine in ['vip-manager', 'keepalived']
    fail_msg: >-
      patroni_vip_address='{{ patroni_vip_address }}' is set but patroni_vip_mask is empty or
      patroni_vip_engine='{{ patroni_vip_engine }}' is not
      'vip-manager' / 'keepalived'. Set patroni_vip_mask (e.g. 24) and a valid
      patroni_vip_engine, or unset 'patroni_vip_address' to disable the floating-IP service.
    success_msg: "VIP {{ patroni_vip_address }}/{{ patroni_vip_mask }} configured for {{ patroni_vip_engine }}."
  when: patroni_vip_address | length > 0
  run_once: true
