---
# Molecule scenario for preflight — reference pattern for this collection.
#
# Runs the role against an Ubuntu 24.04 container that has Docker preinstalled
# (geerlingguy/docker-ubuntu2404-ansible), so the role's docker checks can pass.
#
# This scenario is the blueprint for adding molecule tests to other roles.
# Leaf/independent roles follow this shape directly; cluster roles (mongodb,
# patroni) need multi-node + docker-in-docker which is a larger scaffold.

driver:
  name: docker

platforms:
  - name: preflight-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      stdout_callback: yaml
      callbacks_enabled: profile_tasks
  inventory:
    host_vars:
      preflight-ubuntu2404:
        ansible_user: root

verifier:
  name: ansible
