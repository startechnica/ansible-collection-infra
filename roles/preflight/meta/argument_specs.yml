---
argument_specs:
  main:
    short_description: Shared preflight for Docker-based cluster roles
    description:
      - Validates the Ansible controller has `cryptography` installed, the target host is root/become, Docker is running, and `docker compose` is available.
      - On hosts in `patroni_nodes`, also checks the Patroni VIP settings (`patroni_vip_address`, `patroni_vip_mask`, `patroni_vip_engine`), importing only patroni's VIP defaults.
      - Before the docker / podman checks, fails when the `container_engine` binary isn't on PATH.
      - Included as a role dependency by `mongodb` and `patroni`.
    options:
      debug:
        type: bool
        default: false
        description: Verbose / introspection output. Defensive `| bool` filter still used in tasks because CLI `-e debug=true` arrives as a string.
      container_mem_request_mb:
        type: int
        description: >-
          RAM the CALLING role is about to commit on this host (MB) — container
          memory caps plus any in-process allocation the role configures, such
          as PostgreSQL's shared_buffers. Leave unset to skip the memory check
          entirely.
      container_mem_reserved_mb:
        type: int
        default: 0
        description: >-
          RAM already committed on this host by something OUTSIDE the calling
          role — a second stack on the same node, a non-container daemon. Roles
          cannot discover one another, so this is inventory's job: on a node
          running both mongodb and patroni, set it to the other stack's total
          so each run sees the whole budget.
      container_mem_headroom_pct:
        type: int
        default: 15
        description: >-
          Share of total RAM deliberately left unbudgeted for the kernel, page
          cache and anything not counted above. The check warns once the
          committed total crosses `memtotal_mb * (100 - this) / 100`, rather
          than waiting for it to exceed RAM outright.
      container_mem_strict:
        type: bool
        default: false
        description: >-
          Fail the run when the committed total exceeds total RAM, instead of
          warning. Off by default so an already over-committed host stays
          manageable; the headroom warning is advisory either way.
      service_venv_path:
        type: str
        default: /opt/ansible-venv
        description: >-
          Filesystem path of the target-side Python venv. Created by this role
          and used for every subsequent Ansible module call on the target
          (ansible_python_interpreter is set as a host fact after creation).
      service_venv_packages:
        type: list
        elements: str
        default: [pymongo==4.6.3, psycopg2-binary, docker]
        description: >-
          Packages installed into the target venv. Covers the three
          community.* collections used by mongodb and patroni.
      service_kernel_modules:
        type: list
        elements: str
        default: [overlay, br_netfilter]
        description: >-
          Kernel modules to load and persist via /etc/modules-load.d/.
          Override to replace the default set, or extend in inventory
          (e.g. add nf_conntrack, vhost_net, ip_vs) for stacks that need
          more than the Docker baseline.
      docker_registries:
        type: list
        elements: dict
        default: []
        description: >-
          Optional list of Docker registry credentials. When non-empty,
          preflight runs `docker login` on each target so private images
          (patroni_image, mongodb_image, ...) can be pulled. Each entry
          requires `registry`, `username`, `password`; optional
          `reauthorize` (force re-login after token rotation) and
          `state` (default `present`, set `absent` to log out).
          Always pass passwords through Ansible Vault.
        options:
          registry:
            type: str
            required: true
            description: Registry hostname (e.g. ghcr.io, harbor.example.com).
          username:
            type: str
            required: true
          password:
            type: str
            required: true
          reauthorize:
            type: bool
            default: false
          state:
            type: str
            default: present
            choices: [present, absent]
