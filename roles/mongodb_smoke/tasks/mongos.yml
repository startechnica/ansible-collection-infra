---
# mongos — client entry point.
#   * Port reachable on TCP
#   * db.runCommand({ping:1}).ok = 1

- name: "3a. mongos port reachable"
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ mongodb_mongos_node_port }}"
    timeout: 30
    state: started
  register: _smoke_mongos_port
  failed_when: false
  run_once: true
  when: smoke_check_mongos | bool

- name: "3b. mongos ping (db.runCommand({ping:1}))"
  ansible.builtin.command: >-
    podman exec mongodb-mongos mongosh --quiet
    --tls --tlsCertificateKeyFile /etc/mongo/ssl/healthcheck.pem
    --tlsCAFile /etc/mongo/ssl/ca.pem
    --authenticationMechanism MONGODB-X509 --authenticationDatabase '$external'
    --port {{ mongodb_mongos_node_port }} --eval 'db.runCommand({ ping: 1 }).ok'
  register: _smoke_ping
  changed_when: false
  failed_when: false
  run_once: true
  when: smoke_check_mongos | bool
