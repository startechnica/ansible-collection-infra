---
# Defaults consumed by mongodb_smoke (passed via the play that targets
# mongodb_nodes).

# Replication wait before reading the smoke doc.
mongodb_smoke_replication_wait_seconds: 5

# Unique smoke collection name + DB. Defaulted here so the playbook
# wrapper doesn't need to compute them per-invocation.
mongodb_smoke_db: "startechnica_smoke"
mongodb_smoke_collection: "startechnica_smoke_{{ ansible_facts['date_time'].iso8601 | default(lookup('pipe', 'date -u +%FT%TZ')) | regex_replace('[^0-9]', '') }}"

# Cert expiry threshold (days remaining).
mongodb_smoke_cert_min_days: 30

# Master switch.
mongodb_smoke_enabled: true

# Per-component toggles (mirror the patroni_smoke shape). Setting any to
# false removes that component's checks from both collection and summary.
mongodb_smoke_check_containers: true
mongodb_smoke_check_cluster_state: true
mongodb_smoke_check_mongos: true
mongodb_smoke_check_endtoend: true
mongodb_smoke_check_pbm: true
mongodb_smoke_check_mongodump_timer: true
mongodb_smoke_check_tls: true

# ── Borrowed from the mongodb role ──────────────────────────────────────────
# The smoke checks read these mongodb-role variables directly, but this role
# does not load the mongodb role's defaults/ or vars/. Re-declare them here
# with the SAME defaults so a smoke run works against an inventory that only
# overrides a subset. These are role defaults (lowest precedence), so anything
# the inventory sets for the mongodb deploy still wins here.
#
# Keep in sync with roles/mongodb/defaults/main.yml + roles/mongodb/vars/main.yml.
mongodb_cluster_type: sharded
mongodb_root_dir: /opt/mongodb
mongodb_tls_dir: "{{ mongodb_root_dir }}/ssl"
mongodb_container_engine: "{{ container_engine | default('podman') }}"

mongodb_shard_replset: rs0
mongodb_config_replset: configReplSet

mongodb_mongos_node_port: 27017
mongodb_configsvr_node_port: 27018
mongodb_mongod_node_port: 27019

# Engine-derived exec ports (docker publishes 27017; podman uses the node port).
# Mirrors roles/mongodb/vars/main.yml.
mongodb_mongod_exec_port: "{{ 27017 if mongodb_container_engine == 'docker' else mongodb_mongod_node_port }}"
mongodb_configsvr_exec_port: "{{ 27017 if mongodb_container_engine == 'docker' else mongodb_configsvr_node_port }}"

mongodb_backup_enabled: true
mongodb_exporter_enabled: true
mongodb_pbm_enabled: false
mongodb_pbm_init_backup: true
