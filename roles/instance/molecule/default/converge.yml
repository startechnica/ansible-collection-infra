---
# Molecule converge — exercises `validate/input.yml` (pure-data validation)
# against a happy-path fixture and several negative fixtures. No vCenter
# is contacted; the role's vCenter-touching tasks live in `validate/vms.yml`
# / `validate.yml` orchestrator and aren't called here.
#
# Each negative case lives in its own play so the failed-state from one
# doesn't bleed into the next. Common scaffolding is in group_vars/all.yml;
# the per-play `vars:` block only overrides `instances:`.
#
# Pattern for each negative case:
#   block:
#     - import_role: tasks_from: validate/input.yml
#     - fail: "should have failed but didn't"
#   rescue:
#     - assert: ansible_failed_result.msg matches the expected fragment

# ── Happy path ─────────────────────────────────────────────────────────────
- name: "Molecule :: happy path (single + multi-NIC + multi-disk)"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    instances:
      - hostname: test-vm-01
        networks:
          - ipv4: 10.0.0.10/24

      - hostname: test-vm-02
        name: explicit-vcenter-name
        networks:
          - name: pg-mgmt
            ipv4: 10.0.0.20/24
            ipv6: "2001:db8::20/64"
          - name: pg-data
            ipv4: dhcp
            mtu: 9000
        disks:
          - size_gb: 40
          - size_gb: 200
            type: thick

  tasks:
    - name: Run pure-data validation against happy fixture
      ansible.builtin.import_role:
        name: instance
        tasks_from: validate/input.yml

    - name: Assert name normalization defaults from hostname when omitted
      ansible.builtin.assert:
        that:
          - instances | length == 2
          - instances[0].name == 'test-vm-01' # defaulted from hostname
          - instances[1].name == 'explicit-vcenter-name' # explicit `name` preserved
        fail_msg: "Hostname-to-name normalization didn't produce the expected list"
        success_msg: "Hostname-to-name normalization works (2 instances normalized)"

# ── Negative: memory_mb not divisible by 4 ─────────────────────────────────
- name: "Molecule :: reject memory_mb not divisible by 4"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _fixture_instances:
      - hostname: bad-memory
        memory_mb: 1023
        networks:
          - ipv4: 10.0.0.10/24
  tasks:
    # `validate/input.yml` mutates `instances` via set_fact, which persists
    # across plays on the same host (set_fact precedence > play vars). Clear
    # facts at the start of each negative play so play-level `vars:` wins.
    - name: "Reset instances fact for this play"
      ansible.builtin.set_fact:
        instances: "{{ _fixture_instances }}"
    - name: Run validation under negative fixture
      block:
        - name: Invoke validate/input.yml (expect failure)
          ansible.builtin.import_role:
            name: instance
            tasks_from: validate/input.yml
        - name: Force test failure if validation passed
          ansible.builtin.fail:
            msg: "Validation should have rejected memory_mb=1023 but didn't"
      rescue:
        - name: Verify rescue caught the expected error
          ansible.builtin.assert:
            that: (ansible_failed_result | to_json) is search('multiple of 4')
            fail_msg: "Wrong failure message: {{ ansible_failed_result.msg }}"
            success_msg: "Correctly rejected memory_mb=1023"

# ── Negative: NIC with bad CIDR ────────────────────────────────────────────
- name: "Molecule :: reject NIC with invalid IPv4 CIDR"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _fixture_instances:
      - hostname: bad-cidr
        networks:
          - ipv4: not-a-cidr
  tasks:
    - name: "Reset instances fact for this play"
      ansible.builtin.set_fact:
        instances: "{{ _fixture_instances }}"
    - name: Run validation under negative fixture
      block:
        - name: Invoke validate/input.yml (expect failure)
          ansible.builtin.import_role:
            name: instance
            tasks_from: validate/input.yml
        - name: Force test failure if validation passed
          ansible.builtin.fail:
            msg: "Validation should have rejected ipv4='not-a-cidr' but didn't"
      rescue:
        - name: Verify rescue caught the expected error
          ansible.builtin.assert:
            that: (ansible_failed_result | to_json) is search('Invalid NIC')
            fail_msg: "Wrong failure message: {{ ansible_failed_result.msg }}"
            success_msg: "Correctly rejected invalid IPv4 CIDR"

# ── Negative: NIC with no ipv4 AND no ipv6 ─────────────────────────────────
- name: "Molecule :: reject NIC with neither ipv4 nor ipv6"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _fixture_instances:
      - hostname: empty-nic
        networks:
          - mtu: 1500 # NIC with no address at all
  tasks:
    - name: "Reset instances fact for this play"
      ansible.builtin.set_fact:
        instances: "{{ _fixture_instances }}"
    - name: Run validation under negative fixture
      block:
        - name: Invoke validate/input.yml (expect failure)
          ansible.builtin.import_role:
            name: instance
            tasks_from: validate/input.yml
        - name: Force test failure if validation passed
          ansible.builtin.fail:
            msg: "Validation should have rejected an addressless NIC but didn't"
      rescue:
        - name: Verify rescue caught the expected error
          ansible.builtin.assert:
            that: (ansible_failed_result | to_json) is search('Invalid NIC')
            fail_msg: "Wrong failure message: {{ ansible_failed_result.msg }}"
            success_msg: "Correctly rejected NIC with no ipv4/ipv6"

# ── Negative: disk with size_gb 0 (after merge with instance_disks) ────────
- name: "Molecule :: reject explicit per-disk size_gb 0"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Override instance_disks to drop size_gb so the merged disk has no size
    instance_disks:
      type: thin
    _fixture_instances:
      - hostname: zero-disk
        networks:
          - ipv4: 10.0.0.10/24
        disks:
          - size_gb: 0 # explicitly invalid
  tasks:
    - name: "Reset instances fact for this play"
      ansible.builtin.set_fact:
        instances: "{{ _fixture_instances }}"
    - name: Run validation under negative fixture
      block:
        - name: Invoke validate/input.yml (expect failure)
          ansible.builtin.import_role:
            name: instance
            tasks_from: validate/input.yml
        - name: Force test failure if validation passed
          ansible.builtin.fail:
            msg: "Validation should have rejected size_gb=0 but didn't"
      rescue:
        - name: Verify rescue caught the expected error
          ansible.builtin.assert:
            that: (ansible_failed_result | to_json) is search('positive size_gb')
            fail_msg: "Wrong failure message: {{ ansible_failed_result.msg }}"
            success_msg: "Correctly rejected size_gb=0"

# ── Negative: NIC omits `name`, role-level portgroup_name unset ────────────
- name: "Molecule :: reject NIC without `name` when portgroup_name is unset"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    portgroup_name: "" # role-level fallback intentionally cleared
    _fixture_instances:
      - hostname: nameless-nic
        networks:
          - ipv4: 10.0.0.10/24 # no `name:` — needs portgroup_name fallback
  tasks:
    - name: "Reset instances fact for this play"
      ansible.builtin.set_fact:
        instances: "{{ _fixture_instances }}"
    - name: Run validation under negative fixture
      block:
        - name: Invoke validate/input.yml (expect failure)
          ansible.builtin.import_role:
            name: instance
            tasks_from: validate/input.yml
        - name: Force test failure if validation passed
          ansible.builtin.fail:
            msg: "Validation should have required portgroup_name fallback but didn't"
      rescue:
        - name: Verify rescue caught the expected error
          ansible.builtin.assert:
            that: (ansible_failed_result | to_json) is search('portgroup_name is required')
            fail_msg: "Wrong failure message: {{ ansible_failed_result.msg }}"
            success_msg: "Correctly required portgroup_name fallback"
