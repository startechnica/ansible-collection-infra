---
# Each negative case in converge.yml uses block:/rescue: + assert; if
# converge succeeds, every assertion has already been verified. This
# play is a thin smoke-test that re-runs the happy-path validation
# end-to-end as a final sanity check.

- name: "Molecule :: verify happy-path normalization is idempotent"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    instances:
      - hostname: verify-vm
        networks:
          - ipv4: 10.0.0.99/24
  tasks:
    - name: Run validate/input.yml a second time
      ansible.builtin.import_role:
        name: instance
        tasks_from: validate/input.yml

    - name: Assert idempotent normalization
      ansible.builtin.assert:
        that:
          - instances[0].name == 'verify-vm'
          - instances[0].hostname == 'verify-vm'
        fail_msg: "Idempotent normalization broke"
        success_msg: "Idempotent re-normalization OK"
