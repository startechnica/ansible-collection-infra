---
# Static reference data for the role. `vars/` precedence (~18) is higher than
# any inventory layer, so users can't accidentally override these — which is
# what we want for tables of facts that are tied to the underlying platform
# (vSphere version → max hardware version) rather than to a deployment.

# Absolute vCenter inventory path for the VM folder. Derived from the public
# `instance_datacenter` and `instance_folder` knobs; centralised here so every module
# call agrees on the format. `instance_folder` is allowed to be empty — that
# routes VMs to the instance_datacenter's root VM folder, which is valid in vCenter.
# The conditional drops the trailing slash in the empty case so the path is
# the canonical `/<dc>/vm` rather than `/<dc>/vm/` (some module versions
# reject the trailing slash form).
instance_folder_path: "/{{ instance_datacenter }}/vm{% if instance_folder | length > 0 %}/{{ instance_folder }}{% endif %}"

# Hardware Version Compatibility Map
# Reference mapping from ESXi version to the highest VM hardware version
# that vSphere version supports. Use this to look up the correct
# `vsphere_hw_version` value for your environment.
# ref: https://knowledge.broadcom.com/external/article?legacyId=1003746
vsphere_hw_version_map:
  "esxi-8.0u3": 21
  "esxi-8.0u2": 21
  "esxi-8.0": 20
  "esxi-7.0u3": 19
  "esxi-7.0u2": 19
  "esxi-7.0": 17
  "esxi-6.7u2": 15
  "esxi-6.7": 14
  "esxi-6.5": 13
  "esxi-6.0": 11

# Auto-resolved ignition defaults — sourced from
# `_platform_map[instance_platform_preset].ignition` (the canonical
# per-flavour data in roles/common/vars/main.yml), with `instance_user_name`
# taken from the row's top-level `username`.
#
# The public knob `ignition_flavour_default` in defaults/main.yml is just a
# passthrough to this — that way an inventory CAN still override the whole
# dict (defaults < inventory) but the resolution logic stays centralised.
#
# Self-references go through the PUBLIC `ignition_flavour_default.channel`
# so an inventory override of `channel` propagates into the {channel}
# substitutions in metadata_url / ova_url. Lazy evaluation: nothing here
# is resolved until `instance_platform_preset` is set to an ignition row.
_ignition_flavour_default:
  butane_template: "{{ _platform_map[instance_platform_preset].ignition.butane_template }}"
  butane_strict: false
  butane_variant: "{{ _platform_map[instance_platform_preset].ignition.butane_variant }}"
  butane_spec_version: "{{ _platform_map[instance_platform_preset].ignition.butane_spec_version }}"
  channel: "{{ _platform_map[instance_platform_preset].ignition.default_channel }}"
  metadata_url: >-
    {{ _platform_map[instance_platform_preset].ignition.metadata_url
       | replace('{channel}', ignition_flavour_default.channel | default(_platform_map[instance_platform_preset].ignition.default_channel)) }}
  ova_url: >-
    {{ _platform_map[instance_platform_preset].ignition.ova_url
       | replace('{channel}', ignition_flavour_default.channel | default(_platform_map[instance_platform_preset].ignition.default_channel)) }}
  instance_user_name: "{{ _platform_map[instance_platform_preset].username }}"
