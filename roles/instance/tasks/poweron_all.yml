---
# Phase 2b: power on each VM IN SEQUENCE. The vmware_guest call blocks
# until vSphere acks the power-on request, then the loop moves to the
# next VM. That ack happens well before the guest OS is ready — the
# actual boot proceeds in the background on vSphere's side, so by the
# time the loop finishes, all VMs are mid-boot in parallel. Subsequent
# wait_for_boot_all.yml then waits for vmtools+IP across the fleet in a
# single batch (still parallel).
#
# Why serial-ack instead of async/poll-0:
#   * Forces deterministic order — operator sees N1 powered on before
#     N2, before N3 — easier to follow in -v output and matches the
#     mental model of "bring up node 1, then 2, then 3".
#   * Avoids a vSphere thundering-herd when N VMs all power-on the same
#     second and contend for the same datastore / network.
#   * Wall-clock cost is small: each ack is sub-second; the long part
#     (boot + cloud-init/ignition) is still parallel via the wait task.
#
# Power-on itself is the SAME vSphere API call for cloud-init and ignition.
# Only the per-init-type status bookkeeping (cloud_init_status vs
# ignition_status) differs — handled by a tiny dispatched include below.

- name: "Power on each VM (serial)"
  community.vmware.vmware_guest:
    hostname: "{{ vcenter_connect.hostname }}"
    username: "{{ vcenter_connect.username }}"
    password: "{{ vcenter_connect.password }}"
    validate_certs: "{{ vcenter_connect.validate_certs }}"
    datacenter: "{{ instance_datacenter }}"
    folder: "{{ instance_folder_path }}"
    name: "{{ instance.name }}"
    state: poweredon
  delegate_to: localhost
  loop: "{{ instances_to_create }}"
  loop_control:
    loop_var: instance
    label: "{{ instance.name }}"

# Bookkeeping fact — the cloud-init / ignition cleanup tasks downstream
# expect their respective `*_status[name].powered_on` flag set. Dispatch
# into the relevant init-type role via computed name; the dedicated
# `poweron_mark.yml` task there does ONLY the set_fact bookkeeping.
- name: "Mark VMs as powered on (init-type bookkeeping)"
  ansible.builtin.include_role:
    name: "instance_{{ instance_init_type | replace('-', '_') }}"
    tasks_from: poweron_mark.yml
