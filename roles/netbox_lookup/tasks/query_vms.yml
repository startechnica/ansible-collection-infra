---
# Query VMs and IPs from NetBox

- name: Build query filter
  ansible.builtin.set_fact:
    _nb_query_filter: >-
      {{ {}
         | combine({'cluster': netbox_lookup_cluster} if netbox_lookup_cluster | length > 0 else {})
         | combine({'site': netbox_lookup_site} if netbox_lookup_site | length > 0 else {})
         | combine({'tenant': netbox_lookup_tenant} if netbox_lookup_tenant | length > 0 else {})
         | combine({'role': netbox_lookup_role} if netbox_lookup_role | length > 0 else {})
         | combine({'status': netbox_lookup_status} if netbox_lookup_status | length > 0 else {})
         | combine({'tag': netbox_lookup_tags | join(',') } if netbox_lookup_tags | length > 0 else {})
      }}

- name: Query VMs from NetBox
  ansible.builtin.uri:
    url: "{{ netbox_connect.url }}/api/virtualization/virtual-machines/?{{ _nb_query_filter | urlencode }}&limit=1000"
    method: GET
    headers: "{{ _netbox_api_headers }}"
    validate_certs: "{{ netbox_connect.validate_certs }}"
    status_code: [200]
  delegate_to: localhost
  check_mode: false
  register: _nb_vms_raw

- name: Set VM list
  ansible.builtin.set_fact:
    netbox_vms: "{{ _nb_vms_raw.json.results | default([]) }}"

- name: Query IP addresses for each VM
  ansible.builtin.uri:
    url: "{{ netbox_connect.url }}/api/ipam/ip-addresses/?virtual_machine_id={{ vm_item.id }}"
    method: GET
    headers: "{{ _netbox_api_headers }}"
    validate_certs: "{{ netbox_connect.validate_certs }}"
    status_code: [200]
  delegate_to: localhost
  check_mode: false
  loop: "{{ netbox_vms }}"
  loop_control:
    loop_var: vm_item
    label: "{{ vm_item.name }}"
  register: _nb_ips

- name: Build IP map
  ansible.builtin.set_fact:
    _nb_ip_map: >-
      {{ dict(
        _nb_ips.results
        | map(attribute='vm_item')
        | map(attribute='name')
        | zip(
          _nb_ips.results
          | map(attribute='json')
          | map(attribute='results')
        )
      ) }}

- name: Display NetBox query results
  ansible.builtin.debug:
    msg: "Found {{ netbox_vms | length }} VMs from NetBox (filter: {{ _nb_query_filter }})"
