---
# Query VMs and IPs from NetBox

- name: Build query filter
  ansible.builtin.set_fact:
    _nb_query_filter: >-
      {{ {}
         | combine({'cluster': netbox_query_cluster} if netbox_query_cluster | length > 0 else {})
         | combine({'site': netbox_query_site} if netbox_query_site | length > 0 else {})
         | combine({'tenant': netbox_query_tenant} if netbox_query_tenant | length > 0 else {})
         | combine({'role': netbox_query_role} if netbox_query_role | length > 0 else {})
         | combine({'status': netbox_query_status} if netbox_query_status | length > 0 else {})
         | combine({'tag': netbox_query_tags | join(',') } if netbox_query_tags | length > 0 else {})
      }}

- name: Query VMs from NetBox
  uri:
    url: "{{ netbox_connect.url }}/api/virtualization/virtual-machines/?{{ _nb_query_filter | urlencode }}&limit=1000"
    method: GET
    headers:
      Authorization: "Token {{ netbox_connect.token }}"
    validate_certs: "{{ netbox_connect.validate_certs | default(false) }}"
    status_code: [200]
  delegate_to: localhost
  check_mode: false
  register: _nb_vms_raw

- name: Set VM list
  ansible.builtin.set_fact:
    netbox_vms: "{{ _nb_vms_raw.json.results | default([]) }}"

- name: Query IP addresses for each VM
  uri:
    url: "{{ netbox_connect.url }}/api/ipam/ip-addresses/?virtual_machine_id={{ vm_item.id }}"
    method: GET
    headers:
      Authorization: "Token {{ netbox_connect.token }}"
    validate_certs: "{{ netbox_connect.validate_certs | default(false) }}"
    status_code: [200]
  delegate_to: localhost
  check_mode: false
  loop: "{{ netbox_vms }}"
  loop_control:
    loop_var: vm_item
    label: "{{ vm_item.name }}"
  register: _nb_ips

- name: Build IP map
  ansible.builtin.set_fact:
    _nb_ip_map: >-
      {{ dict(
        _nb_ips.results
        | map(attribute='vm_item')
        | map(attribute='name')
        | zip(
          _nb_ips.results
          | map(attribute='json')
          | map(attribute='results')
        )
      ) }}

- name: Display NetBox query results
  ansible.builtin.debug:
    msg: "Found {{ netbox_vms | length }} VMs from NetBox (filter: {{ _nb_query_filter }})"
