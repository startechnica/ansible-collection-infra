---
# Enrich existing instances entries with data from NetBox.
# For VMs that have a name but no ipv4, query NetBox to fill in the IP and other fields.
#
# Uses instance_cluster_name as the NetBox cluster filter to scope the query.
# Resolves instance_cluster_name -> cluster_id first, since NetBox's `cluster` filter
# expects the cluster *slug* (not the display name).

- name: Find VMs that need IP enrichment
  ansible.builtin.set_fact:
    _instances_need_ip: "{{ instances | selectattr('name', 'defined') | rejectattr('ipv4', 'defined') | list }}"
    _instances_have_ip: "{{ instances | selectattr('ipv4', 'defined') | list }}"

- name: Skip if all VMs already have IPs
  ansible.builtin.debug:
    msg: "All {{ instances | length }} VMs already have IPs — skipping NetBox enrichment"
  when: _instances_need_ip | length == 0

- name: Fetch all clusters from NetBox (paginated)
  uri:
    url: "{{ netbox_connect.url }}/api/virtualization/clusters/?limit=1000"
    method: GET
    headers:
      Authorization: "Token {{ netbox_connect.token }}"
    validate_certs: "{{ netbox_connect.validate_certs | default(false) }}"
    status_code: [200]
  delegate_to: localhost
  check_mode: false
  register: _nb_clusters_all
  when:
    - _instances_need_ip | length > 0
    - instance_cluster_name | default('') | length > 0

- name: Show what NetBox returned (debug)
  ansible.builtin.debug:
    msg: >-
      NetBox returned {{ _nb_clusters_all.json.count | default(0) }} clusters.
      Names: {{ (_nb_clusters_all.json.results | default([])) | map(attribute='name') | list }}
  when:
    - _instances_need_ip | length > 0
    - instance_cluster_name | default('') | length > 0
    - debug

- name: Pick cluster by case-insensitive exact name
  ansible.builtin.set_fact:
    _nb_cluster_match: >-
      {{ ((_nb_clusters_all.json.results | default([]))
          | selectattr('name', 'defined')
          | selectattr('name', 'match', '(?i)^' ~ (instance_cluster_name | regex_escape) ~ '$')
          | list | first) | default({}) }}
  when:
    - _instances_need_ip | length > 0
    - instance_cluster_name | default('') | length > 0

- name: Fail if cluster not found in NetBox
  fail:
    msg: >-
      NetBox cluster '{{ instance_cluster_name }}' not found.
      API returned {{ _nb_clusters_all.json.count | default(0) }} clusters total.
      Available cluster names: {{ (_nb_clusters_all.json.results | default([])) | map(attribute='name') | list }}.
      If the list is empty, the API token lacks read access to virtualization.clusters.
      If the cluster is listed under a different spelling, update instance_cluster_name in the inventory.
  when:
    - _instances_need_ip | length > 0
    - instance_cluster_name | default('') | length > 0
    - (_nb_cluster_match | default({}) | length) == 0

- name: Build scope filter fragment
  ansible.builtin.set_fact:
    _nb_cluster_filter: >-
      {%- if (_nb_cluster_match | default({}) | length) > 0 -%} &cluster_id={{ _nb_cluster_match.id }}{%- elif instance_folder | default('') | length > 0 -%} &cf_vcenter_folder={{ instance_folder
      | urlencode }}{%- else -%} {%- endif -%}
  when: _instances_need_ip | length > 0

- name: Query NetBox for VMs needing enrichment
  uri:
    url: "{{ netbox_connect.url }}/api/virtualization/virtual-machines/?name={{ vm_item.name | urlencode }}{{ _nb_cluster_filter | default('') }}"
    method: GET
    headers:
      Authorization: "Token {{ netbox_connect.token }}"
    validate_certs: "{{ netbox_connect.validate_certs | default(false) }}"
    status_code: [200]
  delegate_to: localhost
  check_mode: false
  loop: "{{ _instances_need_ip }}"
  loop_control:
    loop_var: vm_item
    label: "{{ vm_item.name }}"
  register: _nb_enrich_vms
  when: _instances_need_ip | length > 0

# ── Resolve VRF name → ID (NetBox's ip-address `vrf=` filter wants ID, not name) ──

- name: Resolve vrf_id from netbox_vrf name
  uri:
    url: "{{ netbox_connect.url }}/api/ipam/vrfs/?name={{ netbox_vrf | urlencode }}"
    method: GET
    headers:
      Authorization: "Token {{ netbox_connect.token }}"
    validate_certs: "{{ netbox_connect.validate_certs | default(false) }}"
    status_code: [200]
  delegate_to: localhost
  check_mode: false
  register: _nb_vrf
  when:
    - _instances_need_ip | length > 0
    - netbox_vrf | length > 0

- name: Fail if vrf not found in NetBox
  fail:
    msg: >-
      netbox_vrf '{{ netbox_vrf }}' not found. API returned
      {{ _nb_vrf.json.count | default(0) }} VRFs for name={{ netbox_vrf }}.
      Verify the name (case-sensitive) in NetBox → IPAM → VRFs.
  when:
    - _instances_need_ip | length > 0
    - netbox_vrf | length > 0
    - (_nb_vrf.json.count | default(0) | int) == 0

- name: Build VRF filter fragment
  ansible.builtin.set_fact:
    _nb_vrf_filter: >-
      {%- if netbox_vrf | length > 0
             and (_nb_vrf.json.count | default(0) | int) > 0 -%}
      &vrf_id={{ _nb_vrf.json.results[0].id }}
      {%- else -%}
      {%- endif -%}
  when: _instances_need_ip | length > 0

- name: Query IPs for enriched VMs (optionally VRF-filtered)
  uri:
    url: >-
      {{ netbox_connect.url }}/api/ipam/ip-addresses/?virtual_machine_id={{
      _nb_vm_result.json.results[0].id }}{{ _nb_vrf_filter | default('') }}
    method: GET
    headers:
      Authorization: "Token {{ netbox_connect.token }}"
    validate_certs: "{{ netbox_connect.validate_certs | default(false) }}"
    status_code: [200]
  delegate_to: localhost
  check_mode: false
  loop: "{{ _nb_enrich_vms.results | default([]) }}"
  loop_control:
    loop_var: _nb_vm_result
    label: "{{ _nb_vm_result.vm_item.name }}"
  register: _nb_enrich_ips
  when:
    - _instances_need_ip | length > 0
    - _nb_vm_result.json.count | default(0) | int > 0

- name: Build enriched VMs
  ansible.builtin.set_fact:
    _instances_enriched: []

- name: Enrich VMs with NetBox data (ipv4 + ipv6, VRF-aware)
  ansible.builtin.set_fact:
    _instances_enriched: >-
      {{ _instances_enriched + [
        _instances_need_ip[idx]
        | combine({'ipv4': _ipv4_addr} if _ipv4_addr | length > 0 else {})
        | combine({'ipv6': _ipv6_addr} if _ipv6_addr | length > 0 else {})
        | combine({
          'netbox_id': _nb_enrich_vms.results[idx].json.results[0].id
        } if (_nb_enrich_vms.results[idx].json.count | default(0) | int > 0) else {})
      ] }}
  vars:
    _ip_results: "{{ _nb_enrich_ips.results[idx].json.results | default([]) }}"
    _ipv4_addr: >-
      {{ (_ip_results | selectattr('family.value', 'equalto', 4) | list | first | default({})).address | default('') }}
    _ipv6_addr: >-
      {{ (_ip_results | selectattr('family.value', 'equalto', 6) | list | first | default({})).address | default('') }}
  loop: "{{ range(_instances_need_ip | length) | list }}"
  loop_control:
    loop_var: idx
    label: "{{ _instances_need_ip[idx].name }}"
  when: _instances_need_ip | length > 0

- name: Fail if any VM is still missing ipv4 after enrichment
  fail:
    msg: >-
      NetBox enrichment could not resolve ipv4 for:
      {{ _instances_enriched
         | selectattr('ipv4', 'undefined')
         | map(attribute='name') | list
         + (_instances_enriched
            | selectattr('ipv4', 'defined')
            | selectattr('ipv4', 'equalto', '')
            | map(attribute='name') | list)
      }}. Verify these VMs exist in NetBox (cluster '{{ instance_cluster_name | default('') }}')
      and have an IP assigned on interface '{{ netbox_lookup_interface }}'.
  when:
    - _instances_need_ip | length > 0
    - (_instances_enriched | rejectattr('ipv4', 'defined') | list | length > 0) or (_instances_enriched | selectattr('ipv4', 'defined') | selectattr('ipv4', 'equalto', '') | list |
      length > 0)

- name: Merge enriched VMs back into instances list
  ansible.builtin.set_fact:
    instances: "{{ _instances_have_ip + _instances_enriched }}"
  when: _instances_need_ip | length > 0

# ── Fetch NetBox tags for every VM that doesn't already have tags in inventory ──

- name: Find VMs without tags
  ansible.builtin.set_fact:
    _instances_need_tags: "{{ instances | selectattr('name', 'defined') | rejectattr('tags', 'defined') | list }}"

- name: Query NetBox tags for those VMs
  uri:
    url: "{{ netbox_connect.url }}/api/virtualization/virtual-machines/?name={{ vm_item.name | urlencode }}{{ _nb_cluster_filter | default('') }}"
    method: GET
    headers:
      Authorization: "Token {{ netbox_connect.token }}"
    validate_certs: "{{ netbox_connect.validate_certs | default(false) }}"
    status_code: [200]
  delegate_to: localhost
  check_mode: false
  loop: "{{ _instances_need_tags }}"
  loop_control:
    loop_var: vm_item
    label: "{{ vm_item.name }}"
  register: _nb_tag_lookups
  when: _instances_need_tags | length > 0

- name: Merge NetBox tags into instances list
  ansible.builtin.set_fact:
    instances: >-
      {%- set out = [] -%}
      {%- set tag_map = {} -%}
      {%- for r in _nb_tag_lookups.results | default([]) -%}
        {%- if r.json is defined and (r.json.count | default(0) | int) > 0 -%}
          {%- set _ = tag_map.update({r.vm_item.name:
              (r.json.results[0].tags | map(attribute='slug') | list)}) -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for v in instances -%}
        {#- Precedence: 1. item.tags  2. instance_tags  3. NetBox tags
            Skip NetBox merge when instance_tags is set so inventory-wide overrides win. -#}
        {%- if v.tags is defined
               or (instance_tags | default([]) | length > 0)
               or v.name not in tag_map -%}
          {%- set _ = out.append(v) -%}
        {%- else -%}
          {%- set _ = out.append(v | combine({'tags': tag_map[v.name]})) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: _instances_need_tags | length > 0

- name: Display enrichment results
  vars:
    _enriched_count: "{{ _instances_enriched | default([]) | selectattr('ipv4', 'defined') | list | length }}"
  ansible.builtin.debug:
    msg: >-
      Enriched {{ _enriched_count }}/{{ _instances_need_ip | length }}
      VMs with IPs from NetBox.
      Total instances: {{ instances | length }}
  when: _instances_need_ip | length > 0
