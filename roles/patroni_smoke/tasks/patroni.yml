---
# Patroni — leader election + cluster state (run-once on the leader).
#   * PAT1: member list (JSON) — used by the summary for split-brain / lag audits
#   * PAT2: REST /health endpoint on :8008

- name: "PAT1. Patroni: member list (JSON)"
  containers.podman.podman_container_exec:
    name: patroni
    command: patronictl -c /etc/patroni/patroni.yml list --format json
  register: _smoke_patronictl_json
  changed_when: false
  failed_when: false
  run_once: true
  when: patroni_smoke_check_patroni | bool

- name: "PAT2. Patroni REST API on :8008/health"
  ansible.builtin.uri:
    url: "http://127.0.0.1:8008/health"
    status_code: 200
    validate_certs: false
  register: _smoke_patroni_rest
  failed_when: false
  run_once: true
  when: patroni_smoke_check_patroni | bool
