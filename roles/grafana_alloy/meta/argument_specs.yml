---
argument_specs:
  main:
    short_description: Deploy Grafana Alloy as a container (logs/metrics/traces)
    description:
      - Runs one Grafana Alloy container per host via docker (compose) or podman (Quadlet), selected by `grafana_alloy_container_engine`.
      - Assembles config.alloy from per-pipeline toggles — logs to Loki, metrics to Prometheus, traces to Tempo. Backend passwords are kept out of config.alloy (written to an
        EnvironmentFile and read with sys.env()).
      - Dispatches on `grafana_alloy_action`; default is provision.
    options:
      debug:
        type: bool
        default: false
        description: Verbose / introspection output. `| bool` filter still applied in tasks because CLI `-e debug=true` arrives as a string.
      grafana_alloy_enabled:
        type: bool
        default: false
        description: Master on/off switch. When false the role is a no-op.
      grafana_alloy_action:
        type: str
        default: provision
        choices: [provision, restart, status, uninstall]
        description: Which sub-flow to run.
      grafana_alloy_container_engine:
        type: str
        default: "{{ _resolved_container_engine }}"
        choices: [docker, podman]
        description: >-
          Authoritative engine selector for this role. Falls back to container_engine, then the instance_platform_preset row's engine, then podman (common's
          _resolved_container_engine).

      grafana_alloy_version:
        type: str
        default: "v1.12.1"
        description: Alloy image tag.
      grafana_alloy_image_registry:
        type: str
        default: docker.io
      grafana_alloy_image_repository:
        type: str
        default: grafana/alloy
      grafana_alloy_image_tag:
        type: str
        default: "{{ grafana_alloy_version }}"
        description: Defaults to grafana_alloy_version.

      grafana_alloy_root_dir:
        type: str
        default: /opt/grafana-alloy
        description: Umbrella dir holding config.alloy, alloy.env, the WAL data dir, and (docker) docker-compose.yml.
      grafana_alloy_data_dir:
        type: str
        default: "{{ grafana_alloy_root_dir }}/data"
      grafana_alloy_config_file:
        type: str
        default: "{{ grafana_alloy_root_dir }}/config.alloy"
      grafana_alloy_env_file:
        type: str
        default: "{{ grafana_alloy_root_dir }}/alloy.env"
        description: Credentials EnvironmentFile (mode 0600). Rendered only when a backend password is set.

      grafana_alloy_mem_limit_mb:
        type: int
        default: 256
        description: Container memory limit (MB). Also passed to preflight as container_mem_request_mb.
      grafana_alloy_network_mode:
        type: str
        default: host
        description: Docker network_mode / Podman networking. host is required for accurate node metrics and host-bound OTLP receivers.

      grafana_alloy_listen_address:
        type: str
        default: "0.0.0.0"
        description: Bind address for the Alloy HTTP server (web UI + /metrics) and the OTLP receivers.
      grafana_alloy_listen_port:
        type: int
        default: 12345
        description: Alloy HTTP server port (web UI at http://host:port).
      grafana_alloy_log_level:
        type: str
        default: info
        choices: [debug, info, warn, error]

      grafana_alloy_cluster_label:
        type: str
        default: ""
        description: Optional `cluster` label stamped on all logs and metrics.
      grafana_alloy_external_labels:
        type: dict
        default: {}
        description: >-
          Extra labels added to every metric (remote_write external_labels) and every log line (loki.write external_labels), e.g. region and zone. Keys must be
          Prometheus label names.

      # ── Logs → Loki ──
      grafana_alloy_logs_enabled:
        type: bool
        default: true
        description: Ship the systemd journal to Loki.
      grafana_alloy_loki_url:
        type: str
        default: ""
        description: Loki push endpoint (.../loki/api/v1/push). Required when grafana_alloy_logs_enabled.
      grafana_alloy_loki_username:
        type: str
        default: ""
        description: Basic-auth username (Grafana Cloud — numeric instance id). Empty = no auth.
      grafana_alloy_loki_password:
        type: str
        default: ""
        no_log: true
        description: Basic-auth password / API token. Written to alloy.env, read via sys.env() — never placed in config.alloy.
      grafana_alloy_loki_tenant_id:
        type: str
        default: ""
        description: X-Scope-OrgID for multi-tenant Loki (optional).
      grafana_alloy_journal_max_age:
        type: str
        default: "12h"
        description: How far back to read the journal on first start.

      # ── Metrics → Prometheus ──
      grafana_alloy_metrics_enabled:
        type: bool
        default: true
        description: Scrape host metrics and remote_write to Prometheus.
      grafana_alloy_prometheus_url:
        type: str
        default: ""
        description: Prometheus remote_write endpoint. Required when grafana_alloy_metrics_enabled.
      grafana_alloy_prometheus_username:
        type: str
        default: ""
      grafana_alloy_prometheus_password:
        type: str
        default: ""
        no_log: true
        description: Written to alloy.env, read via sys.env().
      grafana_alloy_prometheus_tenant_id:
        type: str
        default: ""
        description: X-Scope-OrgID header on the metrics remote_write, for multi-tenant Mimir (optional). Required with grafana_alloy_host_metrics_module_enabled.
      grafana_alloy_scrape_interval:
        type: str
        default: "60s"
        description: Scrape interval of the built-in node scrape and the default for each extra scrape.
      grafana_alloy_node_exporter_enabled:
        type: bool
        default: true
        description: Enable the built-in unix/node exporter (reads bind-mounted /host/proc, /host/sys, /rootfs). Ignored when the host_metrics module is enabled.

      grafana_alloy_host_metrics_module_enabled:
        type: bool
        default: false
        description:
          - Take host metrics from the startechnica/grafana `host_metrics.unix` module (import.git) instead of the built-in unix exporter. Series match Kubernetes
            nodes running the module (job integrations/unix, instance and node = hostname).
          - The module owns the remote_write; the tenant, credentials and grafana_alloy_external_labels are passed to it and the extra scrapes forward into it.
            No cluster_name label is sent unless grafana_alloy_external_labels has one.
          - The container gets the host / at /host/root (ro,rslave) and --pid=host. The host must reach the module repository over HTTPS.
      grafana_alloy_host_metrics_module_repository:
        type: str
        default: "https://github.com/startechnica/grafana.git"
      grafana_alloy_host_metrics_module_revision:
        type: str
        default: main
        description: Branch, tag or commit of the module repository.
      grafana_alloy_host_metrics_module_path:
        type: str
        default: "alloy/modules/host_metrics.alloy"
      grafana_alloy_host_metrics_module_pull_frequency:
        type: str
        default: "1h"

      grafana_alloy_extra_scrapes:
        type: list
        elements: dict
        default: []
        description:
          - Extra Prometheus scrapes of local exporters, sent through the same remote_write. Every scrape sets `instance` to the host name (Alloy's
            constants.hostname), never the scrape address.
          - Entry keys are job (required), targets (required, host:port list), name (component label; default the job with non-[A-Za-z0-9_] as "_", must be
            unique), scheme (http|https), tls_insecure_skip_verify, metrics_path, scrape_interval, metric_drop_regex, and labels (static target labels that
            tell apart several targets sharing a job).
        options:
          job:
            type: str
            required: true
          targets:
            type: list
            elements: str
            required: true
          name:
            type: str
          scheme:
            type: str
            choices: [http, https]
          tls_insecure_skip_verify:
            type: bool
          metrics_path:
            type: str
          scrape_interval:
            type: str
          metric_drop_regex:
            type: str
          labels:
            type: dict
      grafana_alloy_self_metrics_enabled:
        type: bool
        default: false
        description: >-
          Scrape Alloy's own /metrics as job integrations/alloy (instance = host name), so collector-health alerts cover this host. Rendered as one more
          extra scrape of 127.0.0.1:grafana_alloy_listen_port (or grafana_alloy_listen_address when that is a specific address); its component name is
          integrations_alloy.

      # ── Traces → Tempo ──
      grafana_alloy_traces_enabled:
        type: bool
        default: true
        description: Run an OTLP receiver and forward traces to Tempo.
      grafana_alloy_tempo_url:
        type: str
        default: ""
        description: Tempo OTLP endpoint (grpc host:port, or http(s) URL). Required when grafana_alloy_traces_enabled.
      grafana_alloy_tempo_username:
        type: str
        default: ""
      grafana_alloy_tempo_password:
        type: str
        default: ""
        no_log: true
        description: Written to alloy.env, read via sys.env().
      grafana_alloy_tempo_protocol:
        type: str
        default: grpc
        choices: [grpc, http]
        description: OTLP transport to Tempo. grpc → otelcol.exporter.otlp; http → otelcol.exporter.otlphttp.
      grafana_alloy_otlp_grpc_port:
        type: int
        default: 4317
        description: Local OTLP/gRPC receiver port.
      grafana_alloy_otlp_http_port:
        type: int
        default: 4318
        description: Local OTLP/HTTP receiver port.

      # ── Uninstall ──
      grafana_alloy_destroy_data:
        type: bool
        default: false
        description: On uninstall, also delete grafana_alloy_root_dir.
