---
# Render the secrets EnvironmentFile first, then config.alloy. Keeping
# passwords in alloy.env (0600) and referencing them with sys.env() in the
# config means the rendered config.alloy carries no secrets.
#
# Both templates notify `restart grafana_alloy`: docker_compose state=present
# (and podman's daemon-reload) won't bounce the container just because a
# bind-mounted file changed, so the handler is what makes Alloy pick up a
# changed config / credentials on a re-run.

- name: Render Alloy env file (backend credentials)
  ansible.builtin.template:
    src: alloy.env.j2
    dest: "{{ grafana_alloy_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: grafana_alloy_env_has_secrets | bool
  notify: restart grafana_alloy

- name: Remove Alloy env file when no credentials are set
  ansible.builtin.file:
    path: "{{ grafana_alloy_env_file }}"
    state: absent
  when: not (grafana_alloy_env_has_secrets | bool)

- name: Create Alloy secrets directory (host_metrics module password)
  ansible.builtin.file:
    path: "{{ grafana_alloy_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: grafana_alloy_module_password_file_active | bool

- name: Write host_metrics module password file
  ansible.builtin.copy:
    content: "{{ grafana_alloy_prometheus_password }}"
    dest: "{{ grafana_alloy_secrets_dir }}/prometheus_password"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: grafana_alloy_module_password_file_active | bool
  notify: restart grafana_alloy

- name: Remove Alloy secrets directory when the module password file is not used
  ansible.builtin.file:
    path: "{{ grafana_alloy_secrets_dir }}"
    state: absent
  when: not (grafana_alloy_module_password_file_active | bool)

- name: Render config.alloy
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ grafana_alloy_config_file }}"
    owner: root
    group: root
    mode: "0640"
  notify: restart grafana_alloy
