---
# Computed values derived from defaults/main.yml. Lazily evaluated on each
# reference (not user inputs), so they're available the moment the role loads.

# Fully-qualified container image reference.
grafana_alloy_image: "{{ grafana_alloy_image_registry }}/{{ grafana_alloy_image_repository }}:{{ grafana_alloy_image_tag }}"

# True when at least one backend password is set — gates the EnvironmentFile
# wiring (compose env_file / Quadlet EnvironmentFile). Evaluates to the
# string "True"/"False", so always consume with `| bool`.
grafana_alloy_env_has_secrets: >-
  {{ (grafana_alloy_loki_password | default('') | length > 0)
     or (grafana_alloy_prometheus_password | default('') | length > 0)
     or (grafana_alloy_tempo_password | default('') | length > 0) }}

# True when host metrics come from the startechnica/grafana host_metrics
# module: switches config.alloy to the module and adds the /host/root mount and
# --pid=host to the container. String "True"/"False"; consume with `| bool`.
grafana_alloy_host_metrics_module_active: >-
  {{ (grafana_alloy_metrics_enabled | bool)
     and (grafana_alloy_host_metrics_module_enabled | bool) }}

# True when the host_metrics module gets its Prometheus password from a file.
# Alloy shows a module's arguments in its UI and API unless they are
# secret-typed, and sys.env() returns a plain string; local.file with
# is_secret = true does not. String "True"/"False"; consume with `| bool`.
grafana_alloy_module_password_file_active: >-
  {{ (grafana_alloy_host_metrics_module_active | bool)
     and (grafana_alloy_prometheus_password | default('') | length > 0) }}

# Holds that password file (0600, root); mounted at /etc/alloy/secrets.
grafana_alloy_secrets_dir: "{{ grafana_alloy_root_dir }}/secrets"

# Every scrape config.alloy renders besides host metrics: Alloy's own /metrics
# when grafana_alloy_self_metrics_enabled, then grafana_alloy_extra_scrapes.
# Rendered and validated as one list, so a user scrape can't reuse the self
# scrape's component name. Empty by default.
grafana_alloy_scrapes: >-
  {{ ([{'job': 'integrations/alloy',
        'targets': [('127.0.0.1' if grafana_alloy_listen_address in ['0.0.0.0', '::', '']
                     else grafana_alloy_listen_address) ~ ':' ~ grafana_alloy_listen_port]}]
      if grafana_alloy_self_metrics_enabled | bool else [])
     + grafana_alloy_extra_scrapes }}
