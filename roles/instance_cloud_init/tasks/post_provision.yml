---
# Run post-provision commands via VMware Tools

# Loads the instance defaults and vars plus common's _resolved_* values, so
# this phase also works outside the instance role. Runs no tasks.
- name: Import instance role vars
  ansible.builtin.import_role:
    name: instance
    tasks_from: export_vars

- name: "Run post-provision commands on {{ item.name }}"
  community.vmware.vmware_vm_shell:
    hostname: "{{ vcenter_connect.hostname }}"
    username: "{{ vcenter_connect.username }}"
    password: "{{ vcenter_connect.password }}"
    validate_certs: "{{ vcenter_connect.validate_certs }}"
    datacenter: "{{ instance_datacenter }}"
    folder: "/{{ instance_datacenter }}/vm/{{ instance_folder }}"
    vm_id: "{{ item.name }}"
    vm_username: "{{ _resolved_instance_user_name }}"
    vm_password: "{{ instance_user_password | default('') }}"
    vm_shell: /bin/bash
    vm_shell_args: "-c '{{ cmd }}'"
  delegate_to: localhost
  loop: "{{ item.post_commands | default(instance_post_commands | default([])) }}"
  loop_control:
    loop_var: cmd
    label: "{{ cmd }}"
