---
- name: Restart docker
  listen: restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true

- name: Reload sysctl
  listen: reload sysctl
  ansible.builtin.command: sysctl --system

- name: Reload systemd
  listen: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# Container restart dispatch. Both handlers listen to "restart mongodb",
# but only the one matching the current mongodb_container_engine actually
# fires. Same pattern would be needed in patroni's handlers when its
# podman path lands.
#
# On Podman, services are systemd-managed Quadlets — the .container files
# in /etc/containers/systemd/ are converted to .service units by the
# podman-system-generator. Restart goes through systemctl, not `podman
# compose`, so the host's normal service supervision applies.

- name: Restart mongodb (docker)
  listen: restart mongodb
  community.docker.docker_compose_v2:
    project_src: "{{ mongodb_root_dir }}"
    state: present
    recreate: always
  when: mongodb_container_engine == 'docker'

- name: Restart mongodb (podman, systemd-managed)
  listen: restart mongodb
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop: "{{ _mongodb_services | default(['mongodb-mongod.service', 'mongodb-configsvr.service', 'mongodb-mongos.service', 'mongodb-exporter.service']) }}"
  loop_control:
    label: "{{ item }}"
  when: mongodb_container_engine == 'podman'
