---
- name: Restart docker
  listen: restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true

- name: Reload sysctl
  listen: reload sysctl
  ansible.builtin.command: sysctl --system

- name: Reload systemd
  listen: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# No "restart mongodb" handler: handlers run on every host at once, which
# takes each replica set down on all of them together. Restarts go through
# playbooks/mongodb/restart.yml (tasks/rolling_restart.yml), one node at a time.
