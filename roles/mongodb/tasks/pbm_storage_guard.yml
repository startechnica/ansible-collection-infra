---
# `pbm status` can report agent-level storage failures after agents register.
# Keep MongoDB provisioning available, but suppress PBM operations that require
# storage until the target or credentials are fixed and the role is rerun.
- name: Record PBM storage availability
  ansible.builtin.set_fact:
    _pbm_storage_available: >-
      {{ not (
        'FAILED status:' in (_pbm_status.stdout | default('', true))
        or 'FAILED status:' in (_pbm_status.stderr | default('', true))
        or 'ERROR with storage:' in (_pbm_status.stdout | default('', true))
        or 'ERROR with storage:' in (_pbm_status.stderr | default('', true))
        or 'cannot login into s3' in (_pbm_status.stdout | default('', true) | lower)
        or 'cannot login into s3' in (_pbm_status.stderr | default('', true) | lower)
        or 'cannot login to s3' in (_pbm_status.stdout | default('', true) | lower)
        or 'cannot login to s3' in (_pbm_status.stderr | default('', true) | lower)
      ) }}

- name: Warn when PBM agents cannot access configured storage
  ansible.builtin.debug:
    msg: |
      PBM agents registered but cannot access the configured backup storage.
      MongoDB provisioning will continue, but PBM storage initialization and
      the initial backup will be skipped. Resolve the storage endpoint,
      credentials, and bucket policy, then rerun the playbook to initialize PBM
      storage.

        PBM stdout:
        {{ _pbm_status.stdout | default('(no output)', true) | indent(6, true) }}

        PBM stderr:
        {{ _pbm_status.stderr | default('(no output)', true) | indent(6, true) }}

      The storage identity must be allowed to list the PBM prefix and read,
      write, and delete objects beneath:
        {{
          ('gs://' ~ mongodb_backup_gcs_bucket ~ '/' ~ mongodb_backup_gcs_prefix ~ '/pbm/')
          if mongodb_backup_storage_type == 'gcs'
          else ('s3://' ~ s3_bucket ~ '/' ~ mongodb_backup_s3_prefix ~ '/pbm/')
        }}
  when: not (_pbm_storage_available | bool)
