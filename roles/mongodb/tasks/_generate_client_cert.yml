---
# Called with client_cn and client_name variables
# Client certs are the same across all hosts (no per-host SANs)

- name: "Create per-host cert directory for {{ inventory_hostname }}"
  ansible.builtin.file:
    path: "{{ mongodb_local_certs_dir }}/{{ inventory_hostname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: "Generate client private key — {{ 'client=' ~ client_name ~ ', host=' ~ inventory_hostname }}"
  community.crypto.openssl_privatekey:
    path: "{{ mongodb_local_certs_dir }}/{{ inventory_hostname }}/{{ client_name }}.key"
    type: "{{ tls_key_type }}"
    curve: "{{ tls_key_curve if tls_key_type == 'ECC' else omit }}"
    size: "{{ tls_key_size if tls_key_type == 'RSA' else omit }}"
  delegate_to: localhost
  become: false

- name: "Generate client CSR — {{ 'client=' ~ client_name ~ ', host=' ~ inventory_hostname }}"
  community.crypto.openssl_csr:
    path: "{{ mongodb_local_certs_dir }}/{{ inventory_hostname }}/{{ client_name }}.csr"
    privatekey_path: "{{ mongodb_local_certs_dir }}/{{ inventory_hostname }}/{{ client_name }}.key"
    subject:
      O: "{{ mongodb_pki_o }}"
      OU: "{{ mongodb_pki_client_ou }}"
      CN: "{{ client_cn }}"
    key_usage:
      - digitalSignature
    key_usage_critical: true
    extended_key_usage:
      - clientAuth
  delegate_to: localhost
  become: false

- name: "Sign client certificate — {{ 'client=' ~ client_name ~ ', host=' ~ inventory_hostname }}"
  community.crypto.x509_certificate:
    path: "{{ mongodb_local_certs_dir }}/{{ inventory_hostname }}/{{ client_name }}.crt"
    csr_path: "{{ mongodb_local_certs_dir }}/{{ inventory_hostname }}/{{ client_name }}.csr"
    ownca_path: "{{ mongodb_local_certs_dir }}/ca.pem"
    ownca_privatekey_path: "{{ mongodb_local_certs_dir }}/ca.key"
    ownca_not_after: "+{{ ssl_days }}d"
    provider: ownca
  delegate_to: localhost
  become: false

- name: "Create client PEM bundle — {{ 'client=' ~ client_name ~ ', host=' ~ inventory_hostname }}"
  ansible.builtin.shell: >
    cat {{ mongodb_local_certs_dir }}/{{ inventory_hostname }}/{{ client_name }}.key
    {{ mongodb_local_certs_dir }}/{{ inventory_hostname }}/{{ client_name }}.crt
    > {{ mongodb_local_certs_dir }}/{{ inventory_hostname }}/{{ client_name }}.pem
  delegate_to: localhost
  become: false
  changed_when: false

- name: "Clean up client CSR — {{ client_name }}"
  ansible.builtin.file:
    path: "{{ mongodb_local_certs_dir }}/{{ inventory_hostname }}/{{ client_name }}.csr"
    state: absent
  delegate_to: localhost
  become: false
