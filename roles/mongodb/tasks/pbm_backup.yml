---
# On-demand Percona Backup for MongoDB backup — cluster-consistent logical
# snapshot to the configured S3 store. `--wait` blocks until it completes.
# Invoked via `mongodb_action: pbm-backup`, `playbooks/mongodb/pbm-backup.yml`,
# or `mongodb_action: backup` when `mongodb_backup_type: pbm`.

- name: Validate PBM is enabled for PBM backup
  ansible.builtin.assert:
    that:
      - mongodb_pbm_enabled | bool
    fail_msg: >-
      PBM backup requested (mongodb_backup_type=pbm or action=pbm-backup), but
      mongodb_pbm_enabled is false. Set mongodb_pbm_enabled: true in inventory/vars.
  run_once: true

- name: Resolve PBM control container + compression args
  ansible.builtin.set_fact:
    _pbm_compression_args: >-
      --compression={{ mongodb_pbm_compression }}{{ (' --compression-level=' ~ mongodb_pbm_compression_level)
      if mongodb_pbm_compression_level | string | length > 0 else '' }}
  run_once: true

- name: Run PBM backup (waits for completion)
  ansible.builtin.command: >
    {{ mongodb_container_engine }} exec -e PBM_MONGODB_URI={{ _pbm_control_uri }}
    {{ _pbm_control }} pbm backup {{ _pbm_compression_args }} --wait
  register: _pbm_backup
  changed_when: true
  run_once: true

- name: Show PBM backup result
  ansible.builtin.debug:
    msg: "{{ _pbm_backup.stdout_lines | default([]) }}"
  run_once: true
