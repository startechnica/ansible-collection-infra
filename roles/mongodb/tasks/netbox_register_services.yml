---
# Register every mongodb_services entry against every mongodb_nodes
# member in NetBox. The service catalog itself lives in vars/main.yml
# (selected by cluster_type), so this file owns only the per-host
# dispatch into netbox_register's register_services task.

- name: Register MongoDB services in NetBox (per host)
  ansible.builtin.include_role:
    name: netbox_register
    tasks_from: register_services
  vars:
    netbox_vm_name: "{{ _nb_vm }}"
    netbox_vm_services: "{{ mongodb_services }}"
  loop: "{{ groups['mongodb_nodes'] }}"
  loop_control:
    loop_var: _nb_vm
    label: "{{ _nb_vm }}"
  run_once: true
  when:
    - netbox_enabled | default(false) | bool
    - netbox_register_enabled | default(true) | bool
