---
# Transparent huge pages, on or off per mongodb_thp_enabled (see
# defaults/main/mongodb.yml for why it depends on the version and on Patroni).
# mongodb_thp_settings (vars/main/thp.yml) holds the values. They are applied
# now, without restarting mongod, and again at every boot by mongodb-thp.service,
# before any container starts.

# Earlier versions of this role always turned THP off through disable-thp.service,
# and the patroni role writes a unit of the same name. Left in place it would
# race this role's unit at boot. Next to Patroni with THP off, the unit is
# Patroni's and agrees with this role, so it stays; removing it would only have
# Patroni write it back on its next run.
- name: Check for the disable-thp unit
  ansible.builtin.stat:
    path: /etc/systemd/system/disable-thp.service
  register: _mongodb_legacy_thp_unit

- name: Remove the disable-thp unit
  when:
    - _mongodb_legacy_thp_unit.stat.exists
    - (mongodb_thp_enabled | bool) or not (patroni_enabled | default(false) | bool)
  block:
    - name: Disable the disable-thp unit
      ansible.builtin.systemd:
        name: disable-thp
        enabled: false

    - name: Delete the disable-thp unit file
      ansible.builtin.file:
        path: /etc/systemd/system/disable-thp.service
        state: absent

# The THP files list every mode with the active one in brackets, e.g.
# "always defer [defer+madvise] madvise never"; the others hold a plain number.
# A kernel built without THP has none of these files, so skip what's missing.
- name: Apply THP settings now
  ansible.builtin.shell: |
    f='{{ item.key }}'
    [ -f "$f" ] || exit 0
    cur=$(sed -n 's/.*\[\(.*\)\].*/\1/p' "$f")
    [ -n "$cur" ] || cur=$(cat "$f")
    [ "$cur" = '{{ item.value }}' ] && exit 0
    echo '{{ item.value }}' > "$f"
    echo changed
  loop: "{{ mongodb_thp_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  register: _mongodb_thp_apply
  changed_when: "'changed' in _mongodb_thp_apply.stdout"

- name: Deploy the THP unit
  ansible.builtin.template:
    src: mongodb-thp.service.j2
    dest: /etc/systemd/system/mongodb-thp.service
    mode: "0644"

- name: Enable the THP unit
  ansible.builtin.systemd:
    name: mongodb-thp
    enabled: true
    daemon_reload: true
