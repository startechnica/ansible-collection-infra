---
# `Apply sysctl immediately` below runs `sysctl -p` inline against the file
# we just wrote, so the kernel parameters take effect BEFORE the rest of
# the role uses them (ulimits → docker → mongodb compose). No `reload
# sysctl` notify needed — that handler would just run `sysctl --system`
# at the end of the play, which is redundant. `restart mongodb` IS still
# notified because on re-runs the template might change while containers
# are already up — they should be recreated to pick up changes that
# affect connection params (e.g., tcp_keepalive_time).
- name: Configure MongoDB kernel parameters
  ansible.builtin.template:
    src: 99-mongodb-sysctl.conf.j2
    dest: /etc/sysctl.d/99-mongodb.conf
    mode: "0644"
  notify:
    - restart mongodb

- name: Apply sysctl immediately
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-mongodb.conf
  changed_when: false
