---
# ─── Retrofit PBM onto an already-provisioned, running cluster ───────────────
#
# Applies PBM WITHOUT reprovisioning: no mongod/configsvr/mongos container is
# recreated. Generates the agent cert, creates the PBM role+user directly on
# each replica set, then deploys the agents (pbm.yml). Idempotent.
#
#   ansible-playbook playbooks/mongodb_pbm_setup.yml -i inventories/<inv>.yml
#
# Why this can't just be a normal provision re-run: init_cluster.yml's PBM
# user creation is gated behind the one-time bootstrap marker, so it's skipped
# on an already-initialized cluster. And the cluster admin user is cluster-
# level (created via mongos), so it CAN'T createUser directly on a shard's
# mongod — which is what PBM's directConnection agents authenticate against.
#
# We therefore create the shard-local / configsvr-local PBM user by connecting
# DIRECTLY to each node with its MEMBER certificate via MONGODB-X509. The
# member cert maps to the internal __system identity (full privileges), so it
# can createRole/createUser on a running auth-mode replica set. This is the
# same trust domain the cluster already uses for member-to-member auth.
#
# Prerequisite: the CA (ca.key + ca.pem) must be present in
# mongodb_local_certs_dir on the controller (it is, if you run from the same
# controller that built the cluster). Otherwise restore those two files there
# first so the agent cert can be signed.

- name: Assert PBM is enabled
  ansible.builtin.assert:
    that:
      - mongodb_pbm_enabled | bool
    fail_msg: "Set mongodb_pbm_enabled: true (inventory or -e) before running pbm-setup."
  run_once: true

# ── 1. Generate + distribute the pbm-agent client cert ──
- name: Generate PBM agent certificate
  ansible.builtin.include_tasks: _generate_client_cert.yml
  vars:
    client_cn: "{{ mongodb_pbm_cn }}"
    client_name: pbm-agent

- name: Ensure SSL directory on remote hosts
  ansible.builtin.file:
    path: "{{ mongodb_tls_dir }}"
    state: directory
    owner: "{{ mongodb_uid }}"
    group: "{{ mongodb_gid }}"
    mode: "0700"

- name: Distribute PBM agent cert
  ansible.builtin.copy:
    src: "{{ mongodb_local_certs_dir }}/{{ inventory_hostname }}/{{ item }}"
    dest: "{{ mongodb_tls_dir }}/{{ item }}"
    owner: "{{ mongodb_uid }}"
    group: "{{ mongodb_gid }}"
    mode: "{{ '0400' if item.endswith('.key') or item.endswith('.pem') else '0444' }}"
  loop:
    - pbm-agent.key
    - pbm-agent.pem
    - pbm-agent.crt

# ── 2. Create the PBM role + user directly on each replica set ──
# Member-cert X.509 auth → __system, which can createRole/createUser even on
# a running auth-mode cluster.
- name: Create PBM role + x509 user on configsvr replica set
  ansible.builtin.include_tasks: _container_exec.yml
  vars:
    _ce_purpose: "retrofit PBM role + user on configsvr"
    _ce_container: mongodb-configsvr
    _ce_changed_marker: PBM_USER_CREATED
    _ce_retries: 12
    _ce_delay: 5
    _ce_until_rc0: true
    _ce_command: >
      mongosh --port {{ mongodb_configsvr_exec_port }} --tls
      --tlsCertificateKeyFile /etc/mongo/ssl/mongodb-configsvr.pem
      --tlsCAFile /etc/mongo/ssl/ca.pem
      --authenticationMechanism MONGODB-X509
      --authenticationDatabase '$external'
      --quiet --eval "{{ _pbm_create_user_js }}"
  when: mongodb_cluster_type == 'sharded'

- name: Create PBM role + x509 user on shard replica set
  ansible.builtin.include_tasks: _container_exec.yml
  vars:
    _ce_purpose: "retrofit PBM role + user on shard mongod"
    _ce_container: mongodb-mongod
    _ce_changed_marker: PBM_USER_CREATED
    _ce_retries: 12
    _ce_delay: 5
    _ce_until_rc0: true
    _ce_command: >
      mongosh --port {{ mongodb_mongod_exec_port }} --tls
      --tlsCertificateKeyFile /etc/mongo/ssl/mongodb-mongod.pem
      --tlsCAFile /etc/mongo/ssl/ca.pem
      --authenticationMechanism MONGODB-X509
      --authenticationDatabase '$external'
      --quiet --eval "{{ _pbm_create_user_js }}"

# ── 3. Deploy agents + apply config (no mongod/mongos recreation) ──
- name: Deploy PBM agents + apply config
  ansible.builtin.include_tasks: pbm.yml
