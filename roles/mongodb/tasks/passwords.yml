---
# Generate mongodb_admin_password locally on the controller if empty.
# Idempotent — reuses the file if it already exists (password persists
# across runs). Saved as plain text at artifacts/<inv>/mongodb/admin.password
# so humans / other tools can read it too.

- name: Ensure mongodb artifacts directory exists
  ansible.builtin.file:
    path: "{{ hostvars['localhost'].artifacts_dir }}/mongodb"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate mongodb admin password (64-char alphanumeric, no symbols)
  ansible.builtin.set_fact:
    mongodb_admin_password: >-
      {{ mongodb_admin_password if (mongodb_admin_password | length > 0)
         else lookup('password',
                     hostvars['localhost'].artifacts_dir ~ '/mongodb/admin.password'
                     ~ ' length=64 chars=ascii_letters,digits') }}
  run_once: true
  no_log: true
