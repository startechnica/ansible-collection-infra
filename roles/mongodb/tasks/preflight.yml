---
# MongoDB-specific preflight checks.
# Common checks (root, docker, compose, RAM) + target Python venv with pymongo
# are handled by the preflight role dependency.

# A TCMalloc/rseq ABI violation makes mongod refuse to start on a BOUNDED
# range of Linux kernels: 6.19 through 7.0.13 inclusive (and earlier in our
# experience it also segfaulted under the sharded TLS path). Linux 7.0.14+
# resolves it kernel-side, so kernels at/above `mongodb_fixed_kernel` are
# compatible again — the gate is a range, not an open-ended floor.
# Upstream tracking: https://jira.mongodb.org/browse/SERVER-121912
#
# Compatible when: kernel < 6.19  OR  kernel >= 7.0.14.
# Broken when:     6.19 <= kernel < 7.0.14.
#
# Override `mongodb_skip_kernel_check: true` in inventory to bypass.
- name: Assert kernel is compatible with MongoDB
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts['kernel'] is version(mongodb_unsupported_kernel, '<'))
        or (ansible_facts['kernel'] is version(mongodb_fixed_kernel, '>='))
    fail_msg: |
      Kernel {{ ansible_facts['kernel'] }} on {{ inventory_hostname }} is not compatible
      with MongoDB.

      Linux kernels {{ mongodb_unsupported_kernel }} through 7.0.13 have a
      known incompatibility with current MongoDB releases — mongod refuses to
      start (`MongoDB cannot start: Linux kernel versions 6.19 and newer has a
      known incompatibility...`). Linux {{ mongodb_fixed_kernel }} and later
      fixes it kernel-side.
      Tracking: https://jira.mongodb.org/browse/SERVER-121912

      Resolution options:
        1. Upgrade the host to kernel >= {{ mongodb_fixed_kernel }} (the
           incompatibility is resolved kernel-side from 7.0.14 on).
        2. Pin the host OS to a release with kernel < {{ mongodb_unsupported_kernel }}.
           Note the kernel bump can land WITHIN a single FCOS major release:
           e.g. FCOS 43.20260217.3.1 shipped kernel 6.18 (works), FCOS
           43.20260413.3.2 shipped kernel 6.19 (broken). Pinning the FCOS
           major isn't enough — pin the specific stream build via
           `content_library_item_name` in inventory.
        3. Move MongoDB nodes to a different OS (Ubuntu 24.04 ships 6.8).
        4. Bypass with `mongodb_skip_kernel_check: true` (use only after
           verifying mongo runs on your kernel — running with this set on
           an incompatible kernel crashes containers in a tight loop).
    success_msg: "Kernel {{ ansible_facts['kernel'] }} is compatible with MongoDB."
  when: not (mongodb_skip_kernel_check | bool)

- name: Validate cluster type
  ansible.builtin.assert:
    that: mongodb_cluster_type in ['sharded', 'replicaset']
    fail_msg: "mongodb_cluster_type must be 'sharded' or 'replicaset', got '{{ mongodb_cluster_type }}'"
    success_msg: "Cluster type: {{ mongodb_cluster_type }}"

- name: Check admin password is set
  ansible.builtin.assert:
    that: mongodb_admin_password | length > 0
    fail_msg: "mongodb_admin_password must be set (in group_vars or vault)"
    success_msg: "mongodb_admin_password is set."
  tags: [never, init]
