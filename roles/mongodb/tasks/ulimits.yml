---
- name: Configure MongoDB ulimits
  ansible.builtin.template:
    src: 99-mongodb-limits.conf.j2
    dest: /etc/security/limits.d/99-mongodb.conf
    mode: "0644"

- name: Set session ulimit
  ansible.builtin.shell: ulimit -n {{ mongodb_ulimit_nofile }}
  changed_when: false
  failed_when: false
