---
# Render compose with `--transitionToAuth` only on a true cold-start
# (no bootstrap-complete marker). On every subsequent run we render with
# `--auth` directly, so re-deploys are idempotent and don't bounce
# containers into permissive mode.
#
# init_cluster.yml writes the marker after a successful auth-mode start.
# Removing the marker manually forces re-bootstrap on the next run.

- name: Check for bootstrap-complete marker
  ansible.builtin.stat:
    path: "{{ mongodb_root_dir }}/.bootstrap_complete"
  register: _bootstrap_marker

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ mongodb_root_dir }}/docker-compose.yml"
    mode: "0644"
  vars:
    mongodb_bootstrap: "{{ not _bootstrap_marker.stat.exists }}"

# On a running cluster (marker present) this recreates nothing. The deploy runs
# on every host at once, so recreating mongod, configsvr or mongos here would
# take each replica set down on all of them together. Missing containers are
# still created and stopped ones started. A changed definition waits for
# playbooks/mongodb/restart.yml, which applies it one node at a time;
# pending_restarts.yml lists what's waiting at the end of the run.
- name: Start MongoDB containers
  community.docker.docker_compose_v2:
    project_src: "{{ mongodb_root_dir }}"
    state: present
    recreate: "{{ 'never' if _bootstrap_marker.stat.exists else 'auto' }}"

# The exporters serve no clients, so they take a changed definition right away.
# Without their dependencies: the mongos exporter's would bring mongos along.
- name: Apply exporter changes
  community.docker.docker_compose_v2:
    project_src: "{{ mongodb_root_dir }}"
    state: present
    services: "{{ _exporters }}"
    dependencies: false
  vars:
    _exporters: >-
      {{ (['mongodb-exporter'] if mongodb_exporter_enabled | bool else [])
         + (mongodb_exporter_members | map(attribute='name')
            | map('regex_replace', '^', 'mongodb-exporter-') | list) }}
  when:
    - _bootstrap_marker.stat.exists
    - _exporters | length > 0

- name: Wait for containers to be running
  community.docker.docker_container_info:
    name: "{{ item }}"
  loop:
    - mongodb-mongod
    - mongodb-configsvr
    - mongodb-mongos
  register: _container_state
  until: _container_state.container.State.Status == 'running'
  retries: 20
  delay: 3

- name: Restore SELinux contexts (no-op on non-SELinux hosts)
  ansible.builtin.include_tasks: selinux_relabel.yml
