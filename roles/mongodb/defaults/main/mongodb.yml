---
# MongoDB role defaults: cluster identity, version, kernel-compatibility gate,
# network and replica-set names.
# The role loads every file in defaults/main/ (see tasks/export_vars.yml).

# Verbose / introspection output. Namespaced like everything else in this role,
# but defaulting to the collection-wide `debug` so `-e debug=true` still reaches
# it — the same per-role-selector-with-global-fallback shape as
# mongodb_container_engine in main/engine.yml.
#
# This is why the role no longer DEFINES a bare `debug`: it reads whatever
# `debug` the play has in scope, whether that came from the CLI, from inventory,
# or from another role's export_vars the play imported. Defining its own copy
# was the last name mongodb shared with patroni, and a role that declares a
# collection-wide name also gets to overwrite it for everyone else in the play.
#
# Note: nothing in this role reads it yet — the mongodb tasks have no
# debug-gated output today. It is declared so that when they do, the name is
# already the right one.
mongodb_debug: "{{ debug | default(false) }}"

mongodb_enabled: false
mongodb_version: "8.0.28"
mongodb_cluster_type: sharded
mongodb_cluster_name: "MongoDB Cluster"

# Kernel-compatibility gate. MongoDB's vendored tcmalloc has an rseq ABI
# incompatibility with Linux kernels 6.19+; mongod can crash-loop before it
# opens a listener. This affects the 8.0 LTS line too (including 8.0.28), so
# the guard is intentionally independent of `mongodb_version`.
#
# No fixed kernel upper bound is known. Keep hosts below this floor, or use a
# supported OS/kernel combination. Tracking:
# https://jira.mongodb.org/browse/SERVER-121912.
mongodb_unsupported_kernel: "6.19" # kernel broken at/above here (open-ended)
# DEPRECATED / INERT. Retained only so inventories that set the former
# version-based guard do not fail argument validation.
mongodb_kernel_guard_min_version: "8.3"
# DEPRECATED / INERT. An earlier revision treated 7.0.14+ as fixed; retain
# only so inventories that set it do not fail argument validation.
mongodb_fixed_kernel: "7.0.14"
mongodb_skip_kernel_check: false

# Transparent huge pages (THP): the mode for
# /sys/kernel/mm/transparent_hugepage/enabled, never, madvise or always, applied
# now and at every boot by mongodb-thp.service. Empty skips every THP task,
# leaving THP and any unit an earlier run installed as they are.
#
# MongoDB reversed its advice in 8.0: its upgraded TCMalloc wants `always`, with
# defrag=defer+madvise, khugepaged/max_ptes_none=0 and vm.overcommit_memory=1,
# which the role sets alongside any mode but never; 7.0 and earlier want
# `never`. https://www.mongodb.com/docs/manual/administration/tcmalloc-performance/
#
# THP is host-wide. Next to Patroni the default is never: `always` backs any
# 2 MB-aligned region a process touches with a whole 2 MB page, which grows the
# resident memory of every process on a node already split between two stacks
# (kernels before 6.12 can't split underused ones back). `madvise` limits THP to
# memory a process asks for with madvise(2). The patroni role leaves THP alone
# unless patroni_thp_enabled is set, so on a shared node this setting decides;
# set it empty to hand THP to patroni_thp_enabled instead.
mongodb_thp_enabled: >-
  {{ 'always' if mongodb_version is version('8.0', '>=')
                 and not (patroni_enabled | default(false) | bool)
     else 'never' }}

# ── Networking ──
mongodb_network: mongodb-cluster

# ── Replica set names ──
mongodb_shard_replset: rs0
mongodb_config_replset: configReplSet

# ── Rolling restart (mongodb_action: restart) ──
# Which service playbooks/mongodb/restart.yml restarts on each node: all,
# mongod, or on a sharded cluster configsvr or mongos.
mongodb_restart_target: all
