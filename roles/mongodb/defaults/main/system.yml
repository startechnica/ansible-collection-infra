---
# MongoDB role defaults: system user, on-host directories, kernel tuning and
# ulimits.
# The role loads every file in defaults/main/ (see tasks/export_vars.yml).

# ── System user ──
mongodb_uid: 999
mongodb_gid: 999
mongodb_root_dir: /opt/mongodb
mongodb_mongod_data_dir: "{{ mongodb_root_dir }}/data/mongod"
mongodb_configsvr_data_dir: "{{ mongodb_root_dir }}/data/configsvr"
mongodb_tls_dir: "{{ mongodb_root_dir }}/ssl"

# ── Kernel tuning ──
mongodb_sysctl:
  vm.swappiness: 1
  vm.dirty_ratio: 15
  vm.dirty_background_ratio: 5
  net.core.somaxconn: 65535
  net.ipv4.tcp_fin_timeout: 30
  net.ipv4.tcp_keepalive_time: 120

# ── Ulimits ──
mongodb_ulimit_nofile: 64000
