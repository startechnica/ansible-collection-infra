---

debug: false
# ─── MongoDB Cluster Role Defaults ────────────────────────────────────────────

mongodb_enabled: false
mongodb_version: "8.0.28"
mongodb_cluster_type: sharded
mongodb_cluster_name: "MongoDB Cluster"

# Kernel-compatibility gate. MongoDB's vendored tcmalloc has an rseq ABI
# incompatibility with Linux kernels 6.19+; mongod can crash-loop before it
# opens a listener. This affects the 8.0 LTS line too (including 8.0.28), so
# the guard is intentionally independent of `mongodb_version`.
#
# No fixed kernel upper bound is known. Keep hosts below this floor, or use a
# supported OS/kernel combination. Tracking:
# https://jira.mongodb.org/browse/SERVER-121912.
mongodb_unsupported_kernel: "6.19" # kernel broken at/above here (open-ended)
# DEPRECATED / INERT. Retained only so inventories that set the former
# version-based guard do not fail argument validation.
mongodb_kernel_guard_min_version: "8.3"
# DEPRECATED / INERT. An earlier revision treated 7.0.14+ as fixed; retain
# only so inventories that set it do not fail argument validation.
mongodb_fixed_kernel: "7.0.14"
mongodb_skip_kernel_check: false

# ── System user ──
mongodb_uid: 999
mongodb_gid: 999
mongodb_root_dir: /opt/mongodb
mongodb_mongod_data_dir: "{{ mongodb_root_dir }}/data/mongod"
mongodb_configsvr_data_dir: "{{ mongodb_root_dir }}/data/configsvr"
mongodb_tls_dir: "{{ mongodb_root_dir }}/ssl"

# ── Container engine ──
# Per-role selector for the container runtime. Falls back to the global
# `container_engine` (defaults to 'podman' here when neither is set).
# Set this directly to run mongodb on a different engine than patroni
# / other roles on the same host group.
mongodb_container_engine: "{{ container_engine | default('podman') }}"

# ── Container image ──
mongodb_image_registry: docker.io
mongodb_image_repository: mongo
mongodb_image_tag: "{{ mongodb_version }}"

# ── Container resources (MB) ──
mongod_mem_limit_mb: 2048
configsvr_mem_limit_mb: 512
mongos_mem_limit_mb: 512

# ── Networking ──
mongodb_network: mongodb-cluster

# ── Ports ──
mongodb_mongos_node_port: 27017
mongodb_configsvr_node_port: 27018
mongodb_mongod_node_port: 27019

# ── SSL/TLS ──
ssl_days: 365
ssl_ca_days: 3650
# Key algorithm: ECC (ECDSA) by default — MongoDB 4.0+ / drivers all support it.
# Set tls_key_type: RSA with tls_key_size: 4096 to fall back to RSA.
tls_key_type: ECC
tls_key_curve: secp256r1
tls_key_size: 4096

# ── PKI naming (single source for CSR subjects and MONGODB-X509 auth DNs) ──
mongodb_pki_o: MongoDB
mongodb_pki_member_ou: MongoDBCluster
mongodb_pki_client_ou: MongoDBClient
mongodb_pki_ca_cn: MongoDB-CA
mongodb_healthcheck_cn: mongodb-healthcheck
mongodb_exporter_cn: mongodb-exporter

# ── Replica set names ──
mongodb_shard_replset: rs0
mongodb_config_replset: configReplSet

# ── TLS mode ──
# mongod/configsvr: always requireTLS for inter-member security
# mongos: preferTLS so clients can optionally connect without TLS
mongod_tls_mode: requireTLS
configsvr_tls_mode: requireTLS
mongos_tls_mode: preferTLS

# ── Admin user ──
mongodb_admin_user: admin
mongodb_admin_password: "" # Set in group_vars or vault

# ── Healthcheck user (x509 cert auth, no password needed) ──
mongodb_healthcheck_x509_subject: "CN={{ mongodb_healthcheck_cn }},OU={{ mongodb_pki_client_ou }},O={{ mongodb_pki_o }}"

# ── Exporter user (x509 cert auth for mongodb_exporter) ──
mongodb_exporter_x509_subject: "CN={{ mongodb_exporter_cn }},OU={{ mongodb_pki_client_ou }},O={{ mongodb_pki_o }}"

# ── Application databases and users (created after cluster init) ──
# Each entry creates a database and its users with specified roles.
# Passwords can reference vault variables.
#
# mongodb_databases:
#   - name: myapp
#     users:
#       - name: app_user
#         password: "{{ vault_myapp_db_password }}"
#         roles:
#           - { role: readWrite, db: myapp }
#       - name: readonly_user
#         password: "{{ vault_readonly_password }}"
#         roles:
#           - { role: read, db: myapp }
#   - name: analytics
#     users:
#       - name: etl_user
#         password: "{{ vault_etl_password }}"
#         auth_db: admin              # authenticate against admin, not analytics
#         roles:
#           - { role: readWrite, db: analytics }
#           - { role: read, db: myapp }
#
mongodb_databases: []
# ── Backup ──
# Backup engine choice: 'mongodump' runs logical mongodump to local/S3; 'pbm'
# uses Percona Backup for MongoDB (PBM) for cluster-consistent backups + PITR.
# Follows mongodb_backup_pbm_enabled by default, so a cluster without PBM keeps
# its scheduled mongodump backups. 'pbm' without PBM enabled fails preflight.
mongodb_backup_type: "{{ 'pbm' if mongodb_backup_pbm_enabled | bool else 'mongodump' }}"
mongodb_backup_dir: "{{ mongodb_root_dir }}/backups"
mongodb_backup_retain_days: 7
## @param mongodb_backup_pitr_enabled [default: false] Pass --oplog to
## mongodump so the backup captures oplog entries for the dump window, making
## it usable for point-in-time recovery via playbooks/mongodb/pitr.yml. Only
## valid for replica-set deployments dumped from a mongod — mongodump --oplog
## is rejected against a mongos, so leave this false on sharded clusters. Also
## incompatible with per-db/collection backups (full cluster dump only).
mongodb_backup_pitr_enabled: false

# Scheduled backup — host-level systemd timer + oneshot service, same pattern
# as patroni's walg-cron.timer (no crond dependency; FCOS doesn't ship it).
# `mongodb_backup_enabled` is the master switch: false tears down any installed
# timer/service and skips installation. `mongodb_backup_schedule` is a systemd
# OnCalendar expression (see `man systemd.time`); Persistent=true catches up a
# missed run (host offline at the scheduled time) on next boot. On-demand
# `mongodb_action: backup` works regardless of these knobs.
mongodb_backup_enabled: true
mongodb_backup_schedule: "*-*-* 02:00:00"

# Backup destination: 'local' keeps the mongodump on the node only; 's3' also
# tar-gzips it and uploads via containerised mc (the dump is always written
# locally first — s3 mode is local-then-push). Applies to both the on-demand
# `mongodb_action: backup` flow and the scheduled timer. Defaults to 's3' when
# an s3_bucket is configured, else 'local', preserving prior behaviour.
mongodb_backup_mode: "{{ 's3' if (s3_bucket | length > 0) else 'local' }}"

# ── S3 remote backup (optional) ──
# Shared across roles: set these at inventory/group_vars once; mongodb and
# patroni both consume the same s3_* vars. Leaving s3_bucket empty disables
# S3 upload for mongodb.
s3_endpoint: ""
s3_bucket: ""
s3_access_key: ""
s3_secret_key: ""
s3_region: "us-east-1"
# Force path-style S3 addressing (bucket in the path, not the hostname).
# Required by most S3-compatible gateways (Ceph RGW, MinIO, custom). Matches
# patroni's wal-g AWS_S3_FORCE_PATH_STYLE. Consumed by PBM's storage config.
s3_force_path_style: "true"
# S3 key prefix (under s3_bucket) for MongoDB backups — mongodump archives at
# this root, PBM under "<prefix>/pbm". Defaults to a cluster-namespaced path so
# distinct clusters sharing one bucket don't collide. mongodb_cluster_name is a
# display string ("MongoDB Cluster"), so it's slugified (lowercase, spaces →
# dashes) into a key-safe segment, e.g. "mongodb-mongodb-cluster".
mongodb_backup_s3_prefix: "mongodb-{{ mongodb_cluster_name | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('(^-|-$)', '') }}"
# Docker image used to run the S3 client (mc). No host install needed.
s3_client_image: "minio/mc:latest"

# ── Monitoring ──
mongodb_exporter_enabled: true
# Fully-qualified registry path is required for podman / Quadlet on
# FCOS, which ships with short-name-mode=enforcing — `percona/...`
# alone fails with "short-name resolution enforced but cannot prompt
# without a TTY" inside a systemd service. docker is more forgiving
# and auto-resolves bare names to docker.io, but explicit is better
# than implicit.
mongodb_exporter_image: "docker.io/percona/mongodb_exporter:0.52.0"
mongodb_exporter_port: 9216

# ── Percona Backup for MongoDB (PBM) ──
# Cluster-consistent backups + point-in-time recovery for SHARDED clusters
# (where mongodump --oplog can't run via mongos). One pbm-agent runs next to
# every data-bearing mongod: in sharded mode that's two agents per host (the
# shard mongod + the configsvr); in replicaset mode it's one (the mongod).
# Agents authenticate via X.509 client cert (CN=mongodb_backup_pbm_cn) and store
# backups in object storage. PBM's MinIO client is the default for S3-compatible
# services; the AWS SDK-backed S3 client and native GCS client remain selectable.
#
# NOTE: on the Community `mongo` image PBM does LOGICAL backups + logical PITR
# only — physical backups need Percona Server for MongoDB. See
# docs/design/mongodb-pbm.md.
mongodb_backup_pbm_enabled: false
# Pin the agent image (avoid :latest for reproducible/offline-friendly pulls).
mongodb_backup_pbm_image: "docker.io/percona/percona-backup-mongodb:2.15.0"
mongodb_backup_pbm_cn: mongodb-pbm
mongodb_backup_pbm_mem_limit_mb: 256
# PBM object-storage client. `minio` is the safer default for MinIO/Ceph/custom
# gateways and proxies because it avoids the AWS SDK Go v2 signing
# `Accept-Encoding` (a header some proxies rewrite, causing
# SignatureDoesNotMatch). Set `s3` for Amazon S3 or endpoints requiring PBM's
# AWS SDK backend, or `gcs` for native Google Cloud Storage JSON API access.
mongodb_backup_storage_type: minio
# Native GCS settings (used only when mongodb_backup_storage_type is `gcs`).
# PBM 2.12+ deprecates GCS HMAC credentials, so the role authenticates with a
# service-account key: the whole JSON key file GCP produces at "Create key →
# JSON", as the raw JSON string or an already-parsed mapping. The role passes
# its client_email and private_key to PBM. KEEP THIS IN ANSIBLE VAULT — it is a
# private key.
mongodb_backup_gcs_bucket: ""
mongodb_backup_gcs_service_account: ""
# PBM data is stored under "<prefix>/pbm", matching the S3 layout.
mongodb_backup_gcs_prefix: "mongodb-{{ mongodb_cluster_name | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('(^-|-$)', '') }}"
# PBM continuous oplog slicing (restore to any timestamp in the window) is
# gated on the shared mongodb_backup_pitr_enabled knob — the same switch that
# enables mongodump --oplog for replica-set backups. One PITR intent, one knob.
# On provision/setup, force a storage resync (clears "storage is not
# initialized") and lay down a base backup if none exists yet — PBM needs one
# before PITR can start slicing. Idempotent: skipped when a backup already
# exists. Set false to manage the first backup yourself.
mongodb_backup_init: true
# Backup compression type: none|gzip|snappy|lz4|s2|zstd.
mongodb_backup_compression_type: zstd
# Optional compression level (codec-specific, e.g. zstd 1–22, gzip 1–9). Empty
# uses the codec's default. Applies to both base backups and PITR oplog slices.
mongodb_backup_compression_level: 3
# Scheduled `pbm backup` reuses the shared backup knobs rather than PBM-specific
# ones: the timer fires on `mongodb_backup_schedule` (empty disables it) and a
# post-backup `pbm cleanup` prunes base backups + their oplog chunks older than
# `mongodb_backup_retain_days`. One schedule + one retention window for both the
# mongodump path and PBM. Enabling PITR (mongodb_backup_pitr_enabled) without a
# schedule leaves you a single base-backup anchor that never rotates — set a
# schedule so the PITR window keeps a fresh floor and the bucket doesn't grow
# unbounded.
# X.509 subject the PBM agent presents (mapped to a $external user with the
# PBM role set). Mirrors mongodb_healthcheck_x509_subject / _exporter_.
mongodb_backup_pbm_x509_subject: "CN={{ mongodb_backup_pbm_cn }},OU={{ mongodb_pki_client_ou }},O={{ mongodb_pki_o }}"

# ── Kernel tuning ──
mongodb_sysctl:
  vm.swappiness: 1
  vm.dirty_ratio: 15
  vm.dirty_background_ratio: 5
  net.core.somaxconn: 65535
  net.ipv4.tcp_fin_timeout: 30
  net.ipv4.tcp_keepalive_time: 120

# ── Ulimits ──
mongodb_ulimit_nofile: 64000

# ── Local artifacts (on the Ansible controller) ──
# Single bridge from the play-level `artifacts_dir` (set on localhost by
# playbooks/mongodb/_setup.yml — add_host nodes have inventory_file == None,
# so we can only stash it there). All in-role paths derive from
# `mongodb_artifacts_dir` so a consumer can override one var to relocate
# every mongodb artifact (creds, certs, etc.).
mongodb_artifacts_dir: "{{ hostvars['localhost'].artifacts_dir }}/mongodb"
mongodb_local_certs_dir: "{{ mongodb_artifacts_dir }}/certs"

# ── Uninstall safety ──
mongodb_destroy_prune: false
