---
# Inject ignition config via guestinfo

- name: "Inject ignition config via guestinfo for {{ item.name }}"
  community.vmware.vmware_guest:
    hostname: "{{ vcenter_connect.hostname }}"
    username: "{{ vcenter_connect.username }}"
    password: "{{ vcenter_connect.password }}"
    validate_certs: "{{ vcenter_connect.validate_certs }}"
    datacenter: "{{ instance_datacenter }}"
    folder: "/{{ instance_datacenter }}/vm/{{ instance_folder }}"
    name: "{{ item.name }}"
    advanced_settings:
      - key: "guestinfo.ignition.config.data"
        value: "{{ lookup('file', ignition_tmp_dir + '/' + item.name + '.ign') | b64encode }}"
      - key: "guestinfo.ignition.config.data.encoding"
        value: "base64"
  delegate_to: localhost

- name: "Record ignition inject status for {{ item.name }}"
  ansible.builtin.set_fact:
    ignition_status: >-
      {{ ignition_status | default({}) | combine({
        item.name: (ignition_status | default({}))[item.name] | default({})
                   | combine({'injected': true})
      }) }}
