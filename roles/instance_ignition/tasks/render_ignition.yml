---
# Render Butane configs and convert to Ignition JSON for each VM.
# Only runs when: instance_init_type == 'ignition'
# Runs `_butane_bin`, published by resolve_butane.yml, which
# instance/tasks/main.yml runs before fcos_prepare.

# Loads the instance defaults and vars plus common's _resolved_* values, so
# this phase also works outside the instance role. Runs no tasks.
- name: Import instance role vars
  ansible.builtin.import_role:
    name: instance
    tasks_from: export_vars

- name: Render Butane config for each VM
  ansible.builtin.template:
    src: "{{ _platform_preset.ignition.butane_template }}"
    dest: "{{ ignition_tmp_dir }}/{{ instance.name }}.bu"
    mode: "0600"
  loop: "{{ instances_to_create }}"
  loop_control:
    loop_var: instance
    label: "{{ instance.name }}"
  delegate_to: localhost

- name: Convert Butane to Ignition JSON
  ansible.builtin.command: >
    {{ _butane_bin | quote }}
    {{ '--strict' if (ignition_butane_strict | bool) else '' }}
    {{ ignition_tmp_dir }}/{{ instance.name }}.bu
    --output {{ ignition_tmp_dir }}/{{ instance.name }}.ign
  loop: "{{ instances_to_create }}"
  loop_control:
    loop_var: instance
    label: "{{ instance.name }}"
  delegate_to: localhost
  changed_when: true

- name: Record ignition render paths per VM
  ansible.builtin.set_fact:
    ignition_status: >-
      {{ ignition_status | default({}) | combine({
        instance.name: (ignition_status | default({}))[instance.name] | default({})
                 | combine({
                   'butane_rendered': (ignition_tmp_dir ~ '/' ~ instance.name ~ '.bu'),
                   'ignition_file': (ignition_tmp_dir ~ '/' ~ instance.name ~ '.ign')
                 })
      }) }}
  loop: "{{ instances_to_create }}"
  loop_control:
    loop_var: instance
    label: "{{ instance.name }}"
