---
# Ignition (FCOS) phases for instance. Callers include specific phases via
# `tasks_from:` from instance's main.yml or configure_all.yml.
#
# Phases (invocation context):
#   fcos_prepare.yml — once (localhost): fetch FCOS metadata, import OVA to content library
#   render_ignition.yml — once (localhost): Butane -> Ignition JSON for all VMs
#   inject.yml       — per-VM loop: write guestinfo.ignition.config.data
#   poweron.yml      — per-VM loop: power on
#   cleanup.yml      — per-VM loop: clear guestinfo after successful boot

- name: "Instance_ignition has no default entrypoint"
  ansible.builtin.fail:
    msg: >-
      Do not invoke instance_ignition via `roles:` directly.
      Use `include_role: name: instance_ignition tasks_from: <phase>.yml`.
