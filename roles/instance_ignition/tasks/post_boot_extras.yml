---
# Post-boot Ansible actions for Ignition-based VMs (FCOS / RHCOS / Flatcar /
# openSUSE MicroOS). Dispatched from instance/tasks/configure_all.yml via:
#   include_role: name=instance_{{ instance_init_type|replace('-','_') }}
#                 tasks_from=post_boot_extras.yml
#
# IMPORTANT: this task runs in the instance role's play context, which
# delegates to localhost (vCenter API). Every step that needs to touch the
# VM's filesystem MUST use vmware_vm_shell / vmware_guest_file_operation,
# NOT ansible.builtin.stat / command — those would run on the controller.

# ── open-vm-tools /etc payload recovery ─────────────────────────────────────
# When open-vm-tools is layered via rpm-ostree --apply-live (our Butane
# rpm-ostree-install-open-vm-tools.service), the package's %post scriptlet
# that copies the /etc payload from /usr/etc/vmware-tools/ into
# /etc/vmware-tools/ is skipped. vgauthd then fails to start (status=255)
# because vgauth.conf and the SAML XSD schemas it needs are absent.
#
# As of 2026-05-26, the Butane install service ALSO performs this cp + reset
# at first boot — so for new VMs, /etc/vmware-tools/ is already populated by
# the time this task runs and the cp is a no-op (cp -an preserves existing).
# This task remains as a safety net for older VMs (provisioned before the
# Butane fix) or any future drift, and also resets vgauthd in case it's
# wedged in failed state from a prior boot attempt.
#
# YAML INDENTATION: every line of vm_shell_args at the same indent as `-c "`
# so the folded scalar collapses to a single bash command. See ssh_config.yml
# for the why — `||` at the start of a folded-into-newline is a bash exit 2.
- name: "Materialize open-vm-tools /etc payload + reset vgauthd on {{ item.name }}"
  community.vmware.vmware_vm_shell:
    hostname: "{{ vcenter_connect.hostname }}"
    username: "{{ vcenter_connect.username }}"
    password: "{{ vcenter_connect.password }}"
    validate_certs: "{{ vcenter_connect.validate_certs }}"
    datacenter: "{{ instance_datacenter }}"
    folder: "{{ instance_folder_path }}"
    vm_id: "{{ item.name }}"
    vm_username: "{{ instance_user_name }}"
    vm_password: "{{ instance_user_password }}"
    vm_shell: /bin/bash
    vm_shell_args: >-
      -c "if [ -d /usr/etc/vmware-tools ]; then
      sudo cp -anr /usr/etc/vmware-tools/. /etc/vmware-tools/ 2>&1 || true;
      sudo restorecon -RF /etc/vmware-tools/ 2>&1 || true;
      sudo systemctl reset-failed vgauthd.service 2>&1 || true;
      sudo systemctl restart vgauthd.service 2>&1 || true;
      fi;
      exit 0"
    wait_for_process: true
  delegate_to: localhost
