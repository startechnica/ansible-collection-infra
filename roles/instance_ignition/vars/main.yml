---
# Per-flavor Ignition defaults — vendor-fact lookup table tied to each
# distro's release process (Butane spec version, default channel, OS user
# convention). Lives in vars/ (precedence ~18) instead of defaults/ so
# inventories can't accidentally override an entry to a value the upstream
# vendor doesn't ship.
#
# Consumed by this sub-role's templates/tasks AND by the `ignition:` dict
# in the parent instance role's defaults (lazy-evaluated Jinja).
#
# Selector: parent role's `ignition_flavour` var (default: fcos). See
# roles/instance/defaults/main.yml for the top-level toggles.
#
# Fields per flavor:
#   butane_variant       — Butane header `variant:` value
#   butane_spec_version  — Butane header `version:` value
#   butane_template      — filename of the Jinja Butane template under
#                          this sub-role's templates/ directory
#   template_prefix      — suggested content-library prefix
#   instance_user_name   — canonical OS user for the distro
#   default_channel      — default release channel
#   channels             — list of known channels (reference / validation)
#   metadata_url         — stream/version endpoint; `{channel}` substituted
#   ova_url              — direct OVA URL (Flatcar-style); empty when
#                          distribution is gated (RHCOS) or has no JSON API

ignition_flavour_map:
  fcos:
    butane_variant: fcos
    butane_spec_version: "1.5.0"
    butane_template: fcos.bu.j2
    template_prefix: fedora-coreos
    instance_user_name: core
    default_channel: stable
    channels: [stable, testing, next]
    metadata_url: "https://builds.coreos.fedoraproject.org/streams/{channel}.json"
    ova_url: "" # derived from stream metadata at runtime

  flatcar:
    butane_variant: flatcar
    butane_spec_version: "1.1.0"
    butane_template: flatcar.bu.j2
    template_prefix: flatcar-production-vmware
    instance_user_name: core
    default_channel: stable
    channels: [stable, beta, alpha, lts]
    metadata_url: "https://{channel}.release.flatcar-linux.net/amd64-usr/current/version.txt"
    ova_url: "https://{channel}.release.flatcar-linux.net/amd64-usr/current/flatcar_production_vmware_ova.ova"

  rhcos:
    butane_variant: openshift
    butane_spec_version: "4.21.0"
    butane_template: rhcos.bu.j2
    template_prefix: rhcos
    instance_user_name: core
    default_channel: "4.16" # tracks OpenShift minor version
    channels: [] # Red Hat customer portal; not a public list
    metadata_url: "" # gated — manual OVA download + import
    ova_url: ""

  opensuse:
    butane_variant: opensuse
    butane_spec_version: "1.0.0"
    butane_template: opensuse.bu.j2
    template_prefix: "openSUSE-MicroOS"
    instance_user_name: root
    default_channel: tumbleweed
    channels: [tumbleweed]
    metadata_url: "" # no JSON stream API; manual import
    ova_url: ""
