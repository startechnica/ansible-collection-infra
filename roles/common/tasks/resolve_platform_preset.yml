---
# Publish the slug-resolved fallback values as host facts on the current
# host. Idempotent — re-running just overwrites with the same values.
#
# Invoke from any role that needs `instance_init_type`,
# `instance_user_name`, `container_engine`, or `content_library_*`
# resolved through `instance_platform_preset` against `_platform_map`.
#
# After this runs, consumers read the bare public-var names; the host
# fact (precedence #18) wins over role defaults/inventory and carries
# the resolved value. The `_resolved_*` derivations themselves respect
# any inventory override (inventory non-empty > _platform_map lookup
# > hardcoded final fallback) — see common/vars/main.yml.
#
# Usage (from another role's tasks/main.yml):
#   - name: Resolve platform-preset fallbacks
#     ansible.builtin.include_role:
#       name: common
#       tasks_from: resolve_platform_preset
#
# Or inside common itself (e.g. validate_inventory, build_host_groups):
#   - ansible.builtin.include_tasks: resolve_platform_preset.yml

# Capture whether the inventory EXPLICITLY pinned a content library item
# BEFORE the next line overwrites `content_library_item_name` with the
# preset fallback. This is the signal `fcos_prepare`'s auto-import gate
# needs: "did the user pin a specific OVA, or should we auto-import the
# latest?". It must be computed here (not at gate time) because:
#   1. This resolver runs at Stage 0 (validate_inventory) — the FIRST time,
#      `content_library_item_name` still holds the raw inventory value ('' if
#      unset). After we publish the fallback below, the bare var reads the
#      preset default, so a length check downstream can no longer tell pin
#      from fallback.
#   2. The published fact is precedence #18 (host fact) and persists across
#      plays, so by the instance role's Stage 2 the original signal is gone.
# Sticky-by-self-reference: once set on the first resolver call, later calls
# preserve it (the preset-filled value must not flip pinned false→true).
- name: Capture explicit content-library-item pin (before fallback overwrites it)
  ansible.builtin.set_fact:
    _content_library_item_pinned: >-
      {{ _content_library_item_pinned
         if (_content_library_item_pinned is defined)
         else (content_library_item_name | default('') | length > 0) }}

- name: Publish platform-preset resolved values as host facts
  ansible.builtin.set_fact:
    instance_init_type: "{{ _resolved_instance_init_type }}"
    instance_user_name: "{{ _resolved_instance_user_name }}"
    container_engine: "{{ _resolved_container_engine }}"
    content_library_name: "{{ _resolved_content_library_name }}"
    content_library_item_name: "{{ _resolved_content_library_item_name }}"
    ignition_channel: "{{ _resolved_ignition_channel }}"
    _content_library_item_pinned: "{{ _content_library_item_pinned }}"
    # Also publish the raw `_platform_map` and the matched-row helper
    # `_platform_preset` so consumers (Butane templates, render_ignition,
    # downstream roles) can read `_platform_preset.ignition.<field>` directly
    # after `include_role: name=common` returns and common's role vars
    # leave scope. Host facts (precedence #18) persist for the play.
    _platform_map: "{{ _platform_map }}"
    _platform_preset: "{{ _platform_preset }}"
