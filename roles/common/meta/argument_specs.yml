---
argument_specs:
  main:
    short_description: No-op entrypoint — use tasks_from to invoke a utility.
    description:
      - This role is a bag of reusable task files. Invoke via include_role with tasks_from.
      - Calling without tasks_from fails with a message listing available utilities.

  wait_for_ssh:
    short_description: Controller-side SSH port probe for all hosts in a group.
    description:
      - Runs ansible.builtin.wait_for (from localhost) against each host in
        the named group, using hostvars[item].ansible_host / ansible_port.
      - Only a port-level check — auth issues surface on the first real task.
    options:
      debug:
        type: bool
        default: false
        description: Verbose / introspection output. Defensive `| bool` filter still used in tasks because CLI `-e debug=true` arrives as a string.
      ssh_wait_group:
        type: str
        default: cluster_nodes
        description: Inventory group to probe.
      ssh_wait_timeout:
        type: int
        default: 60
        description: Seconds to wait per host's SSH port.

  inherit_localhost_vars:
    short_description: Copy non-ansible vars from localhost to the current host.
    description:
      - Exports hostvars['localhost'] (minus Ansible magic variables) to a
        temp YAML file and loads it via include_vars on the target.
      - Lets downstream service plays see vars that were built up in the
        localhost pre-play (e.g. artifacts_dir, computed facts, vault-decoded values).

  build_host_groups:
    short_description: Build dynamic host groups from the `instances` list via add_host.
    description:
      - Bridges VM provisioning output → Ansible inventory for subsequent plays.
      - Connection params (user, key, port) are derived from default_user and
        instance_ssh_configs, so a custom SSH port applied by instance is honored.
    options:
      target_groups:
        type: list
        elements: str
        default: [cluster_nodes]
        description: Groups to add every VM to (ignored when use_tags is true).
      use_tags:
        type: bool
        default: false
        description: >-
          When true, route VMs to mongodb_nodes / patroni_nodes based on their
          tags, in addition to the always-present cluster_nodes group.

  validate_inventory:
    short_description: Inventory preconditions validator — asserts before deploy.
    description:
      - Read-only assertions catching concrete misconfigurations (S3 all-or-nothing,
        patroni_scope unset, vip_manager without patroni_vip_address, malformed databases shape,
        unscoped NetBox enrichment, etc.).
      - No side effects; safe to run any time. Invoked as Stage 0 of deploy.yml
        (runs on every invocation via the `always` tag; `--tags validate`
        runs only this stage).
