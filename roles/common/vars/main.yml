---
# Static reference data shared across roles. `vars/` precedence (~18) is
# higher than any inventory layer, so users can't accidentally override
# these — appropriate for vendor-fixed platform facts and derived
# resolution helpers.
#
# Lives in `common` (not `instance`) because the OS slug fallback applies
# to `common.build_host_groups` (ansible_user / instance_init_type on
# dynamic hosts) and `common.validate_inventory` too — both run before
# the `instance` role loads its own vars/.

# OS identity reference table — single source of truth that links the
# ways this collection identifies a guest OS:
#
#   key                       NetBox platform slug (per-deployment string)
#   .os_family                ansible_facts.os_family
#   .distribution             ansible_facts.distribution
#   .vsphere_guest_id         vSphere `guestId` from GuestInfo (vendor-fixed)
#   .username                 default OS user for the cloud image / OVA
#   .init_type                guest init mechanism: cloud-init | ignition | none
#   .container_engine         default container runtime for the family
#                             (Debian/Suse → docker, RedHat → podman,
#                             Windows/FreeBSD/RouterOS → "" / N/A)
#   .content_library_name     vSphere content library; empty = site-specific,
#                             override via instance_netbox_platform_map merge
#   .content_library_item_name canonical template name (defaults to slug);
#                             override per-site via the same merge
#   .ignition                 per-flavour Butane / OVA metadata, only
#                             populated for init_type=ignition rows
#                             (fedora-coreos, flatcar, rhel-coreos,
#                             opensuse-microos). Sub-keys:
#                               butane_variant, butane_spec_version,
#                               butane_template, template_prefix,
#                               default_channel, channels, metadata_url,
#                               ova_url
#                             Selected by `instance_platform_preset`.
#
# Keyed by NetBox slug because that's the user-facing identifier; the rest
# are vendor-fixed facts. Slugs vary per NetBox deployment — override via
# `instance_netbox_platform_map` in inventory (consumer merges on top).
#
# vSphere guest_id reference:
#   https://vdc-download.vmware.com/vmwb-repository/dcr-public/.../vim.vm.GuestOsDescriptor.html
# NOTE on slug aliases: multiple NetBox slug conventions share one vSphere
# guest_id (e.g. every Ubuntu LTS → ubuntu64Guest; debian-12 and
# debian-gnulinux-12-64-bit → debian12_64Guest). All variants must resolve
# forward to the same metadata, but the inverse map (guest_id → slug) needs
# a single canonical answer. We rely on dict-insertion order: Jinja's
# `dict(zip(guest_ids, slugs))` keeps the LAST insertion per guest_id, so
# the canonical slug must be listed last in each group below.
_platform_map:
  # ── Debian family
  # Ubuntu — all LTS variants share ubuntu64Guest; canonical (ubuntu-24-04-lts) last.
  ubuntu-linux-64-bit:
    os_family: Debian
    distribution: Ubuntu
    vsphere_guest_id: ubuntu64Guest
    username: ubuntu
    init_type: cloud-init
    container_engine: docker
    content_library_name: ubuntu-images
    content_library_item_name: ubuntu-linux-64-bit
  ubuntu-16-04-lts:
    os_family: Debian
    distribution: Ubuntu
    vsphere_guest_id: ubuntu64Guest
    username: ubuntu
    init_type: cloud-init
    container_engine: docker
    content_library_name: ubuntu-images
    content_library_item_name: ubuntu-16-04-lts
  ubuntu-20-04-lts:
    os_family: Debian
    distribution: Ubuntu
    vsphere_guest_id: ubuntu64Guest
    username: ubuntu
    init_type: cloud-init
    container_engine: docker
    content_library_name: ubuntu-images
    content_library_item_name: ubuntu-20-04-lts
  ubuntu-22-04-lts:
