    distribution: Ubuntu
    vsphere_guest_id: ubuntu64Guest
    username: ubuntu
    init_type: cloud-init
    container_engine: docker
    content_library_name: ubuntu-images
    content_library_item_name: ubuntu-22-04-lts
  ubuntu-24-04-lts:
