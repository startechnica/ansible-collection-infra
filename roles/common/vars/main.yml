  # ── CoreOS-family (Ignition-based; all share coreos64Guest)
  # Listed before fedora-coreos so fedora-coreos wins the inverse
  # `_vsphere_guest_id_platform_map` lookup as the canonical slug.
  flatcar:
    os_family: Flatcar
    distribution: Flatcar
    vsphere_guest_id: coreos64Guest
    username: core
    init_type: ignition
    container_engine: docker
    content_library_name: flatcar-images
