dependencies: []
# `preflight` was previously a hard dependency, which made it run on EVERY
# action including uninstall / status / health (wasted ~30s of system
# checks before tearing things down). Now invoked explicitly from
# tasks/main.yml gated on `patroni_action`, so it only fires when the
# action actually needs the system to be ready (provision, backup,
# manage-databases — not uninstall/status/health/switchover).
