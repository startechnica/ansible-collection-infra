---
# vip-manager — podman path. Pull the prebuilt image, then render the Quadlet.
# Caller (podman/deploy.yml) gates on `patroni_vip_enabled and use_vip_manager`.

# Retried like the other image pulls (see podman/preflight.yml).
- name: Pull vip-manager image (etcd-aware VIP, podman)
  containers.podman.podman_image:
    name: "{{ patroni_vip_manager_image }}"
    pull: true
  register: _image_pull
  retries: 10
  delay: 20
  until: _image_pull is succeeded

- name: Render vip-manager Quadlet
  ansible.builtin.template:
    src: quadlets/vip-manager.container.j2
    dest: /etc/containers/systemd/vip-manager.container
    owner: root
    group: root
    mode: "0644"
  register: _q_vip_manager
