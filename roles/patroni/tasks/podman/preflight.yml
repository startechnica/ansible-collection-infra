---
# Patroni preflight — podman engine. VIP config validation + image pulls
# via containers.podman.podman_image. Common system-level checks (root,
# podman, RAM) are handled by the preflight role dependency called
# from main.yml.

- name: Validate VIP configuration (when VIP is enabled)
  ansible.builtin.assert:
    that:
      - patroni_vip_mask | string | length > 0
      - patroni_vip_engine in ['vip-manager', 'keepalived']
    fail_msg: >-
      patroni_vip_address='{{ patroni_vip_address }}' is set but patroni_vip_mask is empty or
      patroni_vip_engine='{{ patroni_vip_engine }}' is not
      'vip-manager' / 'keepalived'. Set patroni_vip_mask (e.g. 24) and a valid
      patroni_vip_engine, or unset 'patroni_vip_address' to disable the floating-IP service.
    success_msg: "VIP {{ patroni_vip_address }}/{{ patroni_vip_mask }} configured for {{ patroni_vip_engine }}."
  when: patroni_vip_address | length > 0
  run_once: true

# Retried: multi-hundred-MB pulls occasionally die mid-blob on transient
# transport errors ("tls: bad record MAC", "connection reset by peer").
# Already-copied layers are reused, so a retry only fetches what's left.
- name: Pull required images
  containers.podman.podman_image:
    name: "{{ item }}"
    pull: true
  loop:
    - "{{ patroni_image }}"
    - "{{ patroni_etcd_image }}"
    - "{{ patroni_haproxy_image }}"
    - "{{ patroni_pgbouncer_image }}"
  loop_control:
    label: "{{ item }}"
  register: _image_pull
  retries: 10
  delay: 20
  until: _image_pull is succeeded

- name: Pull postgres-exporter image (when enabled)
  containers.podman.podman_image:
    name: "{{ patroni_postgres_exporter_image }}"
    pull: true
  register: _image_pull
  retries: 10
  delay: 20
  until: _image_pull is succeeded
  when: patroni_postgres_exporter_enabled | bool
