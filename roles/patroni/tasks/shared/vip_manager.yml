---
# vip-manager (etcd-aware VIP failover, default).
# Included only when `patroni_vip_enabled and use_vip_manager` — caller is
# responsible for the gate.

- name: Deploy vip-manager.yml
  ansible.builtin.template:
    src: vip-manager.yml.j2
    dest: "{{ patroni_vip_manager_dir }}/vip-manager.yml"
    mode: "0644"
  notify: restart vip-manager

# Earlier versions built the image on the node from this Dockerfile; the image
# is pulled now.
- name: Remove the old vip-manager Dockerfile
  ansible.builtin.file:
    path: "{{ patroni_vip_manager_dir }}/Dockerfile"
    state: absent
