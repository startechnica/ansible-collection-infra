---
# os_tuning.yml - Linux kernel and sysctl tuning for PostgreSQL / Patroni
#
# Variables used:
#   patroni_postgresql_dir              – PostgreSQL data directory (used for I/O scheduler detection)
#   patroni_thp_enabled                 – transparent huge pages mode; empty leaves THP alone
#   ansible_facts['memtotal_mb'] – auto-gathered Ansible fact (total RAM in MiB)

# ##############################################################################
# 1. Compute derived values
# ##############################################################################
- name: Gather page size
  ansible.builtin.command: getconf PAGE_SIZE
  register: _page_size_raw
  changed_when: false

- name: Set sysctl calculation facts
  ansible.builtin.set_fact:
    _page_size: "{{ _page_size_raw.stdout | int }}"
    _shmmax: "{{ ((ansible_facts['memtotal_mb'] | int) * 1048576 * 0.75) | int }}"

- name: Derive shmall from shmmax and page size
  ansible.builtin.set_fact:
    _shmall: "{{ (_shmmax | int / _page_size | int) | int }}"

###############################################################################
# 2. Detect whether swap is present
###############################################################################
- name: Check if swap is enabled
  ansible.builtin.command: swapon --show --noheadings
  register: _swap_check
  changed_when: false
  failed_when: false

- name: Set swap_present fact
  ansible.builtin.set_fact:
    _swap_present: "{{ _swap_check.stdout | length > 0 }}"

###############################################################################
# 3. Build the full sysctl parameter dict
###############################################################################
# The ephemeral (source) port range stays at the kernel default, 32768-60999.
# Earlier versions widened it to 1024-65535, which put every service port on
# the host inside it, including ports of other stacks this role knows nothing
# about (a co-located MongoDB's 27017-27019): any outbound connection could
# take one as its source port, and the daemon behind it then couldn't bind on
# restart ("Address already in use").
#
# Every default port of this stack is below 32768, so reserving them only
# matters for a port moved into the range. ip_local_reserved_ports is one
# host-wide list, so this replaces any reservation made elsewhere.
- name: Define base sysctl parameters
  ansible.builtin.set_fact:
    _sysctl_params: >-
      {{
        {
          'vm.swappiness': '1',
          'vm.dirty_ratio': '10',
          'vm.dirty_background_ratio': '3',
          'kernel.shmmax': _shmmax | string,
          'kernel.shmall': _shmall | string,
          'net.core.somaxconn': '65535',
          'net.ipv4.tcp_max_syn_backlog': '65535',
          'net.core.netdev_max_backlog': '16384',
          'net.ipv4.tcp_tw_reuse': '1',
          'net.ipv4.tcp_keepalive_time': '60',
          'net.ipv4.tcp_keepalive_intvl': '10',
          'net.ipv4.tcp_keepalive_probes': '6',
          'net.ipv4.ip_nonlocal_bind': '1',
          'net.ipv4.ip_local_reserved_ports':
            (([patroni_haproxy_primary_port, patroni_haproxy_replicas_port,
               patroni_haproxy_direct_port, patroni_haproxy_stats_port,
               patroni_pgbouncer_port,
               patroni_api_port, patroni_postgresql_port,
               patroni_etcd_client_port,
               patroni_etcd_peer_port]
              | map('string') | list) | join(','))
        }
      }}

- name: Add overcommit params when swap is present
  ansible.builtin.set_fact:
    _sysctl_params: >-
      {{ _sysctl_params | combine({
           'vm.overcommit_memory': '2',
           'vm.overcommit_ratio': '80'
         })
      }}
  when: _swap_present | bool

###############################################################################
# 4. Apply sysctl values (live) and deploy persistent conf file
###############################################################################
- name: Apply sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: false
  loop: "{{ _sysctl_params | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"

# Persistent configuration only — runtime values were already set live by
# the `Apply sysctl parameters` loop above (each `sysctl name=X value=Y`
# writes /proc/sys/* immediately). No `reload sysctl` notify because that
# would just run `sysctl --system` at end-of-play, which is redundant
# when every value is already in effect.
- name: Deploy persistent sysctl configuration
  ansible.builtin.template:
    src: sysctl-patroni.conf.j2
    dest: /etc/sysctl.d/99-patroni-postgres.conf
    owner: root
    group: root
    mode: "0644"

# Earlier versions persisted the widened port range in /etc/sysctl.conf (the
# `Apply sysctl parameters` loop writes there too) as well as in the file
# above. Drop it, and put the live range back to the kernel default unless
# some other sysctl file still sets one.
- name: Remove the widened port range from /etc/sysctl.conf
  ansible.posix.sysctl:
    name: net.ipv4.ip_local_port_range
    state: absent
    reload: false

- name: Restore the kernel's default port range
  ansible.builtin.shell: |
    f=/proc/sys/net/ipv4/ip_local_port_range
    [ "$(awk '{print $1, $2}' "$f")" = '1024 65535' ] || exit 0
    grep -qs '^[[:space:]]*net[./]ipv4[./]ip_local_port_range' \
      /etc/sysctl.conf /etc/sysctl.d/*.conf /run/sysctl.d/*.conf \
      /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf && exit 0
    echo '32768 60999' > "$f"
    echo changed
  register: _patroni_port_range
  changed_when: "'changed' in _patroni_port_range.stdout"

###############################################################################
# 5-6. Transparent Huge Pages, now and at every boot (when patroni_thp_enabled is set)
###############################################################################
# Empty patroni_thp_enabled leaves THP alone entirely, including a disable-thp
# unit an earlier version of this role installed.
- name: Configure Transparent Huge Pages
  when: patroni_thp_enabled | length > 0
  block:
    # Earlier versions always turned THP off through disable-thp.service. Left in
    # place it would race patroni-thp.service at boot.
    - name: Check for the disable-thp unit
      ansible.builtin.stat:
        path: /etc/systemd/system/disable-thp.service
      register: _patroni_legacy_thp_unit

    - name: Remove the disable-thp unit
      when: _patroni_legacy_thp_unit.stat.exists
      block:
        - name: Disable the disable-thp unit
          ansible.builtin.systemd:
            name: disable-thp
            enabled: false

        - name: Delete the disable-thp unit file
          ansible.builtin.file:
            path: /etc/systemd/system/disable-thp.service
            state: absent

    # The file lists every mode with the active one in brackets, e.g.
    # "always [madvise] never". A kernel built without THP doesn't have it.
    - name: Apply THP setting now
      ansible.builtin.shell: |
        f=/sys/kernel/mm/transparent_hugepage/enabled
        [ -f "$f" ] || exit 0
        [ "$(sed -n 's/.*\[\(.*\)\].*/\1/p' "$f")" = '{{ patroni_thp_enabled }}' ] && exit 0
        echo '{{ patroni_thp_enabled }}' > "$f"
        echo changed
      register: _patroni_thp_apply
      changed_when: "'changed' in _patroni_thp_apply.stdout"

    - name: Deploy the THP unit
      ansible.builtin.template:
        src: patroni-thp.service.j2
        dest: /etc/systemd/system/patroni-thp.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable the THP unit
      ansible.builtin.systemd:
        name: patroni-thp
        enabled: true
        daemon_reload: true

###############################################################################
# 7. Auto-detect I/O scheduler (none for SSD, mq-deadline for HDD)
###############################################################################
- name: Resolve block device for patroni_postgresql_dir
  ansible.builtin.shell: |
    DEV=$(df --output=source "{{ patroni_postgresql_dir }}" 2>/dev/null | tail -1)
    BDEV=$(lsblk -ndo PKNAME "${DEV}" 2>/dev/null || basename "${DEV}" | sed 's/[0-9]*$//')
    echo "${BDEV}"
  args:
    executable: /bin/bash
  register: _block_dev
  changed_when: false
  failed_when: _block_dev.rc != 0 or _block_dev.stdout | length == 0

- name: Detect if block device is rotational (HDD)
  ansible.builtin.slurp:
    src: "/sys/block/{{ _block_dev.stdout | trim }}/queue/rotational"
  register: _rotational

- name: Set I/O scheduler fact
  ansible.builtin.set_fact:
    _io_scheduler: "{{ 'mq-deadline' if (_rotational.content | b64decode | trim) == '1' else 'none' }}"

- name: Apply I/O scheduler to block device
  ansible.builtin.shell: |
    echo {{ _io_scheduler }} > /sys/block/{{ _block_dev.stdout | trim }}/queue/scheduler
  changed_when: false

- name: Persist I/O scheduler via udev rule
  ansible.builtin.template:
    src: 60-ioscheduler.rules.j2
    dest: /etc/udev/rules.d/60-patroni-ioscheduler.rules
    owner: root
    group: root
    mode: "0644"
  notify: reload udev
