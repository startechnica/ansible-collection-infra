---
# Provision the dedicated PostgreSQL role used by WAL-G (backup-push).
# Mirrors the pgbouncer_auth.yml pattern: connect directly to PG on the
# leader's loopback (bypassing PgBouncer/HAProxy), create an idempotent
# LOGIN + REPLICATION role, persist password locally on the controller.
#
# Non-superuser WAL-G needs a COMPLETE privilege set on PG15+ (pg18 here).
# All three are required — each was historically (pre-PG15) implied by
# REPLICATION or superuser, but PG15 split them apart:
#
#   1. LOGIN + REPLICATION — connect, and the replication-protocol bits
#      backup-push relies on.
#   2. pg_monitor membership — read superuser-only GUCs (notably
#      `data_directory`) via SHOW/current_setting. Without it:
#      "permission denied to examine data_directory" (SQLSTATE 42501).
#      pg_monitor bundles pg_read_all_settings (+ stats); minimal grant.
#   3. EXECUTE on pg_backup_start()/pg_backup_stop() — in PG15+ these are
#      renamed from pg_start_backup/pg_stop_backup and are superuser-only
#      by DEFAULT; REPLICATION no longer implies them. Without the grant:
#      "permission denied for function pg_backup_start" (SQLSTATE 42501).
#
# pg_hba: wal-g runs inside the patroni container (both archive_command
# and the host-side walg-cron timer exec into it), and the patroni
# container uses Network=host, so the connection lands on 127.0.0.1. The
# existing `host all all 127.0.0.1/32 scram-sha-256` line in
# patroni.yml.j2 already covers this user — no hba change needed.
#
# Caller (main.yml) already gates this include on walg_enabled.

- name: Discover Patroni leader
  ansible.builtin.include_tasks: "../{{ patroni_container_engine }}/_detect_leader.yml"

- name: Create dedicated WAL-G PG role (LOGIN + REPLICATION)
  community.postgresql.postgresql_user:
    name: "{{ walg_auth_user }}"
    password: "{{ walg_auth_password }}"
    role_attr_flags: "LOGIN,REPLICATION"
    state: present
    login_host: 127.0.0.1
    login_port: "{{ postgresql_port }}"
    login_user: postgres
    login_password: "{{ postgresql_postgres_password }}"
    login_db: postgres
    ssl_mode: disable
  delegate_to: "{{ _patroni_leader_host }}"
  run_once: true
  no_log: true

- name: Grant pg_monitor to the WAL-G role (read data_directory + stats)
  community.postgresql.postgresql_membership:
    group: pg_monitor
    target_roles: "{{ walg_auth_user }}"
    state: present
    login_host: 127.0.0.1
    login_port: "{{ postgresql_port }}"
    login_user: postgres
    login_password: "{{ postgresql_postgres_password }}"
    login_db: postgres
    ssl_mode: disable
  delegate_to: "{{ _patroni_leader_host }}"
  run_once: true
  no_log: true

- name: Grant EXECUTE on backup-control functions to the WAL-G role
  community.postgresql.postgresql_query:
    query: >-
      GRANT EXECUTE ON FUNCTION
        pg_backup_start(text, boolean),
        pg_backup_stop(boolean)
      TO {{ walg_auth_user }}
    login_host: 127.0.0.1
    login_port: "{{ postgresql_port }}"
    login_user: postgres
    login_password: "{{ postgresql_postgres_password }}"
    login_db: postgres
    ssl_mode: disable
  delegate_to: "{{ _patroni_leader_host }}"
  run_once: true
  no_log: true
