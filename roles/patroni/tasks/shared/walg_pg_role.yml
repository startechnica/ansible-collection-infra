---
# Provision the dedicated PostgreSQL role used by WAL-G (backup-push).
# Mirrors the pgbouncer_auth.yml pattern: connect directly to PG on the
# leader's loopback (bypassing PgBouncer/HAProxy), create an idempotent
# LOGIN + REPLICATION role, persist password locally on the controller.
#
# Why REPLICATION (not superuser): WAL-G's backup-push calls
# pg_backup_start() / pg_backup_stop(), which require either superuser or
# REPLICATION. REPLICATION grants the backup-control bits without the
# pg_shadow / data-read access a superuser carries.
#
# pg_hba: wal-g runs inside the patroni container (both archive_command
# and the host-side walg-cron timer exec into it), and the patroni
# container uses Network=host, so the connection lands on 127.0.0.1. The
# existing `host all all 127.0.0.1/32 scram-sha-256` line in
# patroni.yml.j2 already covers this user — no hba change needed.
#
# Caller (main.yml) already gates this include on walg_enabled.

- name: Discover Patroni leader
  ansible.builtin.include_tasks: "../{{ patroni_container_engine }}/_detect_leader.yml"

- name: Create dedicated WAL-G PG role (LOGIN + REPLICATION)
  community.postgresql.postgresql_user:
    name: "{{ walg_auth_user }}"
    password: "{{ walg_auth_password }}"
    role_attr_flags: "LOGIN,REPLICATION"
    state: present
    login_host: 127.0.0.1
    login_port: "{{ postgresql_port }}"
    login_user: postgres
    login_password: "{{ postgresql_postgres_password }}"
    login_db: postgres
    ssl_mode: disable
  delegate_to: "{{ _patroni_leader_host }}"
  run_once: true
  no_log: true
