---
# The one memory check that needs a task rather than a variable.
#
# The budget itself (patroni_mem_request_mb) is a lazy expression in
# vars/main/memory.yml, not a fact, so nothing here has to compute it — see that
# file for why. preflight reads it directly as container_mem_request_mb.
#
# What's left is this warning, which fires on the precise shape of the failure
# that prompted the whole memory-budget rework: PostgreSQL sizing itself off
# TOTAL host RAM while something else already owns a large share of it. The
# auto-calculation can't see the other stack, so this is the only place the
# contradiction is visible. _patroni_mem_others_mb (vars/main/colocation.yml)
# includes a co-located MongoDB's budget, so such a host needs no
# patroni_mem_reserved_mb to arm it.

- name: Warn when PostgreSQL auto-sizes on a host with other reservations
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ patroni_pg_autosized | join(', ') }}
      {{ 'is' if patroni_pg_autosized | length == 1 else 'are' }}
      auto-calculated from TOTAL host RAM
      ({{ ansible_facts['memtotal_mb'] | default('unknown') }}MB), but
      {{ _patroni_mem_others_mb }}MB is already committed on this host by
      another stack ({{ _others | join(', ') }}). The auto-calculation cannot
      see that reservation, so it will over-commit the node — pin
      {{ patroni_pg_autosized | join(', ') }} explicitly in inventory.
  vars:
    _others: >-
      {{ (['MongoDB ' ~ mongodb_mem_request_mb ~ 'MB']
          if _patroni_mongodb_colocated | bool else [])
         + (['patroni_mem_reserved_mb ' ~ patroni_mem_reserved_mb ~ 'MB']
            if patroni_mem_reserved_mb | int > 0 else []) }}
  when:
    - _patroni_mem_others_mb | int > 0
    - patroni_pg_autosized | length > 0
