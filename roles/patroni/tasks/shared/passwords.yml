---
# ── Generate credentials locally on the Ansible controller ──────────
- name: Ensure local artifacts directory exists
  ansible.builtin.file:
    path: "{{ patroni_credentials_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate postgres password (idempotent — reuses existing file)
  ansible.builtin.set_fact:
    postgresql_postgres_password: >-
      {{ postgresql_postgres_password if postgresql_postgres_password != ''
         else lookup('password',
           patroni_credentials_file ~ ' length=64 chars=ascii_letters,digits') }}
  run_once: true
  no_log: true

- name: Generate pgbouncer auth_user password (idempotent — reuses existing file)
  ansible.builtin.set_fact:
    pgbouncer_auth_password: >-
      {{ pgbouncer_auth_password if pgbouncer_auth_password != ''
         else lookup('password',
           pgbouncer_credentials_file ~ ' length=64 chars=ascii_letters,digits') }}
  run_once: true
  no_log: true

- name: Generate pgbouncer stats_user password (idempotent — reuses existing file)
  ansible.builtin.set_fact:
    pgbouncer_stats_password: >-
      {{ pgbouncer_stats_password if pgbouncer_stats_password != ''
         else lookup('password',
           pgbouncer_stats_credentials_file ~ ' length=64 chars=ascii_letters,digits') }}
  run_once: true
  no_log: true
