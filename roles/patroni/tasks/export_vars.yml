# Export anchor — intentionally does no work.
#
# Importing this role with `tasks_from: export_vars` loads every file in the
# patroni role's defaults/main/ and vars/main/ (patroni_postgresql_port, patroni_scope,
# patroni_walg_enabled, patroni_vip_address, patroni_postgres_exporter_enabled, etc.) into the
# calling play WITHOUT running any of the deploy/day-2 tasks in main.yml.
#
# Consumed by roles/patroni_smoke (its dispatcher imports this first) so the
# smoke checks read the SAME variables the deploy used — single source of
# truth. Notably this makes the smoke test use the role's real default
# patroni_postgresql_port (55432), not a hard-coded 5432 fallback.
#
# Usage:
#   - ansible.builtin.import_role:
#       name: patroni
#       tasks_from: export_vars
#
# defaults/main/ has one file per component: patroni, postgresql, etcd,
# haproxy, pgbouncer, walg, s3, vip, vip_manager, keepalived,
# postgres_exporter, tls, standby, artifacts. To import only the variables you
# use, name one with `defaults_from`, and pass `vars_from: empty.yml` to skip
# the computed vars in vars/main/ (services.yml, vip_manager.yml, memory.yml,
# connections.yml):
#
#   - ansible.builtin.import_role:
#       name: patroni
#       tasks_from: export_vars
#       defaults_from: main/vip.yml
#       vars_from: empty.yml
#
# `vars_from` must name an existing file; without it, all of vars/main/ loads.
# roles/preflight/tasks/patroni_vip.yml imports the VIP settings this way.
#
# Every variable here is patroni_-prefixed, with no exceptions, so importing this
# role cannot redefine another role's settings. Where the role needs the value of
# a collection-wide variable it READS it with a fallback instead of declaring it
# — see patroni_debug and patroni_dry_run in defaults/main/patroni.yml. Both
# halves are enforced by tests/preflight_mem_budget.yml, which asserts patroni
# and mongodb share no name at all and that neither role has an unprefixed
# default.
#
# Role defaults are lowest precedence, so anything the inventory sets still
# wins. Keep this file task-free; its only job is to trigger var loading.
