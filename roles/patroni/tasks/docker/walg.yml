---
# Build the local wal-g image (docker). Counterpart to vip_manager.yml.
# Caller (docker/deploy.yml) gates on `patroni_walg_enabled`.

- name: Build wal-g image (docker)
  community.docker.docker_image:
    name: "localhost/wal-g:pg-{{ patroni_walg_version }}"
    build:
      path: "{{ patroni_walg_dir }}"
      pull: false
    source: build
    state: present
