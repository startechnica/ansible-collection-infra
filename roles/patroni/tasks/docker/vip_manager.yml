---
# vip-manager — docker path. Pull the prebuilt image.
# Caller (docker/deploy.yml) gates on `patroni_vip_enabled and use_vip_manager`.

# Retried like the other image pulls (see docker/preflight.yml).
- name: Pull vip-manager image (etcd-aware VIP)
  community.docker.docker_image:
    name: "{{ patroni_vip_manager_image }}"
    source: pull
  register: _image_pull
  retries: 10
  delay: 20
  until: _image_pull is succeeded
