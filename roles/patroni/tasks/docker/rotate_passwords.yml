---
# Rotate PostgreSQL and PgBouncer passwords across all nodes (docker).
# Caller must handle serialisation via `serial: 1` on the play.

- name: Generate new postgres password
  ansible.builtin.set_fact:
    new_pg_pass: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  run_once: true
  no_log: true

- name: Update PostgreSQL password (primary only)
  community.postgresql.postgresql_user:
    name: postgres
    password: "{{ new_pg_pass }}"
    login_host: 127.0.0.1
    login_port: "{{ haproxy_primary_port }}"
    login_user: postgres
    login_password: "{{ postgresql_postgres_password }}"
    login_db: postgres
    ssl_mode: disable
  run_once: true
  delegate_to: "{{ groups['patroni_nodes'] | first }}"
  no_log: true

- name: Update PgBouncer userlist
  ansible.builtin.copy:
    content: '"postgres" "{{ new_pg_pass }}"'
    dest: "{{ pgbouncer_dir }}/userlist.txt"
    mode: "0600"
  no_log: true

- name: Update patroni.yml with new password
  ansible.builtin.replace:
    path: "{{ patroni_dir }}/patroni.yml"
    regexp: 'password: ".*"'
    replace: 'password: "{{ new_pg_pass }}"'
  no_log: true

- name: Fix patroni.yml ownership
  ansible.builtin.file:
    path: "{{ patroni_dir }}/patroni.yml"
    owner: "{{ patroni_uid }}"
    group: "{{ patroni_gid }}"
    mode: "0600"

- name: Reload PgBouncer
  ansible.builtin.command: docker kill -s HUP pgbouncer
  register: _pgbouncer_reload
  failed_when:
    - _pgbouncer_reload.rc != 0
    - "'No such container' not in (_pgbouncer_reload.stderr | default(''))"
  changed_when: _pgbouncer_reload.rc == 0

- name: Reload Patroni
  community.docker.docker_container_exec:
    container: patroni
    command: patronictl -c /etc/patroni/patroni.yml reload {{ patroni_scope }} --force

- name: Update local credentials file
  ansible.builtin.template:
    src: credentials.txt.j2
    dest: "{{ patroni_credentials_file }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Display result (first node only)
  ansible.builtin.debug:
    msg:
      - "Passwords rotated successfully."
      - "New POSTGRES_PASSWORD saved to {{ patroni_credentials_file }}"
  run_once: true
