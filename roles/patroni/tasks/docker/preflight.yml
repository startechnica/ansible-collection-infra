---
# Patroni preflight — docker engine. VIP config validation + image pulls
# via community.docker.docker_image. Common system-level checks (root,
# docker, compose, RAM) are handled by the preflight role dependency
# called from main.yml.

- name: Validate VIP configuration (when VIP is enabled)
  ansible.builtin.assert:
    that:
      - patroni_vip_mask | string | length > 0
      - vip_manager in ['vip-manager', 'keepalived']
    fail_msg: >-
      patroni_vip_address='{{ patroni_vip_address }}' is set but patroni_vip_mask is empty or
      vip_manager='{{ vip_manager }}' is not
      'vip-manager' / 'keepalived'. Set patroni_vip_mask (e.g. 24) and a valid
      vip_manager, or unset 'patroni_vip_address' to disable the floating-IP service.
    success_msg: "VIP {{ patroni_vip_address }}/{{ patroni_vip_mask }} configured for {{ vip_manager }}."
  when: patroni_vip_address | length > 0
  run_once: true

- name: Pull required Docker images
  community.docker.docker_image:
    name: "{{ item }}"
    source: pull
  loop:
    - "{{ patroni_image }}"
    - "{{ etcd_image }}"
    - "{{ haproxy_image }}"
    - "{{ pgbouncer_image }}"
  loop_control:
    label: "{{ item }}"

- name: Pull postgres-exporter image (when enabled)
  community.docker.docker_image:
    name: "{{ postgres_exporter_image }}"
    source: pull
  when: postgres_exporter_enabled | bool
