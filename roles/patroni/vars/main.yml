---
# Internal computed defaults — vars/ precedence (~18) keeps these locked
# from inventory override. The user-facing knobs live in defaults/main.yml
# and reference these via Jinja, so an inventory CAN still override the
# user-facing var (defaults < inventory) while the underlying logic stays
# centralised.

# Auto-detected vip-manager release asset suffix.
# vip-manager publishes binaries as `vip-manager_<v>_Linux_<arch>.tar.gz`
# where <arch> is `x86_64` / `arm64` — Linux reports `aarch64`, vip-manager
# names it `arm64`. All other archs pass through unchanged.
# ref: https://github.com/cybertec-postgresql/vip-manager/releases
_vip_manager_arch: >-
  {{ 'arm64' if (ansible_facts['architecture'] | default('x86_64')) == 'aarch64'
     else (ansible_facts['architecture'] | default('x86_64')) }}

# Public service catalog — consumed by:
#   - roles/patroni/tasks/shared/netbox_register_services.yml (NetBox registration)
#   - roles/firewall/tasks/main.yml                           (auto-include ports)
# Base list + optional postgres-exporter entry, gated on postgres_exporter_enabled.
# Lazy-evaluated, so port-var changes in defaults/inventory propagate cleanly.
_patroni_services_base:
  - name: haproxy-primary
    port: "{{ haproxy_primary_port | int }}"
    protocol: tcp
    description: "HAProxy PostgreSQL primary"
  - name: haproxy-replicas
    port: "{{ haproxy_replicas_port | int }}"
    protocol: tcp
    description: "HAProxy PostgreSQL replicas"
  - name: pgbouncer
    port: "{{ pgbouncer_port | int }}"
    protocol: tcp
    description: "PgBouncer connection pooler"
  - name: patroni-api
    port: "{{ patroni_api_port | int }}"
    protocol: tcp
    description: "Patroni REST API"
  - name: etcd-client
    port: "{{ etcd_client_port | int }}"
    protocol: tcp
    description: "etcd client"

_patroni_services_exporter:
  - name: postgres-exporter
    port: "{{ postgres_exporter_port | int }}"
    protocol: tcp
    description: "Prometheus PostgreSQL exporter"

patroni_services: >-
  {{ _patroni_services_base + (_patroni_services_exporter if postgres_exporter_enabled | bool else []) }}
