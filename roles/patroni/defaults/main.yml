---
# ════════════════════════════════════════════════════════════════════
# Patroni HA PostgreSQL — Role Defaults
# ════════════════════════════════════════════════════════════════════

debug: false
dry_run: false

patroni_enabled: false

# Action dispatcher. See tasks/main.yml header for the full list:
#   provision (default) | manage-databases | backup | status | health |
#   switchover | renew-certs | rotate-passwords | uninstall
patroni_action: provision

# ── Uninstall safety ──
# patroni_destroy_prune  — when true, also delete PGDATA/etcd data dirs
#                          (everything under postgresql_root_dir, etcd_data_dir).
#                          When false (default), keep data; only configs go.
# patroni_skip_confirm   — when true, skip the interactive 'prune' prompt.
#                          Mostly for unattended teardowns in CI.
patroni_destroy_prune: false
patroni_skip_confirm: false

# Cluster
patroni_scope: "ha-pg-cluster"

# ── Standby cluster (DR / off-site read replica) ────────────────────────────
# A standby cluster is a full Patroni cluster (its own etcd, its own
# patroni_scope, its own nodes) whose leader continuously replays a REMOTE
# primary's data as a "Standby Leader" instead of accepting writes. Promote it
# to an independent primary with playbooks/patroni/standby-promote.yml.
# See docs/design/patroni-standby-cluster.md.
#
# Master switch. When true, this cluster streams from patroni_standby_primary_host
# (falling back to WAL-G wal-fetch of the primary's archive) and skips creating
# the replicator role at bootstrap (it clones the primary, which already has it).
# REQUIRES a patroni_scope distinct from the primary's.
patroni_standby_enabled: false
# Remote primary to stream from — IP or host of the primary's leader/VIP.
patroni_standby_primary_host: ""
# Remote primary's direct-postgres port (its postgresql_port, default 55432).
patroni_standby_primary_port: 55432
# Optional physical replication slot to hold on the primary (recommended so the
# primary retains WAL for the standby). Empty = no named slot.
patroni_standby_primary_slot: ""
# TLS mode for the outbound replication stream to the primary:
#   verify-ca — verify the primary's server cert against a shared CA (set
#               patroni_shared_ca_dir so both clusters chain to one CA).
#   require   — encrypt but do NOT CA-verify (use when clusters can't share a
#               CA; pair with postgresql_replication_password on both).
patroni_standby_primary_sslmode: "verify-ca"
# Replica creation methods, in order. `basebackup` clones directly from the
# primary over the stream; when walg_enabled the standby also gets a WAL-G
# restore_command so it can wal-fetch from the primary's archive if the stream
# is unavailable.
patroni_standby_create_replica_methods:
  - basebackup
# Object-storage key prefix (under the shared bucket) of the PRIMARY's WAL-G
# archive, for the standby's wal-fetch fallback. Set this to the primary's
# patroni_walg_s3_prefix / walg_gcs_prefix (default "patroni-walg-<primary_scope>").
# Empty = bucket root. Backend-agnostic: the standby must share the primary's
# walg_storage_type AND bucket (s3_bucket or walg_gcs_bucket) for the fallback
# to reach the archive.
patroni_standby_primary_walg_prefix: ""

# Shared CA for cross-cluster TLS trust. Empty (default) = each cluster mints its
# own self-signed "{{ patroni_scope }}-ca". Set to a controller-local dir holding
# ca.crt + ca.key to reuse ONE CA across primary + standby, so the standby's
# verify-ca stream trusts the primary's server cert. See §6a of the design doc.
patroni_shared_ca_dir: ""

# Extra pg_hba `replication` CIDRs on the PRIMARY, so it admits remote standby
# node IPs (the built-in replication rules cover only same-cluster node_ips).
# Also add these IPs to the primary's firewall_service_source_map for
# `postgresql-direct` (port 55432). Empty = same-cluster peers only.
patroni_replication_cidrs: []

# VIP manager: "vip-manager" (default), "keepalived", or any other value to disable.
vip_manager: "vip-manager"

# Floating IP served by vip-manager/keepalived on the current primary.
# Empty (default) disables the VIP service entirely (no vip-manager, no
# keepalived). Set per inventory to enable; vip_manager picks the implementation.
# patroni_vip_iface is auto-detected from node_ip at runtime; override to force a specific NIC.
patroni_vip_address: ""
patroni_vip_mask: 32
patroni_vip_iface: ens192

# ── Container engine ──
# Per-role selector for the container runtime. Falls back to the global
# `container_engine` (defaults to 'podman' here when neither is set).
# Set this directly to run patroni on a different engine than mongodb
# / other roles on the same host group.
patroni_container_engine: "{{ container_engine | default('podman') }}"

# Docker images
postgresql_version: 18
patroni_image: "ghcr.io/parmincloud/containers/patroni:4.1.0-pg18"
etcd_image: "gcr.io/etcd-development/etcd:v3.6.10"
haproxy_image: "docker.io/haproxy:3.3-alpine"
pgbouncer_image: "docker.io/edoburu/pgbouncer:v1.25.1-p0"
vip_manager_version: "4.0.0"
# Architecture suffix for the vip-manager release binary. Auto-detected
# from `ansible_architecture` (logic in vars/main.yml :: _vip_manager_arch).
# Override here in inventory to force a specific value (cross-arch build,
# air-gapped mirror with a renamed asset, …).
vip_manager_arch: "{{ _vip_manager_arch }}"
# WAL-G is built locally from the official GitHub release binary
# (no upstream container image is published — see issue wal-g/wal-g#473).
# The Dockerfile lives in templates/dockerfiles/walg.Dockerfile.j2 and
# pulls the postgres-flavor binary for v{{ walg_version }}. Override
# walg_version to bump; walg_image follows it via the v<ver> tag.
# NOTE: the Ubuntu binary release is amd64-only — aarch64 hosts need
# a different asset name; not supported by this default.
walg_version: "v3.0.8"
walg_image: "localhost/wal-g:pg-{{ walg_version }}"

# Build wal-g locally from the bundled Dockerfile (default) vs. pull a
# prebuilt image. Set walg_build_local=false in inventory and override
# walg_image to a public/mirrored reference (e.g. ghcr.io/yourorg/wal-g:pg-v3.0.8)
# to skip the build and pull instead.
walg_build_local: true

# Passwords (auto-generated if empty)
postgresql_postgres_password: ""
postgresql_replication_password: "" # empty = TLS cert auth for replication

# Dedicated PostgreSQL role used by PgBouncer for auth_query lookups.
# A LOGIN-only role; no other privileges. Auto-generated if empty and
# persisted to artifacts/<inv>/patroni/pgbouncer.password on the controller.
pgbouncer_auth_password: ""

# Password for the read-only PgBouncer admin console user (`pgbouncer_stats`,
# see pgbouncer_stats_users below). PgBouncer-internal only — no PG role,
# no userlist auth_query path; lives only in userlist.txt. Auto-generated
# if empty and persisted to artifacts/<inv>/patroni/pgbouncer_stats.password.
pgbouncer_stats_password: ""

# Direct PostgreSQL access (port {{ postgresql_port }}) — list of CIDRs allowed
# in pg_hba.conf in addition to: localhost (PgBouncer on the same node) and
# the cluster's own member nodes (Patroni coordination + replication).
#
# For day-to-day app traffic, leave this empty — clients should hit the VIP
# via HAProxy → PgBouncer. Add CIDRs only when you need direct psql/pgcli
# from a jump host or admin VPN. Example:
#   postgresql_admin_cidrs:
#     - 10.99.0.0/24    # ops VPN
postgresql_admin_cidrs: []
# Service ports
pgbouncer_port: 6543
haproxy_primary_port: 5432
haproxy_replicas_port: 5433
haproxy_stats_port: 7000

# HAProxy → Patroni REST API health-check tuning. These govern how quickly
# HAProxy marks a backend down and (because of `on-marked-down
# shutdown-sessions`) force-closes its live client sessions. Loosen them to
# stop spurious flaps under load from killing connections mid-query (clients
# see "unexpected EOF"); tighten them for faster real-failover detection.
#   inter         — seconds between checks
#   fall          — consecutive failed checks before a backend is DOWN
#                   (detection latency ≈ inter × fall)
#   rise          — consecutive OK checks before a backend is back UP
#   check_timeout — per-check timeout; a Patroni API slower than this fails
haproxy_check_inter: "3s"
haproxy_check_fall: 5
haproxy_check_rise: 2
haproxy_check_timeout: "10s"

postgresql_port: 55432
patroni_api_port: 8008
etcd_client_port: 2379
etcd_peer_port: 2380

# Container UIDs
patroni_uid: 999
patroni_gid: 999
etcd_uid: 42782
etcd_gid: 42782
# HAProxy container UID/GID — official haproxy:* image uses haproxy:99.
# Override if you switch to a different image (e.g. some forks use 1000).
haproxy_uid: 99
haproxy_gid: 99

# PostgreSQL logging: "file", "stdout", or "both"
postgresql_log_destination: "stdout"

# Debug mode (rebuild images on deploy)
debug_mode: false

# Host directories
postgresql_dir: /opt/postgresql
postgresql_root_dir: "{{ postgresql_dir }}/pgroot"
postgresql_log_dir: "{{ postgresql_dir }}/pg_log"

etcd_dir: /opt/etcd
etcd_data_dir: "{{ etcd_dir }}/data"
patroni_dir: /opt/patroni
certs_dir: "{{ patroni_dir }}/tls"

# PgBouncer container UID/GID — edoburu/pgbouncer (Alpine) uses postgres:70.
# Override if you switch to a different image (e.g. bitnami uses 1001).
pgbouncer_uid: 70
pgbouncer_gid: 70
patroni_ca_dir: "{{ certs_dir }}/ca"
etcd_certs_dir: "{{ certs_dir }}/etcd"
patroni_certs_dir: "{{ certs_dir }}/patroni"
haproxy_certs_dir: "{{ certs_dir }}/haproxy"
pgbouncer_certs_dir: "{{ certs_dir }}/pgbouncer"
vip_manager_certs_dir: "{{ certs_dir }}/vip-manager"
haproxy_dir: /opt/haproxy
pgbouncer_dir: /opt/pgbouncer
keepalived_dir: /opt/keepalived
vip_manager_dir: /opt/vip-manager
walg_dir: /opt/walg

# Backup & WAL archiving
patroni_backup_dir: "{{ postgresql_dir }}/backups"
wal_archive_dir: "{{ postgresql_dir }}/wal_archive"

# S3/MinIO storage (set s3_bucket to enable WAL-G + etcd snapshot upload)
s3_bucket: ""
s3_endpoint: ""
s3_access_key: ""
s3_secret_key: ""
s3_region: "us-east-1"
s3_force_path_style: "true"

walg_retention: 7
walg_compression: "lz4"

# WAL-G object-storage backend: `s3` (AWS S3, MinIO, Ceph, any S3-compatible
# gateway — driven by the shared s3_* vars) or `gcs` (native Google Cloud
# Storage JSON API — driven by the walg_gcs_* vars below). This selects the
# WAL-G archive target only; etcd snapshots always upload to S3 (s3_bucket),
# so a GCS-backed cluster that also wants remote etcd snapshots still needs
# the s3_* vars filled in.
walg_storage_type: "s3"

# WAL-G S3 key prefix (under s3_bucket) for THIS cluster's base backups + WAL
# archive. Defaults to a scope-namespaced path ("patroni-walg-<patroni_scope>")
# so multiple Patroni clusters can share one bucket without colliding at the
# root. Set to "" to use the bucket root (s3://{{ s3_bucket }}). A standby's
# wal-fetch fallback (patroni_standby_primary_walg_prefix) points at the
# PRIMARY's prefix within the same bucket.
patroni_walg_s3_prefix: "patroni-walg-{{ patroni_scope }}"

# ── Native GCS backend (used only when walg_storage_type == 'gcs') ──────
# WAL-G authenticates to GCS with a service-account key, not HMAC keys, so
# the whole JSON key file is the input here (the file GCP hands you at
# "Create key → JSON"). Accepts either the raw JSON string or an already
# parsed YAML/JSON mapping. KEEP THIS IN ANSIBLE VAULT — it is a private key.
# The role writes it to walg_gcs_service_account_file (0600, patroni-owned) and
# mounts its parent directory read-only into the patroni container, where
# GOOGLE_APPLICATION_CREDENTIALS points wal-g at it.
walg_gcs_bucket: ""
walg_gcs_service_account_json: ""

# GCS object prefix (under walg_gcs_bucket) for THIS cluster — same
# scope-namespacing rationale as patroni_walg_s3_prefix. Set to "" to use the
# bucket root (gs://{{ walg_gcs_bucket }}).
walg_gcs_prefix: "patroni-walg-{{ patroni_scope }}"

# Where the service-account key lands, host side and container side. The
# DIRECTORY is what gets bind-mounted, not the bare file: re-rendering the key
# replaces the inode, which a file bind-mount would not follow, leaving the
# running container on a stale copy.
#
#   _dir    host directory   — bind-mount source, 0700 patroni-owned
#   _file   host file        — what the role renders the key to, 0600
#   _mount  container dir    — bind-mount target, read-only
#   _path   container file   — what GOOGLE_APPLICATION_CREDENTIALS points at
walg_gcs_service_account_dir: "{{ walg_dir }}/gcs"
walg_gcs_service_account_file: "{{ walg_gcs_service_account_dir }}/credentials.json"
walg_gcs_service_account_mount: "/etc/walg"
walg_gcs_service_account_path: "{{ walg_gcs_service_account_mount }}/credentials.json"

# WAL-G backup schedule — systemd OnCalendar expression (see `man
# systemd.time`). Replaces the in-container sleep loop. Examples:
#   "*-*-* 02:00:00"        daily at 02:00 (default)
#   "Sun *-*-* 03:00:00"    weekly Sunday 03:00
#   "00,12:00:00"           every 12 hours on the hour
# Set to an empty string to disable scheduled backups (on-demand
# `patroni_action: backup` still works).
walg_schedule: "*-*-* 02:00:00"

# Dedicated PostgreSQL role used by WAL-G for backup-push (calls
# pg_backup_start / pg_backup_stop, which require REPLICATION). LOGIN +
# REPLICATION only — no superuser, no read access to user data. Avoids
# putting the postgres superuser password in walg.env.
walg_auth_user: "walg"
walg_auth_password: ""

# WAL-G (PostgreSQL WAL archiving + base backups to object storage).
# Defaults to enabled, but only takes effect when the selected backend has
# a bucket configured: s3_bucket for walg_storage_type=s3, walg_gcs_bucket
# for walg_storage_type=gcs. Set to false in inventory to keep S3 for
# etcd-snapshot uploads only while skipping WAL-G entirely (no walg.env, no
# walg-init container, no walg-cron timer, no postgres archive_command).
walg_enabled: true

# etcd snapshots — driven by a systemd timer (no cron dependency; FCOS
# doesn't ship crond). `etcd_snapshot_schedule` is a systemd OnCalendar
# expression; see `man systemd.time` (section "CALENDAR EVENTS"). Examples:
#   "00,06,12,18:00:00"     every 6h on the hour (default)
#   "*-*-* 02:00:00"        daily at 02:00
#   "Sun *-*-* 03:00:00"    weekly Sunday 03:00
#   "*:0/15"                every 15 minutes
# Set to an empty string to disable scheduled snapshots entirely.
etcd_snapshot_schedule: "00,06,12,18:00:00"
etcd_snapshot_dir: "{{ etcd_dir }}/snapshots"
etcd_snapshot_retain: 7

# S3 key prefix for uploaded etcd snapshots. Defaults to a scope-namespaced
# path ("patroni-etcd-<patroni_scope>") so multiple Patroni clusters can share
# one bucket without colliding on the same etcd-snapshot-<STAMP>.db names.
# Override to pin a custom layout.
patroni_etcd_s3_prefix: "patroni-etcd-{{ patroni_scope }}"

# PostgreSQL memory (auto-calculated if empty)
pg_shared_buffers: ""
pg_effective_cache: ""
pg_work_mem: ""
pg_maint_mem: ""

# PostgreSQL extensions to preload + CREATE EXTENSION on each managed DB.
#
#   - pg_stat_statements — query telemetry; always bundled with Postgres core.
#   - pgaudit            — session/object audit log; ONLY available if the
#                          `patroni_image` bundles libpgaudit.so (e.g.
#                          ghcr.io/zalando/spilo-* has it; generic Postgres
#                          images don't). Adding it to a non-pgaudit image
#                          makes postmaster fail with:
#                             FATAL: could not access file "pgaudit":
#                             No such file or directory
#     Override `patroni_image` to one that bundles pgaudit before listing it.
#   - Others (postgis, timescaledb, pg_trgm, ...) follow the same rule —
#     the image must bundle the .so file.
patroni_extensions:
  - pg_stat_statements

# Databases and users to create post-init. Each DB gets all listed extensions applied.
# Example:
#   patroni_databases:
#     - name: app_main
#       owner: app_main
#       users:
#         - name: app_main
#           password: "{{ vault_app_main_password }}"
#           roles: [LOGIN, CREATEDB]
#         - name: app_main_ro
#           password: "{{ vault_app_main_ro_password }}"
#           roles: [LOGIN]
#           grants:
#             - { privs: "CONNECT", on: "database" }
#             - { privs: "SELECT", on: "all-tables" }
patroni_databases: []
# Monitoring — postgres_exporter (optional)
postgres_exporter_enabled: false
postgres_exporter_image: "prometheuscommunity/postgres-exporter:v0.19.1"
postgres_exporter_port: 9187
# Optional custom queries.yaml content — rendered verbatim into the
# exporter's queries file when non-empty. Empty (default) ships only the
# exporter's built-in collectors.
postgres_exporter_custom_queries: ""

# TLS certificate validity (days)
tls_cert_days: 3650

# Key algorithm: ECC (ECDSA) by default — sha384 digest pairs with secp384r1.
# Set tls_key_type: RSA with tls_key_size: 4096 to fall back to RSA.
tls_key_type: ECC
tls_key_curve: secp384r1
tls_key_size: 4096
tls_signature_digest: sha384

# Renew_certs subset selector — list of cert names to inspect/regenerate
# (e.g. ['patroni', 'haproxy', 'pgbouncer']). Empty (default) skips the
# inspection loop; pass via `-e` for a targeted renew.
patroni_certs_to_inspect: []
# Local artifacts (on the Ansible controller)
# artifacts_dir is set by playbooks/patroni/_setup.yml on localhost only,
# because add_host nodes have inventory_file == None.
patroni_credentials_dir: "{{ hostvars['localhost'].artifacts_dir }}/patroni"
patroni_credentials_file: "{{ patroni_credentials_dir }}/postgres.password"
pgbouncer_credentials_file: "{{ patroni_credentials_dir }}/pgbouncer.password"
pgbouncer_stats_credentials_file: "{{ patroni_credentials_dir }}/pgbouncer_stats.password"
walg_credentials_file: "{{ patroni_credentials_dir }}/walg.password"
patroni_local_certs_dir: "{{ patroni_credentials_dir }}/certs"

pgbouncer_pool_mode: "session"
# Comma-separated list of database users allowed to run all commands on the
# pgbouncer admin console. Must be present in userlist.txt (admin console
# does NOT use auth_query). Default: the dedicated `pgbouncer` auth_user.
pgbouncer_admin_users: "pgbouncer"
# Comma-separated list of users allowed to run read-only SHOW commands on
# the pgbouncer admin console. Same constraint as admin_users — must be in
# userlist.txt. Default: the dedicated `pgbouncer_stats` user, separate
# from the auth_user so monitoring credentials can rotate independently
# and a SHOW-only credential leak doesn't expose pg_shadow access.
pgbouncer_stats_users: "pgbouncer_stats"
pgbouncer_default_pool_size: 20

# ── PgBouncer client-facing TLS (clients → PgBouncer) ──────────────────
# Counterpart to the server_tls_* block (PgBouncer → PostgreSQL) already in
# pgbouncer.ini.j2. PgBouncer terminates client TLS for the WHOLE stack:
# HAProxy runs `mode tcp` with no TLS on its bind, so a client connecting to
# haproxy_primary_port / haproxy_replicas_port passes straight through and
# completes its TLS handshake against PgBouncer, not PostgreSQL.
#
#   disable       plain TCP only; a client's TLS request is ignored
#   allow         TLS when the client asks for it, plaintext otherwise
#   prefer        identical to allow (PgBouncer treats them the same)
#   require       client MUST use TLS; client certs are not validated
#   verify-ca     client must use TLS *and present a valid client cert*
#   verify-full   identical to verify-ca (PgBouncer treats them the same)
#
# `prefer` is the default here because it is non-breaking: existing plaintext
# clients keep working while TLS-capable ones get an encrypted session. Set
# `require` to force TLS once every client is known to speak it.
#
# NOTE: verify-ca / verify-full make a CLIENT certificate mandatory on every
# connection — that means issuing a per-application cert from this cluster's
# CA and generally switching `auth_type` to `cert`. Don't flip to those
# without that groundwork or every app locks itself out.
pgbouncer_client_tls_sslmode: "prefer"

# TLS versions accepted from clients. `secure` = tlsv1.2 + tlsv1.3. This is
# already PgBouncer's own default; pinned explicitly so an upstream default
# change can't silently re-admit TLS 1.0/1.1. `all` allows tlsv1.0/tlsv1.1.
pgbouncer_client_tls_protocols: "secure"

# Cipher list for TLS 1.2 and below (TLS 1.3 suites are negotiated
# separately and unaffected). Shortcuts: default / secure / fast / normal,
# or any OpenSSL cipher string.
pgbouncer_client_tls_ciphers: "default"
