---
# Patroni role defaults: TLS certificates (key settings, per-service
# directories, shared CA).
# The role loads every file in defaults/main/ (see tasks/export_vars.yml).

# TLS certificate validity (days)
patroni_tls_cert_days: 3650

# Key algorithm: ECC (ECDSA) by default — sha384 digest pairs with secp384r1.
# Set patroni_tls_key_type: RSA with patroni_tls_key_size: 4096 to fall back to RSA.
patroni_tls_key_type: ECC
patroni_tls_key_curve: secp384r1
patroni_tls_key_size: 4096
patroni_tls_signature_digest: sha384

# Renew_certs subset selector — list of cert names to inspect/regenerate
# (e.g. ['patroni', 'haproxy', 'pgbouncer']). Empty (default) skips the
# inspection loop; pass via `-e` for a targeted renew.
patroni_certs_to_inspect: []

# Certificate directories on the hosts
patroni_tls_dir: "{{ patroni_dir }}/tls"
patroni_ca_dir: "{{ patroni_tls_dir }}/ca"
patroni_etcd_certs_dir: "{{ patroni_tls_dir }}/etcd"
patroni_certs_dir: "{{ patroni_tls_dir }}/patroni"
patroni_haproxy_certs_dir: "{{ patroni_tls_dir }}/haproxy"
patroni_pgbouncer_certs_dir: "{{ patroni_tls_dir }}/pgbouncer"
patroni_vip_manager_certs_dir: "{{ patroni_tls_dir }}/vip-manager"

# Shared CA for cross-cluster TLS trust. Empty (default) = each cluster mints its
# own self-signed "{{ patroni_scope }}-ca". Set to a controller-local dir holding
# ca.crt + ca.key to reuse ONE CA across primary + standby, so the standby's
# verify-ca stream trusts the primary's server cert. See §6a of the design doc.
patroni_shared_ca_dir: ""
