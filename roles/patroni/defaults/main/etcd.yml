---
# Patroni role defaults: etcd, the DCS that holds Patroni's cluster state.
# The role loads every file in defaults/main/ (see tasks/export_vars.yml).

patroni_etcd_image: "gcr.io/etcd-development/etcd:v3.6.10"
patroni_etcd_client_port: 2379
patroni_etcd_peer_port: 2380
patroni_etcd_uid: 42782
patroni_etcd_gid: 42782
patroni_etcd_dir: /opt/etcd
patroni_etcd_data_dir: "{{ patroni_etcd_dir }}/data"

# etcd history compaction. etcd keeps every old version of every key until
# something compacts them, and Patroni rewrites its member, status and leader
# keys every loop_wait (10 s) from every node. Uncompacted, a 3-node cluster's
# backend grows by roughly 18 MB a day and reaches etcd's default 2 GB quota in
# about four months. etcd then raises a NOSPACE alarm and rejects every write:
# the running primary keeps its lease, so nothing looks wrong, but the next time
# it fails no replica can take the leader lock and the cluster is left with no
# primary. Compaction keeps the backend at a few MB.
#
#   periodic + "1h"      keep one hour of history (default)
#   revision + "1000"    keep the last 1000 revisions
#
# Set patroni_etcd_auto_compaction_mode to "" to omit both flags (etcd's own
# default: compaction off). Changing either value recreates the etcd container
# on the next provision run; see docs/UPGRADING.md for rolling it out to a
# running cluster one member at a time.
patroni_etcd_auto_compaction_mode: periodic
patroni_etcd_auto_compaction_retention: "1h"

# etcd snapshots — driven by a systemd timer (no cron dependency; FCOS
# doesn't ship crond). `patroni_etcd_snapshot_schedule` is a systemd OnCalendar
# expression; see `man systemd.time` (section "CALENDAR EVENTS"). Examples:
#   "00,06,12,18:00:00"     every 6h on the hour (default)
#   "*-*-* 02:00:00"        daily at 02:00
#   "Sun *-*-* 03:00:00"    weekly Sunday 03:00
#   "*:0/15"                every 15 minutes
# Set to an empty string to disable scheduled snapshots entirely.
patroni_etcd_snapshot_schedule: "00,06,12,18:00:00"
patroni_etcd_snapshot_dir: "{{ patroni_etcd_dir }}/snapshots"
patroni_etcd_snapshot_retain: 7

# S3 key prefix for uploaded etcd snapshots. Defaults to a scope-namespaced
# path ("patroni-etcd-<patroni_scope>") so multiple Patroni clusters can share
# one bucket without colliding on the same etcd-snapshot-<STAMP>.db names.
# Override to pin a custom layout.
patroni_etcd_s3_prefix: "patroni-etcd-{{ patroni_scope }}"

# Host-level OOM victim bias — the most strongly protected container in the
# stack: losing the DCS makes Patroni demote the primary cluster-wide, so etcd
# must outlive everything else on the node. See patroni_oom_score_adj for the
# full ranking.
patroni_etcd_oom_score_adj: -900
