---
# Patroni role defaults: HAProxy (image, ports, health checks, timeouts).
# The role loads every file in defaults/main/ (see tasks/export_vars.yml).

haproxy_image: "docker.io/haproxy:3.3-alpine"
haproxy_primary_port: 5432
haproxy_replicas_port: 5433
# Pooler bypass straight to the Patroni leader's PostgreSQL (migrations, admin tooling).
haproxy_direct_port: 5434
haproxy_stats_port: 7000
haproxy_dir: /opt/haproxy

# HAProxy container UID/GID — official haproxy:* image uses haproxy:99.
# Override if you switch to a different image (e.g. some forks use 1000).
haproxy_uid: 99
haproxy_gid: 99

# HAProxy → Patroni REST API health-check tuning. These govern how quickly
# HAProxy marks a backend down and (because of `on-marked-down
# shutdown-sessions`) force-closes its live client sessions. Loosen them to
# stop spurious flaps under load from killing connections mid-query (clients
# see "unexpected EOF"); tighten them for faster real-failover detection.
#   inter         — seconds between checks
#   fall          — consecutive failed checks before a backend is DOWN
#                   (detection latency ≈ inter × fall)
#   rise          — consecutive OK checks before a backend is back UP
#   check_timeout — per-check timeout; a Patroni API slower than this fails
haproxy_check_inter: "3s"
haproxy_check_fall: 5
haproxy_check_rise: 2
haproxy_check_timeout: "10s"

# ── HAProxy connection caps ────────────────────────────────────────────
# Two limits per listener. The FRONTEND cap bounds what HAProxy accepts on the
# entry; the SERVER cap bounds what it forwards to one backend. Keep the
# frontend ABOVE the server cap: excess then queues visibly inside HAProxy
# (`timeout queue`, the Tw field in the tcplog) instead of being refused at
# accept and left in the kernel backlog. Raising a server cap without raising
# its frontend has no effect.
#
# The pooled and bypass listeners are sized against DIFFERENT resources, which
# is why their numbers are an order of magnitude apart:
#
#   pg-primary / pg-replicas → PgBouncer. These are CLIENT connections to a
#     pooler, which is what a pooler is for. The real ceiling is PgBouncer's
#     own `patroni_pgbouncer_max_client_conn`, so 1000 here lines up with it
#     exactly. PgBouncer's server-side pool — not this cap — is what bounds
#     real PostgreSQL backends.
#
#   pg-direct → PostgreSQL, bypassing the pooler. EVERY connection here is a
#     real backend competing for patroni_pg_max_connections, against
#     PgBouncer's pools at (patroni_pgbouncer_default_pool_size +
#     patroni_pgbouncer_reserve_pool_size) per user/database pair plus Patroni,
#     the exporter and WAL-G. Three pairs already exceed that limit at the
#     shipped defaults. This path is for migrations and admin tooling — low
#     concurrency by design — and is held deliberately small so a runaway job
#     cannot starve PgBouncer's pool and take the application down with it.
#     This cap is one term in preflight's connection budget (passed as
#     pg_conn_bypass), so raising it is checked against max_connections on the
#     next run rather than discovered in production.
patroni_haproxy_primary_maxconn: 1100
patroni_haproxy_primary_server_maxconn: 1000
patroni_haproxy_replicas_maxconn: 1100
patroni_haproxy_replicas_server_maxconn: 1000
patroni_haproxy_direct_maxconn: 100
patroni_haproxy_direct_server_maxconn: 20
# Process-wide ceiling. Every listener above draws from this one budget, so it
# must exceed their sum (currently 1100 + 1100 + 100 + the stats listener's
# hardcoded 100 = 2400) or the frontends silently cap here instead.
patroni_haproxy_global_maxconn: 4000

# ── HAProxy connection timeouts ────────────────────────────────────────
# These are INACTIVITY timers: HAProxy measures time since application data
# last moved in that direction. Kernel TCP keepalives (option clitcpka /
# srvtcpka, on by default) do NOT reset them — a keepalive probe is an empty
# ACK carrying no application data. Keepalives only detect dead peers and hold
# NAT/firewall state open; the two mechanisms are independent.
#
# `tunnel` is what makes long-lived idle sessions survive. Per the HAProxy
# manual it "supersedes both the client and server timeouts once the connection
# becomes a tunnel. In TCP, this timeout is used as soon as no analyser remains
# attached to either connection (e.g. tcp content rules are accepted)." The pg
# listeners have no tcp-request rules and no TLS on their bind lines, so no
# analyser is ever attached and `tunnel` governs from the moment the session is
# accepted — client/server are left as backstops and for the mode-http stats
# listener, while `connect` bounds backend connection setup. Two workloads need
# the long leash:
#
#   * LISTEN/NOTIFY — the client issues `LISTEN chan` then stays silent,
#     possibly for hours. Under the old hardcoded 300s it was disconnected
#     after 5 minutes of quiet, and because NOTIFY is not queued for absent
#     listeners, every notification published in the gap was lost silently.
#   * Long statements — a big CREATE INDEX, slow analytical query, or pg_dump
#     through the proxy sends no bytes while it runs. PgBouncer deliberately
#     does not cap these (query_timeout = 0), so HAProxy was the limit.
#
# 24h is safe here specifically BECAUSE keepalives are enabled: a genuinely
# dead peer is reaped by the kernel in ~2 min (see os_tuning.yml's
# tcp_keepalive_* sysctls), so the tunnel timeout is a backstop against
# leaked-but-live connections, not the primary reaper. Lower `tunnel` if you'd
# rather bound session lifetime — raising client/server will not do it, since
# tunnel supersedes them on the pg listeners.
haproxy_client_timeout: "300s"
haproxy_server_timeout: "300s"
haproxy_connect_timeout: "10s"
haproxy_tunnel_timeout: "24h"
# Half-closed (FIN sent, peer hasn't closed back) connections. These override
# `tunnel` once a connection is shut down in one direction, so they are what
# actually bounds FIN_WAIT — without them a client that vanishes mid-session
# (NAT drop, lossy link, hard kill) holds its slot for the full 24h. Keep them
# well below haproxy_tunnel_timeout.
haproxy_client_fin_timeout: "30s"
haproxy_server_fin_timeout: "30s"

# Host-level OOM victim bias — on the client path, so protected, but less than
# etcd/Patroni: a restart drops in-flight connections rather than costing
# recovery or a failover. See patroni_oom_score_adj for the full ranking.
haproxy_oom_score_adj: -300
