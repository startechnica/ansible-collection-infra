---
# Patroni role defaults: keepalived, the other VIP engine
# (patroni_vip_engine: keepalived).
# The role loads every file in defaults/main/ (see tasks/export_vars.yml).

patroni_keepalived_dir: /opt/keepalived

# Host-level OOM victim bias — holds the VIP, so a kill moves client traffic to
# another node. Tiny footprint; protect it. See patroni_oom_score_adj.
patroni_keepalived_oom_score_adj: -500
