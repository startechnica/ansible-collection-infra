---
# Patroni role defaults: PostgreSQL (version, port, credentials, access,
# logging, directories, memory, extensions and databases).
# The role loads every file in defaults/main/ (see tasks/export_vars.yml).

postgresql_version: 18
postgresql_port: 55432

# Passwords (auto-generated if empty)
postgresql_postgres_password: ""
postgresql_replication_password: "" # empty = TLS cert auth for replication

# Direct PostgreSQL access (port {{ postgresql_port }}) — list of CIDRs allowed
# in pg_hba.conf in addition to: localhost (PgBouncer on the same node) and
# the cluster's own member nodes (Patroni coordination + replication).
#
# For day-to-day app traffic, leave this empty — clients should hit the VIP
# via HAProxy → PgBouncer. Add CIDRs only when you need direct psql/pgcli
# from a jump host or admin VPN. Example:
#   postgresql_admin_cidrs:
#     - 10.99.0.0/24    # ops VPN
postgresql_admin_cidrs: []

# PostgreSQL logging: "file", "stdout", or "both"
postgresql_log_destination: "stdout"

# Host directories
postgresql_dir: /opt/postgresql
postgresql_root_dir: "{{ postgresql_dir }}/pgroot"
postgresql_log_dir: "{{ postgresql_dir }}/pg_log"

# Backup & WAL archiving
patroni_backup_dir: "{{ postgresql_dir }}/backups"
wal_archive_dir: "{{ postgresql_dir }}/wal_archive"

# PostgreSQL memory (auto-calculated if empty)
# Everything this role runs on the node BESIDES PostgreSQL's shared_buffers:
# etcd, patroni itself, haproxy, pgbouncer, the VIP manager and the exporter.
# Only the exporter sets a Memory= cap; the rest are uncapped deliberately,
# because capping a consensus store or the holder of the VIP turns memory
# pressure into a cluster event. So this is one declared estimate rather than a
# sum of limits, and it is only ever used by the preflight memory budget
# (vars/main/memory.yml), never enforced.
#
# Deliberately flat, and deliberately not conditional on
# postgres_exporter_enabled: it lets the whole budget depend on THIS defaults
# file alone, which is what allows another role to import it with a single
# `defaults_from` and none of patroni's other topics. Cost of that choice is
# over-budgeting by ~128MB when the exporter is off — the conservative
# direction, on an estimate that is already approximate.
patroni_stack_overhead_mb: 640

# Memory committed on this node by something OTHER than this role — set it on a
# host that also runs MongoDB (or anything else sizeable) so preflight's budget
# sees the whole picture rather than half of it. Passed through to preflight as
# container_mem_reserved_mb. Per-role rather than host-wide on purpose: each
# role needs "everything except me", so one shared figure would double-count.
patroni_mem_reserved_mb: 0

pg_shared_buffers: ""
pg_effective_cache: ""
pg_work_mem: ""
pg_maint_mem: ""

# PostgreSQL extensions to preload + CREATE EXTENSION on each managed DB.
#
#   - pg_stat_statements — query telemetry; always bundled with Postgres core.
#   - pgaudit            — session/object audit log; ONLY available if the
#                          `patroni_image` bundles libpgaudit.so (e.g.
#                          ghcr.io/zalando/spilo-* has it; generic Postgres
#                          images don't). Adding it to a non-pgaudit image
#                          makes postmaster fail with:
#                             FATAL: could not access file "pgaudit":
#                             No such file or directory
#     Override `patroni_image` to one that bundles pgaudit before listing it.
#   - Others (postgis, timescaledb, pg_trgm, ...) follow the same rule —
#     the image must bundle the .so file.
patroni_extensions:
  - pg_stat_statements

# Databases and users to create post-init. Each DB gets all listed extensions applied.
# Example:
#   patroni_databases:
#     - name: app_main
#       owner: app_main
#       users:
#         - name: app_main
#           password: "{{ vault_app_main_password }}"
#           roles: [LOGIN, CREATEDB]
#         - name: app_main_ro
#           password: "{{ vault_app_main_ro_password }}"
#           roles: [LOGIN]
#           grants:
#             - { privs: "CONNECT", on: "database" }
#             - { privs: "SELECT", on: "all-tables" }
patroni_databases: []
