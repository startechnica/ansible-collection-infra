---
# Patroni role defaults: postgres_exporter (Prometheus metrics, off by
# default).
# The role loads every file in defaults/main/ (see tasks/export_vars.yml).

# Monitoring — postgres_exporter (optional)
postgres_exporter_enabled: false
postgres_exporter_image: "prometheuscommunity/postgres-exporter:v0.19.1"
postgres_exporter_port: 9187
# Optional custom queries.yaml content — rendered verbatim into the
# exporter's queries file when non-empty. Empty (default) ships only the
# exporter's built-in collectors.
postgres_exporter_custom_queries: ""
