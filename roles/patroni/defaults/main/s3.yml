---
# Patroni role defaults: S3-compatible storage, shared by WAL-G
# (patroni_walg_storage_type: s3) and etcd snapshot uploads.
# The role loads every file in defaults/main/ (see tasks/export_vars.yml).

# S3/MinIO storage (set patroni_s3_bucket to enable WAL-G + etcd snapshot upload)
patroni_s3_bucket: ""
patroni_s3_endpoint: ""
patroni_s3_access_key: ""
patroni_s3_secret_key: ""
patroni_s3_region: "us-east-1"
patroni_s3_force_path_style: "true"
